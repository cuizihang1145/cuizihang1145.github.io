body{font-family:'Inter',-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#FAFAFE;color:#1A1A2E;line-height:1.8;min-height:100vh;transition:background .6s var(--ease-smooth),color .4s var(--ease-smooth);overflow-x:hidden}

.bg-glow{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-2;background:radial-gradient(circle at 30% 30%,#F6F2FF,#FFFFFF);transition:background .8s var(--ease-smooth)}

.glow-soft{position:fixed;width:70vw;height:70vw;background:radial-gradient(circle,rgba(160,130,230,.15),rgba(210,190,255,0) 70%);border-radius:50%;top:-25vh;right:-20vw;z-index:-1;filter:blur(80px);animation:floatGlow 20s infinite alternate var(--ease-smooth);pointer-events:none}

.glow-soft-2{position:fixed;width:50vw;height:50vw;background:radial-gradient(circle,rgba(200,180,255,.10),rgba(255,240,255,0) 70%);border-radius:50%;bottom:-15vh;left:-10vw;z-index:-1;filter:blur(70px);animation:floatGlow2 22s infinite alternate var(--ease-smooth);pointer-events:none}
body.dark .glow-soft-2{background:radial-gradient(circle,rgba(90,70,160,.15),rgba(30,20,60,0) 70%)}
@keyframes floatGlow{0%{transform:translate(0,0) scale(1);opacity:.3}100%{transform:translate(5%,8%) scale(1.2);opacity:.7}}
@keyframes floatGlow2{0%{transform:translate(0,0) scale(1);opacity:.2}100%{transform:translate(-6%,-5%) scale(1.3);opacity:.6}}

.container{max-width:1280px;margin:0 auto;padding:5rem 1.8rem 3rem;position:relative;min-height:100vh}

.top-buttons{position:fixed;top:20px;left:20px;right:20px;z-index:50;display:flex;justify-content:space-between;align-items:center;pointer-events:none;opacity:0;animation:fadeSlideDown .7s var(--ease-out) .05s forwards}
@keyframes fadeSlideDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
.top-buttons .left,.top-buttons .right{pointer-events:auto;display:flex;align-items:center;gap:.5rem}
.back-btn{background:rgba(255,255,255,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.8);border-radius:60px;padding:.5rem 1.2rem .5rem 1rem;display:flex;align-items:center;gap:.5rem;font-size:.85rem;font-weight:500;color:#4F4F78;text-decoration:none;transition:transform .35s var(--ease-out),opacity .35s var(--ease-out),background .35s var(--ease-out),box-shadow .35s var(--ease-out),border-color .35s var(--ease-out),color .35s var(--ease-out);box-shadow:0 6px 20px rgba(80,60,160,.10);cursor:pointer;font-family:'Inter',sans-serif;outline:none;position:relative;overflow:hidden}
.back-btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 12px 28px rgba(80,60,160,.22)}
.back-btn:active{transform:translateY(-1px) scale(.98);transition-duration:.1s}
.back-btn i{font-size:.9rem;transition:transform .35s var(--ease-spring)}
.back-btn:hover i{transform:translateX(-3px)}
body.dark .back-btn{background:rgba(30,28,50,.7);border-color:rgba(255,255,255,.08);color:#D0CAF0;box-shadow:0 6px 20px rgba(0,0,0,.3)}
body.dark .back-btn:hover{background:rgba(50,45,80,.85)}

.icon-btn{background:rgba(255,255,255,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.8);border-radius:60px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:#4F4F78;cursor:pointer;transition:all .45s var(--ease-spring);box-shadow:0 6px 20px rgba(80,60,160,.10);outline:none;position:relative}
.icon-btn:hover{transform:scale(1.08) rotate(15deg);box-shadow:0 12px 32px rgba(80,60,160,.24)}
.icon-btn:active{transform:scale(.92) rotate(-8deg);transition-duration:.12s}
.icon-btn.active{background:rgba(107,90,207,.15);border-color:rgba(107,90,207,.4);color:var(--accent)}
body.dark .icon-btn{background:rgba(30,28,50,.7);border-color:rgba(255,255,255,.08);color:#D0CAF0;box-shadow:0 6px 20px rgba(0,0,0,.3)}

.detail-back{position:fixed;top:82px;left:calc(max((100vw - 1280px) / 2, 0px) + 1.8rem);z-index:60;background:rgba(255,255,255,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.8);border-radius:60px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:1rem;color:#4F4F78;cursor:pointer;outline:none;box-shadow:0 6px 20px rgba(80,60,160,.10);opacity:0;visibility:hidden;transition:top .4s var(--ease-out),opacity .3s var(--ease-smooth),visibility .3s ease,background .3s ease,box-shadow .3s ease,color .3s ease,transform .3s var(--ease-out);transform:translateY(-6px)}
body.detail-active .detail-back{opacity:1;visibility:visible;transform:translateY(0)}

.back-to-top-btn{position:fixed;bottom:30px;right:24px;z-index:48;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.8);color:#4F4F78;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(80,60,160,.10);outline:none;padding:0;opacity:0;visibility:hidden;transform:translateY(16px) scale(.9);transition:opacity .35s var(--ease-smooth),transform .4s var(--ease-spring),visibility .35s ease,background .25s ease,box-shadow .25s ease}
.back-to-top-btn.show{opacity:1;visibility:visible;transform:translateY(0) scale(1)}
.back-to-top-btn:hover{background:rgba(255,255,255,.9);box-shadow:0 12px 28px rgba(80,60,160,.22);transform:translateY(-3px) scale(1.05)}
.back-to-top-btn:active{transform:translateY(0) scale(.95);transition-duration:.1s}
.back-to-top-btn i{transition:transform .35s var(--ease-spring)}
.back-to-top-btn:hover i{transform:translateY(-3px)}
body.dark .back-to-top-btn{background:rgba(30,28,50,.7);border-color:rgba(255,255,255,.08);color:#D0CAF0;box-shadow:0 6px 20px rgba(0,0,0,.3)}
body.dark .back-to-top-btn:hover{background:rgba(50,45,80,.9)}

.search-bar{position:relative;max-width:640px;margin:0 auto 1rem;animation:fadeSlideUp .7s var(--ease-out) .15s backwards}
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.search-bar::before{content:'';position:absolute;inset:-2px;border-radius:62px;background:linear-gradient(120deg,transparent 0%,rgba(107,90,207,.5) 25%,rgba(160,130,230,.5) 50%,rgba(107,90,207,.5) 75%,transparent 100%);background-size:200% 100%;opacity:0;transition:opacity .5s var(--ease-smooth);pointer-events:none;z-index:0;filter:blur(6px)}
.search-bar:focus-within::before{opacity:1;animation:borderSweep 3s linear infinite}
@keyframes borderSweep{0%{background-position:0% 0}100%{background-position:200% 0}}
.search-bar .search-icon{position:absolute;left:1.2rem;top:50%;transform:translateY(-50%);color:#8A8AB5;font-size:.9rem;pointer-events:none;transition:all .4s var(--ease-spring);z-index:2}
.search-bar:focus-within .search-icon{color:var(--accent);transform:translateY(-50%) scale(1.15) rotate(-8deg)}
.search-bar .clear-btn{position:absolute;right:1rem;top:50%;transform:translateY(-50%) scale(.6);width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.06);border:none;color:#8A8AB5;font-size:.65rem;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:all .35s var(--ease-spring);outline:none;z-index:2}
.search-bar.has-value .clear-btn{opacity:1;pointer-events:auto;transform:translateY(-50%) scale(1)}
.search-bar .clear-btn:hover{background:rgba(107,90,207,.15);color:var(--accent);transform:translateY(-50%) scale(1.15) rotate(90deg)}
body.dark .search-bar .clear-btn{background:rgba(255,255,255,.08);color:#9A96B8}
.search-bar input{position:relative;width:100%;padding:.9rem 3rem .9rem 3rem;border-radius:60px;border:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-family:inherit;font-size:.9rem;color:#1A1A2E;outline:none;transition:all .4s var(--ease-smooth);box-shadow:0 4px 16px rgba(80,60,160,.06);z-index:1}
.search-bar input::placeholder{color:#9A96B8}
.search-bar input:focus{border-color:transparent;background:rgba(255,255,255,.85);box-shadow:0 8px 32px rgba(80,60,160,.16);transform:translateY(-1px)}
.search-bar input:focus::placeholder{color:#B8B4D8}
body.dark .search-bar input{background:rgba(30,28,50,.7);border-color:rgba(255,255,255,.08);color:#E8E6F0}

body.dark .search-bar input::placeholder{color:#7A7AA0}
body.dark .search-bar .search-icon{color:#7A7AA0}

.stats-row{display:flex;align-items:center;justify-content:center;gap:.5rem;font-size:.72rem;color:#8A8AB5;margin-bottom:1.5rem;transition:color .3s ease;animation:fadeSlideUp .7s var(--ease-out) .2s backwards;min-height:1.2em}

.stats-row i{font-size:.7rem;opacity:.75;transition:transform .4s var(--ease-spring)}
.stats-row.updating i{transform:scale(1.3)}
.stats-row .sep{opacity:.4;margin:0 .1rem}

.album-grid{display:grid;gap:1.2rem}
.album-grid.layout-grid{align-items:stretch}
.album-grid.layout-masonry{display:block;column-gap:1.2rem}
.album-grid.layout-masonry .album-card{display:block;margin-bottom:1.2rem;break-inside:avoid;width:100%;-webkit-column-break-inside:avoid}
.album-grid.layout-list{display:flex;flex-direction:column;gap:.8rem}
.album-grid.layout-list .album-card{display:flex;flex-direction:row;align-items:stretch;width:100%}
.album-grid.layout-list .album-cover{width:200px;flex-shrink:0;aspect-ratio:auto;height:auto;min-height:130px}
.album-grid.layout-list .album-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;padding:1rem 1.4rem}
.album-grid.layout-list .album-desc{-webkit-line-clamp:3}
.album-grid.layout-list .album-title{font-size:1rem}
.album-grid.layout-list .album-cover-locked{gap:0}
.album-grid.layout-list .album-cover-locked i{font-size:1.6rem}
.album-grid.layout-list .album-cover-locked span{display:none}

.album-card{position:relative;border-radius:1rem;overflow:hidden;background:rgba(255,255,255,.6);border:1px solid rgba(0,0,0,.08);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 4px 16px rgba(80,60,160,.06);cursor:pointer;transition:transform .5s var(--ease-out),box-shadow .5s var(--ease-out),background .4s var(--ease-smooth),border-color .4s var(--ease-smooth);opacity:0;animation:cardIn .6s var(--ease-out) forwards;will-change:transform;display:flex;flex-direction:column;height:100%}
@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.album-card:hover{transform:translateY(-6px) scale(1.015);box-shadow:0 20px 44px rgba(80,60,160,.20)}
.album-card:active{transform:translateY(-2px) scale(.995);transition-duration:.15s}
body.dark .album-card{background:rgba(30,28,50,.7);border-color:rgba(255,255,255,.08)}
body.dark .album-card:hover{background:rgba(50,45,80,.85);box-shadow:0 20px 44px rgba(0,0,0,.45)}

.album-cover{position:relative;aspect-ratio:4/3;overflow:hidden;background:linear-gradient(135deg,rgba(107,90,207,.15),rgba(160,130,230,.1));flex-shrink:0}
.album-grid.layout-masonry .album-cover{aspect-ratio:auto;height:180px}
.album-cover .cover-skeleton{position:absolute;inset:0;background:linear-gradient(110deg,rgba(107,90,207,.06) 30%,rgba(160,130,230,.15) 50%,rgba(107,90,207,.06) 70%);background-size:200% 100%;animation:shimmer 1.6s linear infinite;opacity:1;transition:opacity .5s var(--ease-smooth);z-index:1}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.album-cover.loaded .cover-skeleton{opacity:0;pointer-events:none}
.album-cover img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transform:scale(1.08);transition:opacity .7s var(--ease-smooth),transform 1s var(--ease-out);will-change:opacity,transform;position:absolute;inset:0;z-index:0}
.album-cover.loaded img{opacity:1;transform:scale(1)}

.album-cover-locked{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;background:linear-gradient(135deg,rgba(107,90,207,.18),rgba(160,130,230,.12));color:#6B5ACF;z-index:2;padding:.5rem;text-align:center}

.album-info{padding:.9rem 1.1rem 1rem;position:relative;z-index:2;flex:1;display:flex;flex-direction:column}

.album-desc code{font-family:'JetBrains Mono','Courier New',monospace;font-size:.9em;background:rgba(0,0,0,.06);padding:.05rem .3rem;border-radius:3px;color:#D14C4C}

.album-meta{display:flex;flex-wrap:wrap;gap:.3rem .8rem;font-size:.68rem;color:#8A8AB5;margin-top:auto}

body.hide-desc .album-desc{display:none!important}

.list-view{transition:opacity .4s var(--ease-smooth),transform .4s var(--ease-smooth)}
.list-view.hidden{display:none}

.detail-view{display:none}

.detail-header{display:flex;align-items:flex-start;gap:1rem;margin-bottom:1.5rem;padding:0 0 1.2rem 64px;border-bottom:1px solid rgba(0,0,0,.06);pointer-events:none}

.photo-grid{display:grid;gap:.8rem}

<div class="bg-glow"></div>
<div class="glow-soft"></div>
<div class="glow-soft-2"></div>

<div class="top-buttons">

    <div class="right">

    <div id="footer-root"></div>
</div>

                    <button class="segment-btn" data-value="4">4 列</button>

            </div>

    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    var currentTheme = localStorage.getItem('ks-theme') || (prefersDark ? 'dark' : 'light');
    function setTheme(t){
        document.body.classList.toggle('dark', t === 'dark');
        themeIcon.className = t === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        localStorage.setItem('ks-theme', t);
        currentTheme = t;
    }
    setTheme(currentTheme);

    function resolveImageUrl(src){
        if(!src) return '';
        if(/^(https?:)?\/\//i.test(src)) return src;
        if(/^data:/i.test(src)) return src;
        if(/^blob:/i.test(src)) return src;
        return IMG_BASE + src;
    }

    function loadPrefs(){
        try {
            var raw = localStorage.getItem(STORAGE_KEY);
            if(!raw) return Object.assign({}, defaultPrefs);
            return Object.assign({}, defaultPrefs, JSON.parse(raw));
        } catch(e){
            return Object.assign({}, defaultPrefs);
        }
    }
    function savePrefs(){
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(prefs)); } catch(e){}
    }

    function getContentWidth(){
        if(!mainContainer) return window.innerWidth;
        var styles = getComputedStyle(mainContainer);
        var pl = parseFloat(styles.paddingLeft) || 0;
        var pr = parseFloat(styles.paddingRight) || 0;
        var w = mainContainer.getBoundingClientRect().width - pl - pr;
        return Math.max(1, w);
    }

    function calcMaxCols(minColWidth, hardMax){
        var gap = 13;
        var avail = getContentWidth();
        var n = Math.floor((avail + gap) / (minColWidth + gap));
        return Math.max(1, Math.min(hardMax, n));
    }

    function getMaxAlbumCols(){ return calcMaxCols(220, 4); }
    function getMaxPhotoCols(){ return calcMaxCols(85, 4); }

    function applyColsVisibility(groupName, maxCols){
        var group = document.querySelector('.segmented[data-group="' + groupName + '"]');
        if(!group) return;
        var groupContainer = group.closest('.settings-group');
        var visibleCount = 0;
        group.querySelectorAll('.segment-btn').forEach(function(btn){
            var v = parseInt(btn.getAttribute('data-value'), 10);
            if(v <= maxCols){
                btn.classList.remove('hidden');
                visibleCount++;
            } else {
                btn.classList.add('hidden');
            }
        });
        if(groupContainer){
            groupContainer.classList.toggle('hidden', visibleCount <= 1);
        }
    }

    function updateSettingsVisibility(){
        applyColsVisibility('albumCols', getMaxAlbumCols());
        applyColsVisibility('photoCols', getMaxPhotoCols());
    }

    function autoFixPrefs(){
        var maxAlbumCols = getMaxAlbumCols();
        var maxPhotoCols = getMaxPhotoCols();
        var changed = false;
        if(parseInt(prefs.albumCols, 10) > maxAlbumCols){
            prefs.albumCols = String(Math.max(1, maxAlbumCols));
            changed = true;
        }
        if(parseInt(prefs.photoCols, 10) > maxPhotoCols){
            prefs.photoCols = String(Math.max(1, maxPhotoCols));
            changed = true;
        }
        if(changed) savePrefs();
    }

    function applyGridLayout(el, layout, cols, maxCols){
        var effectiveCols = Math.min(parseInt(cols, 10) || 3, maxCols);
        if(effectiveCols < 1) effectiveCols = 1;

        el.classList.remove('layout-grid','layout-masonry','layout-list');
        el.classList.remove('cols-1','cols-2','cols-3','cols-4');
        el.classList.add('layout-' + layout);
        el.classList.add('cols-' + effectiveCols);

        el.style.gridTemplateColumns = '';
        el.style.columnCount = '';
        el.style.gap = '';
        el.style.columnGap = '';

        if(layout === 'grid'){
            el.style.display = 'grid';
            el.style.gridTemplateColumns = 'repeat(' + effectiveCols + ', 1fr)';
            el.style.gap = '.8rem';
        } else if(layout === 'masonry'){
            el.style.display = 'block';
            el.style.columnCount = effectiveCols;
            el.style.columnGap = '.8rem';
        } else {
            el.style.display = 'flex';
            el.style.flexDirection = 'column';
            el.style.gap = '.6rem';
        }
    }

    function updateConflictStates(){
        var altAlwaysSw = document.querySelector('[data-toggle="altAlways"]');
        if(altAlwaysSw){
            var altRow = altAlwaysSw.closest('.toggle-row');
            if(!prefs.alt){
                altRow.classList.add('disabled');
                altAlwaysSw.classList.remove('active');
            } else {
                altRow.classList.remove('disabled');
                altAlwaysSw.classList.toggle('active', !!prefs.altAlways);
            }
        }

        var exifAlwaysSw = document.querySelector('[data-toggle="exifAlways"]');
        if(exifAlwaysSw){
            var exifRow = exifAlwaysSw.closest('.toggle-row');
            if(!prefs.exif){
                exifRow.classList.add('disabled');
                exifAlwaysSw.classList.remove('active');
            } else {
                exifRow.classList.remove('disabled');
                exifAlwaysSw.classList.toggle('active', !!prefs.exifAlways);
            }
        }

        var liveBadgeSw = document.querySelector('[data-toggle="liveBadge"]');
        if(liveBadgeSw){
            var badgeRow = liveBadgeSw.closest('.toggle-row');
            if(!prefs.live){
                badgeRow.classList.add('disabled');
                liveBadgeSw.classList.remove('active');
            } else {
                badgeRow.classList.remove('disabled');
                liveBadgeSw.classList.toggle('active', !!prefs.liveBadge);
            }
        }

        var liveDlSeg = document.querySelector('.segmented[data-group="liveDownload"]');
        if(liveDlSeg){
            if(!prefs.download){
                liveDlSeg.classList.add('disabled');
            } else {
                liveDlSeg.classList.remove('disabled');
            }
        }

        var albumColsGroup = document.querySelector('.settings-group[data-settings-group="albumCols"]');
        if(albumColsGroup){
            if(prefs.albumLayout === 'list'){
                albumColsGroup.classList.add('disabled');

                albumColsGroup.classList.remove('disabled');

    function applyPrefs(){
        autoFixPrefs();

        document.body.classList.toggle('hide-desc', !prefs.desc);
        document.body.classList.toggle('hide-meta', !prefs.meta);
        document.body.classList.toggle('hide-download', !prefs.download);
        document.body.classList.toggle('hide-alt', !prefs.alt);
        document.body.classList.toggle('hide-exif', !prefs.exif);
        document.body.classList.toggle('hide-live-badge', !prefs.liveBadge);
        document.body.classList.toggle('no-anim', !prefs.anim);

        var maxAlbumCols = getMaxAlbumCols();
        var maxPhotoCols = getMaxPhotoCols();

        applyGridLayout(gridEl, prefs.albumLayout, prefs.albumCols, maxAlbumCols);
        applyGridLayout(photoGrid, prefs.photoLayout, prefs.photoCols, maxPhotoCols);

        if(prefs.albumLayout === 'grid') gridEl.style.gap = '1.2rem';
        if(prefs.albumLayout === 'masonry') gridEl.style.columnGap = '1.2rem';
        if(prefs.albumLayout === 'list') gridEl.style.gap = '.8rem';
        if(prefs.photoLayout === 'grid') photoGrid.style.gap = '.8rem';

        document.querySelectorAll('.segmented').forEach(function(group){
            var g = group.getAttribute('data-group');
            group.querySelectorAll('.segment-btn').forEach(function(btn){
                btn.classList.toggle('active', String(prefs[g]) === btn.getAttribute('data-value'));
            });
        });
        document.querySelectorAll('.toggle-switch').forEach(function(sw){
            var t = sw.getAttribute('data-toggle');
            sw.classList.toggle('active', !!prefs[t]);
        });

        updateSettingsVisibility();
        updateConflictStates();
    }

    function bindSettings(){
        document.querySelectorAll('.segmented').forEach(function(group){
            var g = group.getAttribute('data-group');
            group.querySelectorAll('.segment-btn').forEach(function(btn){
                btn.addEventListener('click', function(){

                    applyPrefs();

        document.querySelectorAll('.toggle-switch').forEach(function(sw){
            sw.addEventListener('click', function(){
                var row = sw.closest('.toggle-row');

                }

    var resizeTimer = null;

    var scrollRaf = null;
    function updateScrollUI(){
        var y = window.scrollY || window.pageYOffset || 0;
        var isDetail = detailView.classList.contains('active');
        document.body.classList.toggle('hide-top-back', isDetail && y > 60);
        if(!isScrollingToTop){
            backToTopBtn.classList.toggle('show', y > 400);
        }
    }
    window.addEventListener('scroll', function(){
        if(scrollRaf) return;
        scrollRaf = requestAnimationFrame(function(){
            updateScrollUI();
            scrollRaf = null;
        });
    }, {passive:true});

    function scrollToTopAnimated(){
        if(isScrollingToTop) return;
        var startY = window.scrollY || window.pageYOffset || 0;
        if(startY === 0){
            backToTopBtn.classList.remove('show');
            return;
        }
        isScrollingToTop = true;
        var startTime = performance.now();
        var duration = 400;
        function step(now){
            var t = Math.min((now - startTime) / duration, 1);
            var ease = 1 - Math.pow(1 - t, 3);
            window.scrollTo(0, startY * (1 - ease));
            if(t < 1){
                requestAnimationFrame(step);
            } else {
                window.scrollTo(0, 0);
                isScrollingToTop = false;
                backToTopBtn.classList.remove('show');
            }
        }
        requestAnimationFrame(step);
    }

    backToTopBtn.addEventListener('click', scrollToTopAnimated);

    function restoreListScroll(){
        if(!pendingRestoreScroll) return;
        pendingRestoreScroll = false;
        var target = listScrollY;
        requestAnimationFrame(function(){
            window.scrollTo(0, target);
            requestAnimationFrame(function(){
                window.scrollTo(0, target);
                updateScrollUI();
            });
        });
    }

    function showToast(msg, icon){

    function escapeHtml(text){
        if(!text) return '';
        var d = document.createElement('div');
        d.textContent = text;
        return d.innerHTML;
    }

    function renderMd(text){
        if(!text) return '';
        if(window.KSMarkdown && window.KSMarkdown.renderMarkdown){
            return window.KSMarkdown.renderMarkdown(text);
        }
        return escapeHtml(text);
    }

    function attachImageLoad(wrapper, img){
        function done(){
            wrapper.classList.add('loaded');
            img.classList.add('loaded');
        }
        if(img.complete && img.naturalWidth !== 0){
            requestAnimationFrame(done);
        } else {
            img.addEventListener('load', done, {once:true});
            img.addEventListener('error', done, {once:true});
        }
    }

    function getThumb(item){ return item.thumb || item.src; }
    function getCover(album){
        if(album.cover) return album.cover;
        if(album.images && album.images[0]) return getThumb(album.images[0]);
        return '';
    }

    function pad2(n){ return n < 10 ? '0' + n : String(n); }
    function fmtNum(n){
        if(typeof n !== 'number') return String(n);
        return Number.isInteger(n) ? String(n) : n.toFixed(1);
    }

    function normalizeExif(raw){
        if(!raw) return null;
        var out = {};
        var camera = [raw.Make, raw.Model].filter(Boolean).join(' ').trim();
        if(camera) out.camera = camera;
        if(raw.LensModel) out.lens = String(raw.LensModel).trim();
        if(raw.FNumber) out.aperture = 'f/' + fmtNum(raw.FNumber);
        if(raw.ExposureTime){
            var t = raw.ExposureTime;
            if(typeof t === 'number'){
                if(t >= 1) out.shutter = fmtNum(t) + 's';
                else out.shutter = '1/' + Math.round(1 / t) + 's';
            } else {
                out.shutter = String(t) + 's';
            }
        }
        if(raw.ISO) out.iso = 'ISO ' + raw.ISO;
        if(raw.FocalLength) out.focal = fmtNum(raw.FocalLength) + 'mm';
        if(raw.DateTimeOriginal){
            var d = raw.DateTimeOriginal;
            if(d instanceof Date && !isNaN(d)){
                out.date = d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
            } else if(typeof d === 'string'){
                out.date = d;
            }
        }
        return Object.keys(out).length ? out : null;
    }

    function fetchExifFromImage(url){
        return new Promise(function(resolve){
            if(typeof exifr === 'undefined'){ resolve(null); return; }
            if(!url){ resolve(null); return; }
            exifr.parse(url, {
                pick: ['Make','Model','LensModel','FNumber','ExposureTime','ISO','FocalLength','DateTimeOriginal'],
                translateValues: false,
                reviveValues: false,
                silentErrors: true
            }).then(function(raw){
                resolve(normalizeExif(raw));
            }).catch(function(){ resolve(null); });
        });
    }

    function buildExifTagsHtml(exif){
        if(!exif) return '';
        var tags = [];
        if(exif.camera) tags.push(exif.camera);
        if(exif.lens) tags.push(exif.lens);
        if(exif.focal) tags.push(exif.focal);
        if(exif.aperture) tags.push(exif.aperture);
        if(exif.shutter) tags.push(exif.shutter);
        if(exif.iso) tags.push(exif.iso);
        if(exif.date) tags.push(exif.date);
        if(!tags.length) return '';
        var html = '<div class="pio-exif">';
        tags.forEach(function(t){
            html += '<span class="pio-exif-item">' + escapeHtml(t) + '</span>';
        });
        html += '</div>';
        return html;
    }

    function buildInfoOverlayHtml(alt, exif){
        var hasAlt = alt && alt.length;
        var exifHtml = buildExifTagsHtml(exif);
        if(!hasAlt && !exifHtml) return '';
        var html = '<div class="photo-info-overlay">';
        if(hasAlt) html += '<div class="pio-alt">' + escapeHtml(alt) + '</div>';
        html += exifHtml;
        html += '</div>';
        return html;
    }

    function bufToBase64(buf){
        var bytes = new Uint8Array(buf);
        var bin = '';
        for(var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin);
    }
    function base64ToBuf(b64){
        var binary = atob(b64);
        var bytes = new Uint8Array(binary.length);
        for(var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes;
    }

    async function gunzipStr(buf){
        var ds = new DecompressionStream('gzip');
        var writer = ds.writable.getWriter();
        writer.write(buf);
        writer.close();
        return await new Response(ds.readable).text();
    }

    async function deriveKey(password, salt, usages){
        var enc = new TextEncoder();
        var km = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
        return crypto.subtle.deriveKey(
            { name:'PBKDF2', salt: salt, iterations: ITERATIONS, hash:'SHA-256' },
            km,
            { name:'AES-GCM', length:256 },
            false,
            usages
        );
    }

    async function decryptPayload(entry, password){
        var salt = base64ToBuf(entry.salt);
        var iv = base64ToBuf(entry.iv);
        var ct = base64ToBuf(entry.payload);
        var key = await deriveKey(password, salt, ['decrypt']);
        var pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv: iv }, key, ct);
        var text = await gunzipStr(pt);
        return { key: key, data: JSON.parse(text) };
    }

    async function decryptImageBlob(src, ivBase64, key){
        var url = resolveImageUrl(src);
        var res = await fetch(url);
        if(!res.ok) throw new Error('HTTP ' + res.status);
        var ct = await res.arrayBuffer();
        var iv = base64ToBuf(ivBase64);
        var pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv: iv }, key, ct);
        return new Blob([pt]);
    }

    function updateStats(){
        var albumCount = filteredAlbums.length;
        var photoCount = 0;
        filteredAlbums.forEach(function(a){
            if(!a.encrypted && a.images) photoCount += a.images.length;
        });
        var hasFilter = searchInput.value.trim().length > 0;
        statsRow.classList.add('updating');
        setTimeout(function(){ statsRow.classList.remove('updating'); }, 300);
        if(albumCount === 0){
            statsText.textContent = hasFilter ? '没有匹配的相册' : '还没有相册';
        } else if(photoCount === 0){
            statsText.innerHTML = '共 ' + albumCount + ' 个相册' + (hasFilter ? '（已筛选）' : '');
        } else {
            statsText.innerHTML = '共 ' + albumCount + ' 个相册 <span class="sep">·</span> ' + photoCount + ' 张照片' + (hasFilter ? '（已筛选）' : '');
        }
    }

    function loadAlbums(){
        fetch('albums/albums.json', {cache:'no-cache'})
            .then(function(res){
                if(!res.ok) throw new Error('加载失败');
                return res.json();
            })
            .then(function(data){
                allAlbums = (data.albums || []).filter(function(a){ return a.delete !== true; });
                allAlbums.sort(function(a, b){
                    var oa = a.order || 0;
                    var ob = b.order || 0;
                    if(oa !== ob) return ob - oa;
                    return (b.date || '').localeCompare(a.date || '');
                });
                applyFilter('');
                handleRoute();
                setTimeout(applyPrefs, 50);
            })
            .catch(function(err){
                console.error(err);
                gridEl.innerHTML = '<div class="empty-state"><i class="far fa-frown"></i><p>加载相册失败</p></div>';
            });
    }

    function applyFilter(keyword){
        var k = (keyword || '').trim().toLowerCase();
        if(!k){
            filteredAlbums = allAlbums.slice();
        } else {
            filteredAlbums = allAlbums.filter(function(a){
                var tags = (a.tags || []).join(' ');
                var fields = [
                    a.title || '',
                    a.user || 'ks',
                    a.date || '',
                    a.desc || '',
                    a.location || '',
                    tags
                ].join(' ').toLowerCase();
                return fields.indexOf(k) !== -1;
            });
        }
        renderGrid();
        updateStats();
    }

    function renderGrid(){
        if(filteredAlbums.length === 0){
            gridEl.innerHTML = '<div class="empty-state"><i class="fas fa-images"></i><p>没有找到相册</p></div>';
            return;
        }
        var html = '';
        filteredAlbums.forEach(function(album, idx){
            html += buildCard(album, idx);
        });
        gridEl.innerHTML = html;

        gridEl.querySelectorAll('.album-card').forEach(function(card){
            card.style.animationDelay = (card.getAttribute('data-idx') * 55) + 'ms';
            card.addEventListener('click', function(){
                var idx = parseInt(card.getAttribute('data-idx'), 10);
                openAlbumDetail(filteredAlbums[idx]);
            });
            var cover = card.querySelector('.album-cover');
            var img = cover ? cover.querySelector('img') : null;
            if(cover && img) attachImageLoad(cover, img);
        });
    }

    function buildCard(album, idx){
        var coverHtml = '';
        if(album.encrypted){
            coverHtml = '<div class="album-cover-locked"><i class="fas fa-lock"></i><span>加密相册，请解密查看～</span></div>';
        } else {
            var first = getCover(album);
            if(first){
                coverHtml = '<span class="cover-skeleton"></span><img src="' + escapeHtml(resolveImageUrl(first)) + '" alt="" loading="lazy">';
            } else {
                coverHtml = '<div class="album-cover-locked"><i class="fas fa-image"></i><span>暂无图片</span></div>';
            }
        }

        var meta = '';
        meta += '<span><i class="fas fa-user"></i> ' + escapeHtml(album.user || 'ks') + '</span>';
        if(album.date) meta += '<span><i class="fas fa-calendar"></i> ' + escapeHtml(album.date) + '</span>';
        if(album.location) meta += '<span><i class="fas fa-location-dot"></i> ' + escapeHtml(album.location) + '</span>';
        if(!album.encrypted && album.images){
            meta += '<span><i class="fas fa-image"></i> ' + album.images.length + ' 张</span>';
        } else if(album.encrypted){
            meta += '<span><i class="fas fa-lock"></i> 加密</span>';
        }

        var desc = '';
        if(album.encrypted){
            desc = '<div class="album-desc">这个相册被加密保护，输入正确密码即可解锁查看完整内容。解锁后可以浏览其中的全部照片与 Live 图，自由切换布局，查看 EXIF 拍摄信息，也能把喜欢的原图下载收藏。</div>';
        } else if(album.desc){
            desc = '<div class="album-desc">' + renderMd(album.desc) + '</div>';
        }

        var tags = (!album.encrypted && album.tags) ? album.tags : [];
        var tagsHtml = '';
        if(tags.length > 0){
            tagsHtml = '<div class="album-tags">';
            tags.forEach(function(tag){
                tagsHtml += '<span class="album-tag">' + escapeHtml(tag) + '</span>';
            });
            tagsHtml += '</div>';
        }

        return '<div class="album-card" data-idx="' + idx + '">' +
            '<div class="album-cover">' + coverHtml + '</div>' +
            '<div class="album-info">' +
                '<div class="album-title">' + escapeHtml(album.title || '无标题') + '</div>' +
                desc +
                tagsHtml +
                '<div class="album-meta">' + meta + '</div>' +
            '</div>' +
        '</div>';
    }

    function setHash(hash){
        isNavigating = true;
        if(hash) location.hash = hash;
        else history.replaceState(null, '', location.pathname + location.search);
        setTimeout(function(){ isNavigating = false; }, 50);
    }

    function openAlbumDetail(album){
        listScrollY = window.scrollY || window.pageYOffset || 0;
        if(album.encrypted){
            pendingAlbum = album;
            pwdSub.textContent = '「' + (album.title || '相册') + '」需要密码';
            openPwd();
            return;
        }
        if(!album.images || album.images.length === 0){
            showToast('这个相册还没有图片', 'fa-image');
            return;
        }
        if(location.hash !== '#album=' + encodeURIComponent(album.id)){
            setHash('#album=' + encodeURIComponent(album.id));
        }
        currentAlbum = album;
        renderDetailView(album);
    }

    function openPwd(){
        pwdOverlay.classList.add('active');
        pwdInput.value = '';
        pwdError.textContent = '';
        pwdInput.classList.remove('error');
        setTimeout(function(){ pwdInput.focus(); }, 100);
    }
    function closePwd(){
        pwdOverlay.classList.remove('active');
        pwdInput.value = '';
        pwdError.textContent = '';
        pwdInput.classList.remove('error');
        pendingAlbum = null;
    }

    async function tryUnlock(){
        if(!pendingAlbum) return;
        var pwd = pwdInput.value;
        if(!pwd){
            pwdError.textContent = '请输入密码';
            pwdInput.classList.add('error');
            return;
        }
        pwdConfirm.disabled = true;
        pwdConfirm.textContent = '解密中...';
        try {
            var result = await decryptPayload(pendingAlbum, pwd);
            var album = pendingAlbum;
            currentAlbum = album;
            currentKey = result.key;
            album._decryptedData = result.data;
            closePwd();
            if(location.hash !== '#album=' + encodeURIComponent(album.id)){
                setHash('#album=' + encodeURIComponent(album.id));
            }
            renderEncryptedDetailView(album, result.data);
            showToast('解锁成功', 'fa-check-circle');
        } catch(e){
            console.error('解密失败', e);
            pwdError.textContent = '密码错误，解不开';
            pwdInput.classList.add('error');
            pwdBox.classList.remove('shake');
            void pwdBox.offsetWidth;
            pwdBox.classList.add('shake');
            setTimeout(function(){ pwdInput.select(); }, 100);
        } finally {
            pwdConfirm.disabled = false;
            pwdConfirm.textContent = '解锁';
        }
    }

    function renderDetailView(album){
        var meta = '';
        meta += '<span><i class="fas fa-user"></i> ' + escapeHtml(album.user || 'ks') + '</span>';
        if(album.date) meta += '<span><i class="fas fa-calendar"></i> ' + escapeHtml(album.date) + '</span>';
        if(album.location) meta += '<span><i class="fas fa-location-dot"></i> ' + escapeHtml(album.location) + '</span>';
        meta += '<span><i class="fas fa-image"></i> ' + album.images.length + ' 张</span>';

        var descHtml = album.desc ? renderMd(album.desc) : '';
        var tagsHtml = '';
        if(album.tags && album.tags.length > 0){
            tagsHtml = '<div class="detail-tags">';
            album.tags.forEach(function(tag){
                tagsHtml += '<span class="detail-tag" data-tag="' + escapeHtml(tag) + '"><i class="fas fa-tag"></i> ' + escapeHtml(tag) + '</span>';
            });
            tagsHtml += '</div>';
        }

        buildDetailPage(
            album.title || '无标题',
            descHtml + tagsHtml,
            meta,
            album.images,
            false
        );
    }

    function renderEncryptedDetailView(album, data){
        var images = data.images || [];
        var meta = '';
        meta += '<span><i class="fas fa-user"></i> ' + escapeHtml(album.user || 'ks') + '</span>';
        if(data.date) meta += '<span><i class="fas fa-calendar"></i> ' + escapeHtml(data.date) + '</span>';
        else if(album.date) meta += '<span><i class="fas fa-calendar"></i> ' + escapeHtml(album.date) + '</span>';
        if(data.location) meta += '<span><i class="fas fa-location-dot"></i> ' + escapeHtml(data.location) + '</span>';
        meta += '<span><i class="fas fa-image"></i> ' + images.length + ' 张</span>';
        meta += '<span><i class="fas fa-lock"></i> 已解密</span>';

        var descHtml = data.desc ? renderMd(data.desc) : '';
        var tagsHtml = '';
        if(data.tags && data.tags.length > 0){
            tagsHtml = '<div class="detail-tags">';
            data.tags.forEach(function(tag){
                tagsHtml += '<span class="detail-tag" data-tag="' + escapeHtml(tag) + '"><i class="fas fa-tag"></i> ' + escapeHtml(tag) + '</span>';
            });
            tagsHtml += '</div>';
        }

        buildDetailPage(
            album.title || '无标题',
            descHtml + tagsHtml,
            meta,
            images,
            true
        );
    }

    function buildDetailPage(title, descHtml, meta, images, isEncrypted){
        detailTitle.textContent = title;
        detailDesc.innerHTML = descHtml;
        detailMeta.innerHTML = meta;

        var photoHtml = '';
        images.forEach(function(item, i){
            var altText = item.alt || '';
            var infoHtml = buildInfoOverlayHtml(altText, item.exif || null);
            var hasLive = !!item.live && prefs.live && !isEncrypted;
            var liveBadge = hasLive ? '<button class="photo-live-badge" type="button" aria-label="播放或停止"><span class="live-dot"></span><span class="live-text"></span></button>' : '';
            var videoTag = hasLive ? '<video class="photo-video" data-src="' + escapeHtml(item.live) + '" muted playsinline preload="none"></video>' : '';
            var dlTitle = hasLive ? '下载 (封面 / Live)' : '下载原图';
            var itemClass = 'photo-item' + (hasLive ? ' is-live' : '');
            if(prefs.alt && prefs.altAlways && altText) itemClass += ' always-alt';
            if(prefs.exif && prefs.exifAlways && item.exif) itemClass += ' always-exif';
            photoHtml += '<div class="' + itemClass + '" data-idx="' + i + '">' +
                '<span class="photo-skeleton"></span>' +
                '<img class="photo-img" alt="' + escapeHtml(altText) + '" loading="lazy">' +
                videoTag +
                liveBadge +
                '<button class="photo-download" data-idx="' + i + '" title="' + dlTitle + '" aria-label="' + dlTitle + '"><i class="fas fa-download"></i></button>' +
                infoHtml +
            '</div>';
        });
        photoGrid.innerHTML = photoHtml;

        photoGrid.querySelectorAll('.photo-item').forEach(function(el){
            var i = parseInt(el.getAttribute('data-idx'), 10);
            var item = images[i];
            var isLive = !!item.live && prefs.live && !isEncrypted;
            var videoEl = el.querySelector('.photo-video');
            var badgeEl = el.querySelector('.photo-live-badge');
            el.style.animationDelay = (i * 40) + 'ms';

            var img = el.querySelector('.photo-img');

            if(isEncrypted){
                loadEncryptedImage(el, img, item, i);
            } else {
                img.src = escapeHtml(resolveImageUrl(getThumb(item)));
                if(img) attachImageLoad(el, img);
            }

            el.addEventListener('click', function(e){
                if(e.target.closest('.photo-download')) return;
                if(e.target.closest('.photo-live-badge')) return;
                openLightbox(i);
            });

            if(isLive && videoEl){
                var srcLoaded = false;
                el._liveLocked = false;

                var loadAndPlay = function(){
                    if(!srcLoaded){
                        videoEl.src = resolveImageUrl(videoEl.getAttribute('data-src'));
                        videoEl.load();
                        srcLoaded = true;
                    }
                    var p = videoEl.play();
                    if(p && p.catch) p.catch(function(){});
                    el.classList.add('is-playing');
                };
                var stopLive = function(){
                    try { videoEl.pause(); videoEl.currentTime = 0; } catch(e){}
                    el.classList.remove('is-playing');
                };

                videoEl.addEventListener('ended', function(){
                    el._liveLocked = false;
                    stopLive();
                });

                if(supportsHover){
                    el.addEventListener('mouseenter', function(){
                        if(el._liveLocked) return;
                        loadAndPlay();
                    });
                    el.addEventListener('mouseleave', function(){
                        if(el._liveLocked) return;
                        stopLive();
                    });
                }

                if(badgeEl){
                    badgeEl.addEventListener('click', function(e){
                        e.stopPropagation();
                        e.preventDefault();
                        if(el._liveLocked){
                            el._liveLocked = false;
                            stopLive();
                        } else {
                            el._liveLocked = true;
                            loadAndPlay();
                        }
                    });
                    badgeEl.addEventListener('touchstart', function(e){
                        e.stopPropagation();
                    }, {passive:true});
                    badgeEl.addEventListener('touchend', function(e){
                        e.stopPropagation();
                    }, {passive:true});
                }
            }

            if(!isEncrypted && !item.exif && !item._exifTried){
                if(prefs.exifAlways){
                    item._exifTried = true;
                    fetchExifFromImage(resolveImageUrl(item.src)).then(function(exif){
                        if(exif){
                            item.exif = exif;
                            var overlay = el.querySelector('.photo-info-overlay');
                            var newHtml = buildInfoOverlayHtml(item.alt || '', exif);
                            if(overlay){
                                overlay.outerHTML = newHtml;
                            } else {
                                el.insertAdjacentHTML('beforeend', newHtml);
                            }
                            if(prefs.exif && prefs.exifAlways){
                                el.classList.add('always-exif');
                            }
                        }
                    });
                } else {
                    item._exifTried = true;
                    el.addEventListener('mouseenter', function onEnter(){
                        el.removeEventListener('mouseenter', onEnter);
                        fetchExifFromImage(resolveImageUrl(item.src)).then(function(exif){
                            if(exif){
                                item.exif = exif;
                                var overlay = el.querySelector('.photo-info-overlay');
                                var newHtml = buildInfoOverlayHtml(item.alt || '', exif);
                                if(overlay){
                                    overlay.outerHTML = newHtml;
                                } else {
                                    el.insertAdjacentHTML('beforeend', newHtml);
                                }
                            }
                        });
                    }, {once:true});
                }
            }
        });

        photoGrid.querySelectorAll('.photo-download').forEach(function(btn){
            btn.addEventListener('click', function(e){
                e.stopPropagation();
                var i = parseInt(btn.getAttribute('data-idx'), 10);
                if(isEncrypted){
                    var item = images[i];
                    if(item._blobUrl){
                        doDownloadBlob(item._blobUrl, (currentAlbum.title || 'photo') + '_' + (i + 1) + '.jpg');
                    } else {
                        showToast('图片还没解密完', 'fa-info-circle');
                    }
                } else {
                    handleDownloadClick(images[i], currentAlbum, i);
                }
            });
        });

        applyGridLayout(photoGrid, prefs.photoLayout, prefs.photoCols, getMaxPhotoCols());
        if(prefs.photoLayout === 'grid') photoGrid.style.gap = '.8rem';

        listView.classList.add('hidden');
        detailView.classList.add('active');
        document.body.classList.add('detail-active');
        window.scrollTo({top:0, behavior:'smooth'});
        requestAnimationFrame(updateScrollUI);

        detailDesc.querySelectorAll('.detail-tag').forEach(function(el){
            el.addEventListener('click', function(e){
                e.preventDefault();
                e.stopPropagation();
                var tag = this.getAttribute('data-tag');
                if(!tag) return;
                listScrollY = 0;
                closeDetail();
                searchInput.value = tag;
                searchBar.classList.add('has-value');
                applyFilter(tag);
                window.scrollTo({top:0, behavior:'smooth'});
            });
        });

        setTimeout(function(){
            if(currentAlbum) refreshWaline(currentAlbum.id);
        }, 200);
    }

    async function loadEncryptedImage(el, img, item, idx){
        try {
            var blob = await decryptImageBlob(item.src, item.iv, currentKey);
            var url = URL.createObjectURL(blob);
            detailBlobUrls.push(url);
            item._blobUrl = url;
            img.onload = function(){ el.classList.add('loaded'); };
            img.onerror = function(){ el.classList.add('decrypt-failed'); };
            img.src = url;
        } catch(e){
            console.error('解密图片失败', item.src, e);
            el.classList.add('decrypt-failed');
        }
    }

    function doDownloadBlob(url, filename){
        var a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('开始下载', 'fa-check-circle');
    }

    function handleDownloadClick(item, album, index){
        if(!item) return;
        if(item.live){
            if(prefs.liveDownload === 'cover'){
                doDownload(resolveImageUrl(item.src), album, index, false);
            } else if(prefs.liveDownload === 'live'){
                doDownload(resolveImageUrl(item.live), album, index, true);
            } else {
                pendingDownload = { item: item, album: album, index: index };
                liveDlOverlay.classList.add('active');
            }
        } else {
            doDownload(resolveImageUrl(item.src), album, index, false);
        }
    }

    function doDownload(url, album, index, isLive){
        if(!url) return;
        var ext = isLive ? '.mp4' : '.jpg';
        try {
            var match = url.match(/\.(jpg|jpeg|png|gif|webp|avif|mp4|mov|m4v|webm|ogv)(\?|$)/i);
            if(match) ext = '.' + match[1].toLowerCase();
        } catch(e){}
        var suffix = isLive ? '_live' : '';
        var filename = (album.title || 'photo') + '_' + (index + 1) + suffix + ext;
        var a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.target = '_blank';
        a.rel = 'noopener';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast(isLive ? '开始下载 Live 视频' : '开始下载封面', 'fa-check-circle');
    }

    function closeLiveDl(){
        liveDlOverlay.classList.remove('active');
        pendingDownload = null;
    }

    liveDlCover.addEventListener('click', function(){
        if(!pendingDownload) return;
        var p = pendingDownload;
        closeLiveDl();
        doDownload(resolveImageUrl(p.item.src), p.album, p.index, false);
    });

    liveDlLive.addEventListener('click', function(){
        if(!pendingDownload) return;
        var p = pendingDownload;
        closeLiveDl();
        doDownload(resolveImageUrl(p.item.live), p.album, p.index, true);
    });

    liveDlCancel.addEventListener('click', closeLiveDl);
    liveDlOverlay.addEventListener('click', function(e){
        if(e.target === liveDlOverlay) closeLiveDl();
    });

    function compressImage(file, maxSize, quality){
        return new Promise(function(resolve, reject){
            var reader = new FileReader();
            reader.onload = function(e){
                var img = new Image();
                img.onload = function(){
                    var canvas = document.createElement('canvas');
                    var w = img.width, h = img.height;
                    if(w > h){
                        if(w > maxSize){ h = h * maxSize / w; w = maxSize; }
                    } else {
                        if(h > maxSize){ w = w * maxSize / h; h = maxSize; }
                    }
                    canvas.width = w;
                    canvas.height = h;
                    var ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    canvas.toBlob(function(blob){
                        resolve(new File([blob], file.name, { type: 'image/jpeg' }));
                    }, 'image/jpeg', quality);
                };
                img.onerror = reject;
                img.src = e.target.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    function refreshWaline(albumId){
        var path = '/album/' + albumId;
        var el = document.getElementById('waline-comments');
        if(!el) return;

        if(walineInstance && walinePath === path) return;

        var reqId = ++walineReqId;

        if(walineInstance && typeof walineInstance.destroy === 'function'){
            try { walineInstance.destroy(); } catch(e){}
        }
        walineInstance = null;
        walinePath = null;
        el.innerHTML = '';

        import('/assets/waline.js').then(function(module){
            if(reqId !== walineReqId) return;
            var init = module.init;
            walineInstance = init({
                el: '#waline-comments',
                serverURL: 'https://comment.cuizi.top',
                lang: 'zh-CN',
                path: path,
                dark: 'body.dark',
                imageUploader: function(file){
                    return new Promise(function(resolve, reject){
                        var uploadFile = file;
                        var shouldCompress = !['image/gif','image/svg+xml'].includes(file.type);
                        var doUpload = function(f){
                            var reader = new FileReader();
                            reader.onload = function(){
                                var base64 = reader.result.split(',')[1];
                                fetch('https://comment.cuizi.top/api/upload', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ image: base64, filename: file.name })
                                }).then(function(resp){ return resp.json(); })
                                  .then(function(data){ resolve(data.url); })
                                  .catch(reject);
                            };
                            reader.readAsDataURL(f);
                        };
                        if(shouldCompress){
                            compressImage(file, 720, 0.8).then(doUpload).catch(reject);
                        } else {
                            doUpload(uploadFile);
                        }
                    });
                },
                emoji: [
                    'https://unpkg.com/@waline/emojis@1.4.0/alus',
                    'https://unpkg.com/@waline/emojis@1.4.0/bilibili',
                    'https://unpkg.com/@waline/emojis@1.4.0/bmoji',
                    'https://unpkg.com/@waline/emojis@1.4.0/qq',
                    'https://unpkg.com/@waline/emojis@1.4.0/tieba'
                ],
                requiredMeta: ['nick','mail'],
                locale: {
                    placeholder: '邮箱用于接收邮件回复，不会展示给其他人。欢迎评论捏',
                    sofa: '还没有人评论哦！来抢个沙发吧~',
                    submit: '发射!',
                    nick: '昵称*',
                    mail: '邮箱*',
                    link: '网站'
                }
            });
            walinePath = path;
        }).catch(function(err){
            console.error('Waline 加载失败:', err);
        });
    }

    function openLightbox(index){
        if(!currentAlbum) return;
        var newHash = '#album=' + encodeURIComponent(currentAlbum.id) + '&photo=' + index;
        if(location.hash !== newHash){
            isNavigating = true;
            location.hash = newHash;
            setTimeout(function(){ isNavigating = false; }, 50);
        }
        var imgs;
        if(currentAlbum._decryptedData){
            imgs = currentAlbum._decryptedData.images.map(function(item){
                return { src: item._blobUrl || '', alt: item.alt || '' };
            });
        } else {
            imgs = currentAlbum.images.map(function(item){
                return { src: resolveImageUrl(item.src), alt: item.alt || '' };
            });
        }
        if(window.KSMarkdown && window.KSMarkdown.openLightbox){
            window.KSMarkdown.openLightbox(imgs, index);
        } else {
            showToast('灯箱模块未加载', 'fa-exclamation-circle');
        }
    }

    function revokeDetailBlobs(){
        detailBlobUrls.forEach(function(u){ URL.revokeObjectURL(u); });
        detailBlobUrls = [];
    }

    function closeDetail(){
        if(location.hash) setHash('');
        detailView.classList.remove('active');
        listView.classList.remove('hidden');
        currentAlbum = null;
        currentKey = null;
        photoGrid.innerHTML = '';
        revokeDetailBlobs();
        document.body.classList.remove('detail-active');
        document.body.classList.remove('hide-top-back');
        pendingRestoreScroll = true;
        restoreListScroll();
        updateScrollUI();
    }

    function handleRoute(){
        if(isNavigating) return;
        var match = location.hash.match(/^#album=([^&]+)/);
        if(match){
            var id = decodeURIComponent(match[1]);
            var album = allAlbums.find(function(a){ return a.id === id; });
            if(album && !album.encrypted){
                currentAlbum = album;
                renderDetailView(album);
                return;
            }
            if(album && album.encrypted){
                pendingAlbum = album;
                pwdSub.textContent = '「' + (album.title || '相册') + '」需要密码';
                openPwd();
                return;
            }
        }
        if(detailView.classList.contains('active')){
            detailView.classList.remove('active');
            listView.classList.remove('hidden');
            currentAlbum = null;
            currentKey = null;
            photoGrid.innerHTML = '';
            revokeDetailBlobs();
            document.body.classList.remove('detail-active');
            document.body.classList.remove('hide-top-back');
            pendingRestoreScroll = true;
            restoreListScroll();
            updateScrollUI();
        }
    }

    detailBack.addEventListener('click', closeDetail);

    pwdCancel.addEventListener('click', closePwd);
    pwdConfirm.addEventListener('click', tryUnlock);
    pwdInput.addEventListener('keydown', function(e){
        if(e.key === 'Enter') tryUnlock();
        if(e.key === 'Escape') closePwd();
    });
    pwdOverlay.addEventListener('click', function(e){
        if(e.target === pwdOverlay) closePwd();
    });

    clearBtn.addEventListener('click', function(){
        searchInput.value = '';
        searchBar.classList.remove('has-value');
        applyFilter('');
        searchInput.focus();
    });

    var searchTimer = null;
    searchInput.addEventListener('input', function(){
        searchBar.classList.toggle('has-value', searchInput.value.length > 0);
        clearTimeout(searchTimer);
        var val = searchInput.value;
        searchTimer = setTimeout(function(){ applyFilter(val); }, 150);
    });

    document.addEventListener('keydown', function(e){
        if(e.key === 'Escape'){
            if(confirmOverlay.classList.contains('active')){
                closeConfirm();
                return;
            }
            if(pwdOverlay.classList.contains('active')){
                closePwd();
                return;
            }
            if(liveDlOverlay.classList.contains('active')){
                closeLiveDl();
                return;
            }
            if(settingsOverlay.classList.contains('active')) return;
            if(document.querySelector('.lightbox-overlay.active')) return;
            if(detailView.classList.contains('active')){
                e.preventDefault();
                closeDetail();
            }
        }
    });

    window.addEventListener('hashchange', function(){
        if(isNavigating) return;
        var hasLightbox = !!document.querySelector('.lightbox-overlay.active');
        var hasPhotoInHash = /[&]photo=/.test(location.hash);
        if(hasLightbox && !hasPhotoInHash){
            var escEvent = new KeyboardEvent('keydown', {
                key: 'Escape',
                code: 'Escape',
                keyCode: 27,
                which: 27,
                bubbles: true,
                cancelable: true
            });
            document.dispatchEvent(escEvent);
            return;
        }
        handleRoute();
    });

    applyPrefs();
    bindSettings();
    loadAlbums();
    updateScrollUI();
})();
</script>

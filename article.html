<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>文章详情 · ks</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- ===== Highlight.js monokai 主题（高饱和，辨识度极高） ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/monokai.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #FAFAFE;
            color: #1A1A2E;
            line-height: 1.8;
            min-height: 100vh;
            transition: background 0.4s ease, color 0.3s ease;
        }

        body.dark {
            background: #14131F;
            color: #E8E6F0;
        }

        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(circle at 30% 30%, #F6F2FF, #FFFFFF);
            transition: background 0.5s ease;
        }
        body.dark .bg-glow {
            background: radial-gradient(circle at 30% 30%, #28253D, #0E0D18);
        }

        .glow-soft {
            position: fixed;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(160, 130, 230, 0.15), rgba(210, 190, 255, 0) 70%);
            border-radius: 50%;
            top: -25vh;
            right: -20vw;
            z-index: -1;
            filter: blur(80px);
            animation: floatGlow 20s infinite alternate ease-in-out;
            transition: background 0.5s ease;
        }
        body.dark .glow-soft {
            background: radial-gradient(circle, rgba(120, 100, 200, 0.20), rgba(60, 40, 120, 0) 70%);
        }

        .glow-soft-2 {
            position: fixed;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(200, 180, 255, 0.10), rgba(255, 240, 255, 0) 70%);
            border-radius: 50%;
            bottom: -15vh;
            left: -10vw;
            z-index: -1;
            filter: blur(70px);
            animation: floatGlow2 22s infinite alternate ease-in-out;
            transition: background 0.5s ease;
        }
        body.dark .glow-soft-2 {
            background: radial-gradient(circle, rgba(90, 70, 160, 0.15), rgba(30, 20, 60, 0) 70%);
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
            100% { transform: translate(5%, 8%) scale(1.2); opacity: 0.7; }
        }
        @keyframes floatGlow2 {
            0% { transform: translate(0, 0) scale(1); opacity: 0.2; }
            100% { transform: translate(-6%, -5%) scale(1.3); opacity: 0.6; }
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 2.8rem 1.8rem 2rem;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 50;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 60px;
            padding: 0.5rem 1.2rem 0.5rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: #4F4F78;
            text-decoration: none;
            transition: 0.25s ease;
            box-shadow: 0 6px 20px rgba(80, 60, 160, 0.10);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }
        body.dark .back-btn {
            background: rgba(30, 28, 50, 0.7);
            border-color: rgba(255, 255, 255, 0.08);
            color: #D0CAF0;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.85);
            transform: translateY(-2px) scale(1.02);
        }
        body.dark .back-btn:hover {
            background: rgba(50, 45, 80, 0.8);
        }
        .back-btn i {
            font-size: 0.9rem;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 24px;
            z-index: 50;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 60px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: #4F4F78;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 6px 20px rgba(80, 60, 160, 0.10);
            user-select: none;
        }
        .theme-toggle:hover {
            transform: scale(1.05) rotate(8deg);
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 10px 28px rgba(80, 60, 160, 0.18);
        }
        body.dark .theme-toggle {
            background: rgba(30, 28, 50, 0.7);
            border-color: rgba(255, 255, 255, 0.08);
            color: #D0CAF0;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        body.dark .theme-toggle:hover {
            background: rgba(50, 45, 80, 0.8);
        }

        .article-detail {
            max-width: 640px;
            margin: 0 auto;
            padding-top: 1rem;
            width: 100%;
        }

        .article-detail .detail-title {
            font-size: 2rem;
            font-weight: 700;
            color: #1A1A2E;
            margin-bottom: 0.3rem;
            line-height: 1.3;
        }
        body.dark .article-detail .detail-title {
            color: #E8E6F0;
        }

        .article-detail .detail-date {
            font-size: 0.85rem;
            color: #8A8AB5;
            margin-bottom: 1.5rem;
            display: block;
        }
        body.dark .article-detail .detail-date {
            color: #7A7AA0;
        }

        .article-detail .detail-divider {
            border: none;
            border-top: 1px solid rgba(0,0,0,0.06);
            margin-bottom: 1.5rem;
        }
        body.dark .article-detail .detail-divider {
            border-top-color: rgba(255,255,255,0.06);
        }

        .article-detail .detail-content {
            font-size: 1rem;
            line-height: 1.9;
            color: #2D2D4A;
            word-break: break-word;
        }
        body.dark .article-detail .detail-content {
            color: #D0CAF0;
        }

        .article-detail .detail-content h1,
        .article-detail .detail-content h2,
        .article-detail .detail-content h3,
        .article-detail .detail-content h4,
        .article-detail .detail-content h5,
        .article-detail .detail-content h6 {
            font-weight: 700;
            margin: 1.2rem 0 0.6rem 0;
            line-height: 1.3;
            color: #1A1A2E;
        }
        body.dark .article-detail .detail-content h1,
        body.dark .article-detail .detail-content h2,
        body.dark .article-detail .detail-content h3,
        body.dark .article-detail .detail-content h4,
        body.dark .article-detail .detail-content h5,
        body.dark .article-detail .detail-content h6 {
            color: #E8E6F0;
        }
        .article-detail .detail-content h1 { font-size: 1.8rem; }
        .article-detail .detail-content h2 { font-size: 1.5rem; }
        .article-detail .detail-content h3 { font-size: 1.25rem; }
        .article-detail .detail-content h4 { font-size: 1.1rem; }
        .article-detail .detail-content h5 { font-size: 1rem; }
        .article-detail .detail-content h6 { font-size: 0.9rem; opacity: 0.7; }

        .article-detail .detail-content p {
            margin-bottom: 0.8rem;
        }
        .article-detail .detail-content p:last-child {
            margin-bottom: 0;
        }

        .article-detail .detail-content strong {
            color: #3D2D8A;
            font-weight: 700;
        }
        body.dark .article-detail .detail-content strong {
            color: #C8C0F0;
        }

        .article-detail .detail-content em {
            font-style: italic;
            color: #6A6A92;
        }
        body.dark .article-detail .detail-content em {
            color: #A8A4C8;
        }

        .article-detail .detail-content a {
            color: #6B5ACF;
            text-decoration: underline;
            text-underline-offset: 2px;
        }
        body.dark .article-detail .detail-content a {
            color: #88ccff;
        }

        .article-detail .detail-content img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            margin: 0.8rem 0;
            display: block;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            transition: box-shadow 0.3s ease;
        }
        body.dark .article-detail .detail-content img {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }
        .article-detail .detail-content img:hover {
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
        }
        body.dark .article-detail .detail-content img:hover {
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .article-detail .detail-content code {
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 0.9em;
            background: rgba(0, 0, 0, 0.06);
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            color: #D14C4C;
        }
        body.dark .article-detail .detail-content code {
            background: rgba(255, 255, 255, 0.06);
            color: #E8A87C;
        }

        /* ===== 代码块容器 ===== */
        .code-block-wrapper {
            background: #1E1F22;
            border-radius: 12px;
            margin: 0.8rem 0;
            overflow: hidden;
        }
        body.dark .code-block-wrapper {
            background: #1E1F22;
        }

        /* ===== 标题栏 ===== */
        .code-block-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.04);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
            min-height: 40px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .code-block-header .lang-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: #ABB2BF;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-family: 'Inter', sans-serif;
        }

        .code-block-header .code-stats {
            font-size: 0.65rem;
            color: #5C6370;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.3px;
            flex: 1;
            text-align: center;
        }
        .code-block-header .code-stats span {
            margin: 0 2px;
        }

        .code-block-header .copy-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 2px 12px;
            font-size: 0.65rem;
            font-weight: 500;
            color: #ABB2BF;
            cursor: pointer;
            transition: 0.2s ease;
            font-family: 'Inter', sans-serif;
            line-height: 1.8;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .code-block-header .copy-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #E8E6F0;
        }
        .code-block-header .copy-btn.copied {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
            border-color: rgba(46, 204, 113, 0.2);
        }
        .code-block-header .copy-btn i {
            font-size: 0.7rem;
        }

        /* ===== 代码主体：行号 + 代码 ===== */
        .code-block-body {
            display: flex;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 0.85rem;
            line-height: 1.7;
            background: #1E1F22;
        }
        .code-block-body .line-numbers {
            flex-shrink: 0;
            padding: 0.8rem 0.6rem 0.8rem 1.2rem;
            text-align: right;
            color: #5C6370;
            user-select: none;
            font-family: inherit;
            font-size: inherit;
            line-height: inherit;
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            min-width: 2.8rem;
            background: transparent;
        }
        .code-block-body .line-numbers span {
            display: block;
        }

        .code-block-body .code-content {
            flex: 1;
            padding: 0.8rem 1.2rem;
            overflow-x: auto;
            min-width: 0;
            font-family: inherit;
            font-size: inherit;
            line-height: inherit;
            white-space: pre;
            color: #ABB2BF;
            background: transparent;
        }

        /* ===== Highlight.js 覆盖 ===== */
        .code-block-body .code-content.hljs {
            background: transparent !important;
            padding: 0 !important;
        }

        .article-detail .detail-content ul,
        .article-detail .detail-content ol {
            padding-left: 1.8rem;
            margin: 0.6rem 0;
        }
        .article-detail .detail-content ul li,
        .article-detail .detail-content ol li {
            margin-bottom: 0.2rem;
        }

        .article-detail .detail-content blockquote {
            border-left: 4px solid #6B5ACF;
            padding-left: 1.2rem;
            margin: 0.8rem 0;
            color: #6A6A92;
            font-style: italic;
        }
        body.dark .article-detail .detail-content blockquote {
            border-left-color: #88ccff;
            color: #A8A4C8;
        }

        .article-detail .detail-content hr {
            border: none;
            border-top: 2px solid rgba(0, 0, 0, 0.08);
            margin: 1.5rem 0;
        }
        body.dark .article-detail .detail-content hr {
            border-top-color: rgba(255, 255, 255, 0.08);
        }

        .not-found {
            text-align: center;
            padding: 4rem 1rem;
            color: #8A8AB5;
        }
        .not-found i {
            font-size: 3rem;
            display: block;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .loading {
            text-align: center;
            padding: 4rem 1rem;
            color: #8A8AB5;
        }
        .loading i {
            font-size: 2rem;
            display: block;
            margin-bottom: 1rem;
        }

        @media (max-width: 560px) {
            .container {
                padding: 2rem 1.2rem 1.5rem;
            }
            .back-btn {
                top: 14px;
                left: 14px;
                padding: 0.4rem 1rem 0.4rem 0.8rem;
                font-size: 0.75rem;
            }
            .theme-toggle {
                top: 14px;
                right: 16px;
                width: 42px;
                height: 42px;
                font-size: 1.2rem;
            }
            .article-detail .detail-title {
                font-size: 1.6rem;
            }
            .article-detail .detail-content img {
                border-radius: 8px;
            }
            .code-block-header {
                padding: 6px 10px;
                min-height: 34px;
                gap: 6px;
            }
            .code-block-header .lang-label {
                font-size: 0.6rem;
            }
            .code-block-header .code-stats {
                font-size: 0.55rem;
            }
            .code-block-header .copy-btn {
                font-size: 0.55rem;
                padding: 1px 8px;
            }
            .code-block-header .copy-btn i {
                font-size: 0.6rem;
            }
            .code-block-body {
                font-size: 0.75rem;
            }
            .code-block-body .line-numbers {
                padding: 0.6rem 0.4rem 0.6rem 0.8rem;
                min-width: 2rem;
            }
            .code-block-body .code-content {
                padding: 0.6rem 0.8rem;
            }
        }
    </style>
</head>
<body>
<div class="bg-glow"></div>
<div class="glow-soft"></div>
<div class="glow-soft-2"></div>

<a href="javascript:void(0)" class="back-btn" id="backButton">
    <i class="fas fa-arrow-left"></i> 返回
</a>

<div class="theme-toggle" id="themeToggle" role="button" aria-label="切换深色/亮色模式">
    <i class="fas fa-moon"></i>
</div>

<div class="container">
    <div id="appContent">
        <div class="loading">
            <i class="fas fa-spinner fa-spin"></i>
            加载中...
        </div>
    </div>
</div>

<script>
    const themeToggle = document.getElementById('themeToggle');
    const icon = themeToggle.querySelector('i');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    let currentTheme = localStorage.getItem('ks-theme') || (prefersDark ? 'dark' : 'light');

    function setTheme(theme) {
        document.body.classList.toggle('dark', theme === 'dark');
        icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        localStorage.setItem('ks-theme', theme);
        currentTheme = theme;
    }
    setTheme(currentTheme);
    themeToggle.addEventListener('click', () => {
        setTheme(currentTheme === 'dark' ? 'light' : 'dark');
    });

    function getParam(name) {
        const url = new URL(window.location.href);
        return url.searchParams.get(name);
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function renderMarkdown(md) {
        if (!md) return '';

        const lines = md.split('\n');
        let result = '';
        let inList = false;
        let listType = null;
        let inBlockquote = false;
        let blockquoteLines = [];
        let inCodeBlock = false;
        let codeBlockLines = [];
        let codeLang = '';

        function flushBlockquote() {
            if (blockquoteLines.length > 0) {
                const content = blockquoteLines.join('\n');
                result += '<blockquote>' + renderInline(content) + '</blockquote>';
                blockquoteLines = [];
                inBlockquote = false;
            }
        }

        function flushCodeBlock() {
            if (codeBlockLines.length > 0) {
                const code = codeBlockLines.join('\n');
                const escapedCode = escapeHtml(code);
                const lang = codeLang || 'text';
                const copyId = 'code-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);

                // 统计：行数、列数、字符数
                const lineCount = codeBlockLines.length;
                let maxLineLength = 0;
                let totalChars = 0;
                for (let i = 0; i < codeBlockLines.length; i++) {
                    const lineLen = codeBlockLines[i].length;
                    if (lineLen > maxLineLength) maxLineLength = lineLen;
                    totalChars += lineLen;
                }
                // 加上换行符
                totalChars += lineCount > 0 ? lineCount - 1 : 0;

                // 行号 HTML
                let lineNumbersHtml = '';
                for (let i = 1; i <= lineCount; i++) {
                    lineNumbersHtml += '<span>' + i + '</span>';
                }

                // 统计信息
                const statsHtml = `<span>${lineCount} 行</span> · <span>${maxLineLength} 列</span> · <span>${totalChars} 字符</span>`;

                result += `
                    <div class="code-block-wrapper">
                        <div class="code-block-header">
                            <span class="lang-label">${escapeHtml(lang)}</span>
                            <span class="code-stats">${statsHtml}</span>
                            <button class="copy-btn" data-copy="${copyId}"><i class="fas fa-copy"></i> 复制</button>
                        </div>
                        <div class="code-block-body">
                            <div class="line-numbers">${lineNumbersHtml}</div>
                            <code class="code-content" id="${copyId}">${escapedCode}</code>
                        </div>
                    </div>
                `;
                codeBlockLines = [];
                inCodeBlock = false;
                codeLang = '';
            }
        }

        function flushList() {
            if (inList) {
                result += '</' + listType + '>';
                inList = false;
                listType = null;
            }
        }

        function renderInline(text) {
            let html = escapeHtml(text);
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
            html = html.replace(/!\[([^\]]*)\]\(([^)]*)\)/g, '<img src="$2" alt="$1" loading="lazy" />');
            html = html.replace(/\[([^\]]*)\]\(([^)]*)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
            return html;
        }

        for (let i = 0; i < lines.length; i++) {
            let line = lines[i];

            // 检测代码块开始
            const codeBlockStart = line.match(/^```(\w*)/);
            if (codeBlockStart) {
                if (!inCodeBlock) {
                    flushBlockquote();
                    flushList();
                    inCodeBlock = true;
                    codeLang = codeBlockStart[1] || 'text';
                } else {
                    flushCodeBlock();
                }
                continue;
            }
            if (inCodeBlock) {
                codeBlockLines.push(line);
                continue;
            }

            if (line.trim() === '') {
                flushBlockquote();
                flushList();
                result += '\n';
                continue;
            }

            if (line.startsWith('> ')) {
                flushList();
                const content = line.replace(/^>\s*/, '');
                blockquoteLines.push(content);
                inBlockquote = true;
                continue;
            }
            if (inBlockquote) {
                flushBlockquote();
            }

            const headingMatch = line.match(/^(#{1,6})\s+(.+)/);
            if (headingMatch) {
                flushList();
                const level = headingMatch[1].length;
                const text = headingMatch[2];
                result += `<h${level}>${renderInline(text)}</h${level}>\n`;
                continue;
            }

            if (/^---$/.test(line.trim())) {
                flushList();
                result += '<hr />\n';
                continue;
            }

            const ulMatch = line.match(/^-\s+(.+)/);
            if (ulMatch) {
                if (!inList || listType !== 'ul') {
                    flushList();
                    result += '<ul>\n';
                    inList = true;
                    listType = 'ul';
                }
                result += `<li>${renderInline(ulMatch[1])}</li>\n`;
                continue;
            }

            const olMatch = line.match(/^(\d+)\.\s+(.+)/);
            if (olMatch) {
                if (!inList || listType !== 'ol') {
                    flushList();
                    result += '<ol>\n';
                    inList = true;
                    listType = 'ol';
                }
                result += `<li>${renderInline(olMatch[2])}</li>\n`;
                continue;
            }

            flushList();
            result += `<p>${renderInline(line)}</p>\n`;
        }

        flushBlockquote();
        flushCodeBlock();
        flushList();

        return result;
    }

    // ===== 代码块复制事件 =====
    document.addEventListener('click', function(e) {
        const btn = e.target.closest('.copy-btn');
        if (!btn) return;

        const targetId = btn.dataset.copy;
        if (!targetId) return;

        const codeEl = document.getElementById(targetId);
        if (!codeEl) return;

        // 获取纯文本内容（不含高亮标签）
        const text = codeEl.textContent;

        navigator.clipboard.writeText(text).then(() => {
            btn.innerHTML = '<i class="fas fa-check"></i> 已复制';
            btn.classList.add('copied');
            setTimeout(() => {
                btn.innerHTML = '<i class="fas fa-copy"></i> 复制';
                btn.classList.remove('copied');
            }, 2000);
        }).catch(() => {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            btn.innerHTML = '<i class="fas fa-check"></i> 已复制';
            btn.classList.add('copied');
            setTimeout(() => {
                btn.innerHTML = '<i class="fas fa-copy"></i> 复制';
                btn.classList.remove('copied');
            }, 2000);
        });
    });

    const appContent = document.getElementById('appContent');

    function renderArticle() {
        const id = getParam('id');
        if (id === null) {
            appContent.innerHTML = `
                <div class="not-found">
                    <i class="far fa-frown"></i>
                    <p>缺少文章 ID</p>
                    <p style="font-size:0.85rem; margin-top:0.5rem;">请从文章列表点击进入</p>
                </div>
            `;
            return;
        }

        fetch('wenzhang.json', { cache: 'no-cache' })
            .then(response => {
                if (!response.ok) throw new Error('文件不存在');
                return response.json();
            })
            .then(data => {
                const articles = data.announcements || [];
                const idx = parseInt(id);
                if (isNaN(idx) || idx < 0 || idx >= articles.length) {
                    appContent.innerHTML = `
                        <div class="not-found">
                            <i class="far fa-frown"></i>
                            <p>文章不存在</p>
                            <p style="font-size:0.85rem; margin-top:0.5rem;">可能已被删除</p>
                        </div>
                    `;
                    return;
                }

                const article = articles[idx];
                const title = article.title || '无标题';
                const date = article.date || '';
                const content = article.content || '（暂无内容）';
                const renderedContent = renderMarkdown(content);

                appContent.innerHTML = `
                    <div class="article-detail">
                        <h1 class="detail-title">${escapeHtml(title)}</h1>
                        ${date ? `<span class="detail-date">${escapeHtml(date)}</span>` : ''}
                        <hr class="detail-divider">
                        <div class="detail-content">${renderedContent}</div>
                    </div>
                `;

                // ===== Highlight.js 语法高亮 =====
                document.querySelectorAll('.code-content').forEach(el => {
                    hljs.highlightElement(el);
                });
            })
            .catch(() => {
                appContent.innerHTML = `
                    <div class="not-found">
                        <i class="far fa-frown"></i>
                        <p>加载文章数据失败</p>
                        <p style="font-size:0.85rem; margin-top:0.5rem;">请确保 wenzhang.json 文件存在</p>
                    </div>
                `;
            });
    }

    renderArticle();

    // ===== 返回按钮动态跳转 =====
    const from = getParam('from');
    const page = getParam('page');
    const backBtn = document.getElementById('backButton');

    let returnUrl = 'index.html?return=articles';
    if (page) {
        returnUrl += '&page=' + page;
    }
    if (from === 'archive') {
        returnUrl = 'index.html?return=archive';
    }

    backBtn.href = returnUrl;
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>文章详情 · ks</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #FAFAFE;
            color: #1A1A2E;
            line-height: 1.8;
            min-height: 100vh;
            transition: background 0.4s ease, color 0.3s ease;
        }

        body.dark {
            background: #14131F;
            color: #E8E6F0;
        }

        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(circle at 30% 30%, #F6F2FF, #FFFFFF);
            transition: background 0.5s ease;
        }
        body.dark .bg-glow {
            background: radial-gradient(circle at 30% 30%, #28253D, #0E0D18);
        }

        .glow-soft {
            position: fixed;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(160, 130, 230, 0.15), rgba(210, 190, 255, 0) 70%);
            border-radius: 50%;
            top: -25vh;
            right: -20vw;
            z-index: -1;
            filter: blur(80px);
            animation: floatGlow 20s infinite alternate ease-in-out;
            transition: background 0.5s ease;
        }
        body.dark .glow-soft {
            background: radial-gradient(circle, rgba(120, 100, 200, 0.20), rgba(60, 40, 120, 0) 70%);
        }

        .glow-soft-2 {
            position: fixed;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(200, 180, 255, 0.10), rgba(255, 240, 255, 0) 70%);
            border-radius: 50%;
            bottom: -15vh;
            left: -10vw;
            z-index: -1;
            filter: blur(70px);
            animation: floatGlow2 22s infinite alternate ease-in-out;
            transition: background 0.5s ease;
        }
        body.dark .glow-soft-2 {
            background: radial-gradient(circle, rgba(90, 70, 160, 0.15), rgba(30, 20, 60, 0) 70%);
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
            100% { transform: translate(5%, 8%) scale(1.2); opacity: 0.7; }
        }
        @keyframes floatGlow2 {
            0% { transform: translate(0, 0) scale(1); opacity: 0.2; }
            100% { transform: translate(-6%, -5%) scale(1.3); opacity: 0.6; }
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 2.8rem 1.8rem 2rem;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 50;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 60px;
            padding: 0.5rem 1.2rem 0.5rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: #4F4F78;
            text-decoration: none;
            transition: 0.25s ease;
            box-shadow: 0 6px 20px rgba(80, 60, 160, 0.10);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }
        body.dark .back-btn {
            background: rgba(30, 28, 50, 0.7);
            border-color: rgba(255, 255, 255, 0.08);
            color: #D0CAF0;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.85);
            transform: translateY(-2px) scale(1.02);
        }
        body.dark .back-btn:hover {
            background: rgba(50, 45, 80, 0.8);
        }
        .back-btn i {
            font-size: 0.9rem;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 24px;
            z-index: 50;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 60px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: #4F4F78;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 6px 20px rgba(80, 60, 160, 0.10);
            user-select: none;
        }
        .theme-toggle:hover {
            transform: scale(1.05) rotate(8deg);
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 10px 28px rgba(80, 60, 160, 0.18);
        }
        body.dark .theme-toggle {
            background: rgba(30, 28, 50, 0.7);
            border-color: rgba(255, 255, 255, 0.08);
            color: #D0CAF0;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        body.dark .theme-toggle:hover {
            background: rgba(50, 45, 80, 0.8);
        }

        .article-detail {
            max-width: 640px;
            margin: 0 auto;
            padding-top: 1rem;
            width: 100%;
        }

        .article-detail .detail-title {
            font-size: 2rem;
            font-weight: 700;
            color: #1A1A2E;
            margin-bottom: 0.3rem;
            line-height: 1.3;
        }
        body.dark .article-detail .detail-title {
            color: #E8E6F0;
        }

        .article-detail .detail-date {
            font-size: 0.85rem;
            color: #8A8AB5;
            margin-bottom: 1.5rem;
            display: block;
        }
        body.dark .article-detail .detail-date {
            color: #7A7AA0;
        }

        .article-detail .detail-divider {
            border: none;
            border-top: 1px solid rgba(0,0,0,0.06);
            margin-bottom: 1.5rem;
        }
        body.dark .article-detail .detail-divider {
            border-top-color: rgba(255,255,255,0.06);
        }

        .article-detail .detail-content {
            font-size: 1rem;
            line-height: 1.9;
            color: #2D2D4A;
            white-space: pre-wrap;
            word-break: break-word;
        }
        body.dark .article-detail .detail-content {
            color: #D0CAF0;
        }

        .not-found {
            text-align: center;
            padding: 4rem 1rem;
            color: #8A8AB5;
        }
        .not-found i {
            font-size: 3rem;
            display: block;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .loading {
            text-align: center;
            padding: 4rem 1rem;
            color: #8A8AB5;
        }
        .loading i {
            font-size: 2rem;
            display: block;
            margin-bottom: 1rem;
        }

        @media (max-width: 560px) {
            .container {
                padding: 2rem 1.2rem 1.5rem;
            }
            .back-btn {
                top: 14px;
                left: 14px;
                padding: 0.4rem 1rem 0.4rem 0.8rem;
                font-size: 0.75rem;
            }
            .theme-toggle {
                top: 14px;
                right: 16px;
                width: 42px;
                height: 42px;
                font-size: 1.2rem;
            }
            .article-detail .detail-title {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
<div class="bg-glow"></div>
<div class="glow-soft"></div>
<div class="glow-soft-2"></div>

<a href="index.html" class="back-btn">
    <i class="fas fa-arrow-left"></i> 返回
</a>

<div class="theme-toggle" id="themeToggle" role="button" aria-label="切换深色/亮色模式">
    <i class="fas fa-moon"></i>
</div>

<div class="container">
    <div id="appContent">
        <div class="loading">
            <i class="fas fa-spinner fa-spin"></i>
            加载中...
        </div>
    </div>
</div>

<script>
    const themeToggle = document.getElementById('themeToggle');
    const icon = themeToggle.querySelector('i');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    let currentTheme = localStorage.getItem('ks-theme') || (prefersDark ? 'dark' : 'light');

    function setTheme(theme) {
        document.body.classList.toggle('dark', theme === 'dark');
        icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        localStorage.setItem('ks-theme', theme);
        currentTheme = theme;
    }
    setTheme(currentTheme);
    themeToggle.addEventListener('click', () => {
        setTheme(currentTheme === 'dark' ? 'light' : 'dark');
    });

    function getParam(name) {
        const url = new URL(window.location.href);
        return url.searchParams.get(name);
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    const appContent = document.getElementById('appContent');

    function renderArticle() {
        const id = getParam('id');
        if (id === null) {
            appContent.innerHTML = `
                <div class="not-found">
                    <i class="far fa-frown"></i>
                    <p>缺少文章 ID</p>
                    <p style="font-size:0.85rem; margin-top:0.5rem;">请从文章列表点击进入</p>
                </div>
            `;
            return;
        }

        fetch('wenzhang.json', { cache: 'no-cache' })
            .then(response => {
                if (!response.ok) throw new Error('文件不存在');
                return response.json();
            })
            .then(data => {
                const articles = data.announcements || [];
                const idx = parseInt(id);
                if (isNaN(idx) || idx < 0 || idx >= articles.length) {
                    appContent.innerHTML = `
                        <div class="not-found">
                            <i class="far fa-frown"></i>
                            <p>文章不存在</p>
                            <p style="font-size:0.85rem; margin-top:0.5rem;">可能已被删除</p>
                        </div>
                    `;
                    return;
                }

                const article = articles[idx];
                const title = article.title || '无标题';
                const date = article.date || '';
                const content = article.content || '（暂无内容）';

                appContent.innerHTML = `
                    <div class="article-detail">
                        <h1 class="detail-title">${escapeHtml(title)}</h1>
                        ${date ? `<span class="detail-date">📅 ${escapeHtml(date)}</span>` : ''}
                        <hr class="detail-divider">
                        <div class="detail-content">${escapeHtml(content)}</div>
                    </div>
                `;
            })
            .catch(() => {
                appContent.innerHTML = `
                    <div class="not-found">
                        <i class="far fa-frown"></i>
                        <p>加载文章数据失败</p>
                        <p style="font-size:0.85rem; margin-top:0.5rem;">请确保 wenzhang.json 文件存在</p>
                    </div>
                `;
            });
    }

    renderArticle();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>文章详情 · ks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://unpkg.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/7.0.1/css/all.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <link rel="stylesheet" href="https://unpkg.com/@waline/client@v3/dist/waline.css">
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" type="image/png" href="/favicon-192x192.png" sizes="192x192">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent
        }

        body {
            font-family: 'Inter', -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #FAFAFE;
            color: #1A1A2E;
            line-height: 1.8;
            min-height: 100vh;
            transition: background 0.4s ease, color 0.3s ease
        }

        body.dark {
            background: #14131F;
            color: #E8E6F0
        }

        .reading-progress {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(0, 0, 0, 0.08);
            z-index: 9999;
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.3s ease
        }

        body.dark .reading-progress {
            background: rgba(255, 255, 255, 0.1)
        }

        .reading-progress .progress-bar {
            height: 100%;
            width: 0%;
            background: #4A90D9;
            border-radius: 0 4px 4px 0;
            transition: width 0.05s linear
        }

        body.dark .reading-progress .progress-bar {
            background: #60A5FA
        }

        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(circle at 30% 30%, #F6F2FF, #FFFFFF);
            transition: background 0.5s ease
        }

        body.dark .bg-glow {
            background: radial-gradient(circle at 30% 30%, #28253D, #0E0D18)
        }

        .glow-soft {
            position: fixed;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(160, 130, 230, 0.15), rgba(210, 190, 255, 0) 70%);
            border-radius: 50%;
            top: -25vh;
            right: -20vw;
            z-index: -1;
            filter: blur(80px);
            animation: floatGlow 20s infinite alternate ease-in-out;
            transition: background 0.5s ease
        }

        body.dark .glow-soft {
            background: radial-gradient(circle, rgba(120, 100, 200, 0.20), rgba(60, 40, 120, 0) 70%)
        }

        .glow-soft-2 {
            position: fixed;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(200, 180, 255, 0.10), rgba(255, 240, 255, 0) 70%);
            border-radius: 50%;
            bottom: -15vh;
            left: -10vw;
            z-index: -1;
            filter: blur(70px);
            animation: floatGlow2 22s infinite alternate ease-in-out;
            transition: background 0.5s ease
        }

        body.dark .glow-soft-2 {
            background: radial-gradient(circle, rgba(90, 70, 160, 0.15), rgba(30, 20, 60, 0) 70%)
        }

        @keyframes floatGlow {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.3
            }

            100% {
                transform: translate(5%, 8%) scale(1.2);
                opacity: 0.7
            }
        }

        @keyframes floatGlow2 {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.2
            }

            100% {
                transform: translate(-6%, -5%) scale(1.3);
                opacity: 0.6
            }
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 2.8rem 1.8rem 2rem;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative
        }

        #appContent {
            width: 100%;
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 1rem;
            color: #8A8AB5;
            transition: color 0.3s ease;
            width: 100%;
            box-sizing: border-box;
        }

        .loading i {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        body.dark .loading {
            color: #8A8AB5
        }

        .top-buttons {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 50;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none
        }

        .top-buttons .left,
        .top-buttons .right {
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 0.5rem
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 60px;
            padding: 0.5rem 1.2rem 0.5rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: #4F4F78;
            text-decoration: none;
            transition: 0.25s ease;
            box-shadow: 0 6px 20px rgba(80, 60, 160, 0.10);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important
        }

        body.dark .back-btn {
            background: rgba(30, 28, 50, 0.7);
            border-color: rgba(255, 255, 255, 0.08);
            color: #D0CAF0;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3)
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.85);
            transform: translateY(-2px) scale(1.02)
        }

        body.dark .back-btn:hover {
            background: rgba(50, 45, 80, 0.8)
        }

        .back-btn i {
            font-size: 0.9rem
        }

        .share-btn {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 60px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #4F4F78;
            transition: 0.25s ease;
            box-shadow: 0 6px 20px rgba(80, 60, 160, 0.10);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important
        }

        body.dark .share-btn {
            background: rgba(30, 28, 50, 0.7);
            border-color: rgba(255, 255, 255, 0.08);
            color: #D0CAF0;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3)
        }

        .share-btn:hover {
            background: rgba(255, 255, 255, 0.85);
            transform: scale(1.05)
        }

        body.dark .share-btn:hover {
            background: rgba(50, 45, 80, 0.8)
        }

        .share-btn i {
            font-size: 1.2rem
        }

        .back-to-top-btn {
            position: fixed;
            top: 20px;
            right: 80px;
            z-index: 49;
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            color: #4F4F78;
            font-size: 1.2rem;
            cursor: pointer;
            transition: opacity 0.35s ease, transform 0.25s ease, background 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 6px 20px rgba(80, 60, 160, 0.10);
            opacity: 0;
            pointer-events: none;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important
        }

        .back-to-top-btn:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 10px 28px rgba(80, 60, 160, 0.18)
        }

        .back-to-top-btn.show {
            opacity: 1;
            pointer-events: auto
        }

        .back-to-top-btn:active {
            transform: scale(0.92)
        }

        .back-to-top-btn.disabled {
            opacity: 0.3 !important;
            pointer-events: none !important
        }

        body.dark .back-to-top-btn {
            background: rgba(30, 28, 50, 0.7);
            border-color: rgba(255, 255, 255, 0.08);
            color: #D0CAF0;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3)
        }

        body.dark .back-to-top-btn:hover {
            background: rgba(50, 45, 80, 0.8)
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 24px;
            z-index: 50;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 60px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: #4F4F78;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 6px 20px rgba(80, 60, 160, 0.10);
            user-select: none;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important
        }

        .theme-toggle:hover {
            transform: scale(1.05) rotate(8deg);
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 10px 28px rgba(80, 60, 160, 0.18)
        }

        body.dark .theme-toggle {
            background: rgba(30, 28, 50, 0.7);
            border-color: rgba(255, 255, 255, 0.08);
            color: #D0CAF0;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3)
        }

        body.dark .theme-toggle:hover {
            background: rgba(50, 45, 80, 0.8)
        }

        .theme-toggle:active {
            transform: scale(0.92)
        }

        @media (max-width:560px) {
            .back-to-top-btn {
                top: 14px;
                right: 66px;
                width: 42px;
                height: 42px;
                font-size: 1rem
            }

            .theme-toggle {
                top: 14px;
                right: 16px;
                width: 42px;
                height: 42px;
                font-size: 1.2rem
            }

            .share-btn {
                width: 42px;
                height: 42px;
                font-size: 1rem
            }

            .share-btn i {
                font-size: 1rem
            }

            .top-buttons {
                top: 14px;
                left: 14px;
                right: 14px
            }

            .back-btn {
                padding: 0.4rem 1rem 0.4rem 0.8rem;
                font-size: 0.75rem
            }

            .back-btn i {
                font-size: 0.8rem
            }

            .reading-progress {
                height: 2px
            }
        }

        .article-detail {
            max-width: 640px;
            margin: 0 auto;
            padding-top: 2rem;
            width: 100%
        }

        .article-detail .detail-title {
            font-size: 2rem;
            font-weight: 700;
            color: #1A1A2E;
            margin-bottom: 0.3rem;
            line-height: 1.3;
            transition: color 0.3s ease
        }

        body.dark .article-detail .detail-title {
            color: #E8E6F0
        }

        .article-detail .detail-date {
            font-size: 0.85rem;
            color: #8A8AB5;
            margin-bottom: 0.6rem;
            display: block;
            transition: color 0.3s ease
        }

        body.dark .article-detail .detail-date {
            color: #7A7AA0
        }

        .article-detail .detail-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem 0.6rem;
            margin-bottom: 1rem
        }

        .article-detail .detail-tags .tag {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.75rem;
            font-weight: 500;
            color: #6B5ACF;
            background: rgba(107, 90, 207, 0.10);
            padding: 0.1rem 0.7rem 0.1rem 0.5rem;
            border-radius: 40px;
            transition: 0.2s ease;
            cursor: pointer;
            user-select: none;
            text-decoration: none
        }

        body.dark .article-detail .detail-tags .tag {
            color: #88ccff;
            background: rgba(136, 204, 255, 0.10)
        }

        .article-detail .detail-tags .tag:hover {
            background: rgba(107, 90, 207, 0.20);
            transform: scale(1.04)
        }

        body.dark .article-detail .detail-tags .tag:hover {
            background: rgba(136, 204, 255, 0.20)
        }

        .article-detail .detail-tags .tag i {
            font-size: 0.6rem;
            opacity: 0.7
        }

        .article-detail .detail-divider {
            border: none;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            margin-bottom: 1.5rem;
            transition: border-color 0.3s ease
        }

        body.dark .article-detail .detail-divider {
            border-top-color: rgba(255, 255, 255, 0.06)
        }

        .article-detail .detail-content {
            font-size: 1rem;
            line-height: 1.9;
            color: #2D2D4A;
            word-break: break-word;
            transition: color 0.3s ease
        }

        body.dark .article-detail .detail-content {
            color: #D0CAF0
        }

        .article-detail .detail-content h1,
        .article-detail .detail-content h2,
        .article-detail .detail-content h3,
        .article-detail .detail-content h4,
        .article-detail .detail-content h5,
        .article-detail .detail-content h6 {
            font-weight: 700;
            margin: 1.2rem 0 0.6rem 0;
            line-height: 1.3;
            color: #1A1A2E;
            transition: color 0.3s ease
        }

        body.dark .article-detail .detail-content h1,
        body.dark .article-detail .detail-content h2,
        body.dark .article-detail .detail-content h3,
        body.dark .article-detail .detail-content h4,
        body.dark .article-detail .detail-content h5,
        body.dark .article-detail .detail-content h6 {
            color: #E8E6F0
        }

        .article-detail .detail-content h1 {
            font-size: 1.8rem
        }

        .article-detail .detail-content h2 {
            font-size: 1.5rem
        }

        .article-detail .detail-content h3 {
            font-size: 1.25rem
        }

        .article-detail .detail-content h4 {
            font-size: 1.1rem
        }

        .article-detail .detail-content h5 {
            font-size: 1rem
        }

        .article-detail .detail-content h6 {
            font-size: 0.9rem;
            opacity: 0.7
        }

        .article-detail .detail-content p {
            margin-bottom: 0.8rem;
            transition: color 0.3s ease
        }

        .article-detail .detail-content p:last-child {
            margin-bottom: 0
        }

        .article-detail .detail-content strong {
            color: #3D2D8A;
            font-weight: 700;
            transition: color 0.3s ease
        }

        body.dark .article-detail .detail-content strong {
            color: #C8C0F0
        }

        .article-detail .detail-content em {
            font-style: italic;
            color: #6A6A92;
            transition: color 0.3s ease
        }

        body.dark .article-detail .detail-content em {
            color: #A8A4C8
        }

        .article-detail .detail-content a {
            color: #6B5ACF;
            text-decoration: underline;
            text-underline-offset: 2px;
            transition: color 0.3s ease
        }

        body.dark .article-detail .detail-content a {
            color: #88ccff
        }

        .article-detail .detail-content del {
            color: #8A8AB5;
            text-decoration: line-through;
            transition: color 0.3s ease
        }

        body.dark .article-detail .detail-content del {
            color: #6A6A8A
        }

        .article-detail .detail-content u {
            text-decoration: underline;
            text-underline-offset: 2px
        }

        .article-detail .detail-content kbd {
            display: inline-block;
            background: rgba(0, 0, 0, 0.06);
            padding: 0.1rem 0.5rem;
            border-radius: 4px;
            font-family: 'Inter', monospace;
            font-size: 0.85em;
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.04);
            transition: background 0.3s ease, border-color 0.3s ease
        }

        body.dark .article-detail .detail-content kbd {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.08)
        }

        .article-detail .detail-content mark {
            background: rgba(255, 215, 0, 0.3);
            padding: 0 0.2rem;
            border-radius: 2px;
            transition: background 0.3s ease
        }

        body.dark .article-detail .detail-content mark {
            background: rgba(255, 215, 0, 0.2)
        }

        .article-detail .detail-content sup {
            font-size: 0.7em;
            vertical-align: super
        }

        .article-detail .detail-content sub {
            font-size: 0.7em;
            vertical-align: sub
        }

        .article-detail .detail-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
            font-size: 0.9rem;
            transition: border-color 0.3s ease
        }

        .article-detail .detail-content th,
        .article-detail .detail-content td {
            border: 1px solid rgba(0, 0, 0, 0.08);
            padding: 0.5rem 0.8rem;
            text-align: left;
            transition: border-color 0.3s ease, background 0.3s ease
        }

        body.dark .article-detail .detail-content th,
        body.dark .article-detail .detail-content td {
            border-color: rgba(255, 255, 255, 0.06)
        }

        .article-detail .detail-content th {
            background: rgba(0, 0, 0, 0.04);
            font-weight: 600;
            transition: background 0.3s ease
        }

        body.dark .article-detail .detail-content th {
            background: rgba(255, 255, 255, 0.04)
        }

        .article-detail .detail-content tr:nth-child(even) td {
            background: rgba(0, 0, 0, 0.02)
        }

        body.dark .article-detail .detail-content tr:nth-child(even) td {
            background: rgba(255, 255, 255, 0.02)
        }

        .article-detail .detail-content .footnote-ref a {
            font-size: 0.75em;
            vertical-align: super;
            text-decoration: none;
            color: #6B5ACF;
            margin-left: 1px;
            transition: color 0.3s ease;
            cursor: pointer;
            font-weight: 600;
        }

        .article-detail .detail-content .footnote-ref a:hover {
            color: #4A3DB8;
            text-decoration: underline;
        }

        body.dark .article-detail .detail-content .footnote-ref a {
            color: #88ccff;
        }

        body.dark .article-detail .detail-content .footnote-ref a:hover {
            color: #60A5FA;
        }

        .article-detail .detail-content .footnotes {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            font-size: 0.85rem;
            color: #6A6A92;
            transition: border-color 0.3s ease, color 0.3s ease
        }

        body.dark .article-detail .detail-content .footnotes {
            border-top-color: rgba(255, 255, 255, 0.06);
            color: #8A8AA8
        }

        .article-detail .detail-content .footnotes .footnote-def {
            margin-bottom: 0.3rem;
            padding-left: 1.8rem;
            position: relative
        }

        .article-detail .detail-content .footnotes .footnote-def .footnote-back {
            position: absolute;
            left: 0;
            text-decoration: none;
            color: #6B5ACF;
            font-size: 0.8rem;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .article-detail .detail-content .footnotes .footnote-def .footnote-back:hover {
            color: #4A3DB8;
        }

        body.dark .article-detail .detail-content .footnotes .footnote-def .footnote-back {
            color: #88ccff
        }

        body.dark .article-detail .detail-content .footnotes .footnote-def .footnote-back:hover {
            color: #60A5FA;
        }

        .footnote-number {
            font-weight: 600;
            color: #6B5ACF;
            margin-right: 0.3rem;
            font-size: 0.85rem;
        }

        body.dark .footnote-number {
            color: #88ccff;
        }

        .article-detail .detail-content ul,
        .article-detail .detail-content ol {
            padding-left: 1.8rem;
            margin: 0.6rem 0;
            list-style-position: outside
        }

        .article-detail .detail-content li {
            display: list-item;
            word-break: break-word;
            white-space: normal;
            line-height: 1.8;
            margin-bottom: 0.2rem
        }

        .article-detail .detail-content li ul,
        .article-detail .detail-content li ol {
            margin: 0.2rem 0
        }

        .article-detail .detail-content ul.task-list {
            list-style: none;
            padding-left: 0.2rem;
            margin: 0.6rem 0
        }

        .article-detail .detail-content ul.task-list li {
            display: flex;
            align-items: flex-start;
            gap: 0;
            list-style: none;
            margin-bottom: 0.2rem
        }

        .article-detail .detail-content ul.task-list li::before {
            content: '';
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid #6B5ACF;
            border-radius: 3px;
            background: transparent;
            flex-shrink: 0;
            margin-top: 0.25rem;
            margin-right: 0.4rem;
            box-sizing: border-box;
            font-size: 0.7rem;
            line-height: 1;
            text-align: center;
            color: #fff
        }

        body.dark .article-detail .detail-content ul.task-list li::before {
            border-color: #88ccff
        }

        .article-detail .detail-content ul.task-list li[data-checked="true"]::before {
            content: '✓' !important;
            background: #6B5ACF !important;
            border-color: #6B5ACF !important;
            color: #fff !important
        }

        body.dark .article-detail .detail-content ul.task-list li[data-checked="true"]::before {
            background: #88ccff !important;
            border-color: #88ccff !important;
            color: #1a1a2e !important
        }

    <script>
        function getParam(name) {
            const url = new URL(window.location.href);
            return url.searchParams.get(name);
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function unescapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.innerHTML = text;
            return div.textContent;
        }

        function markdownToPlainText(md) {
            if (!md) return '';
            let text = md;
            text = text.replace(/```[\s\S]*?```/g, '');
            text = text.replace(/`([^`]+)`/g, '$1');
            text = text.replace(/!video\[[^\]]*\]\([^)]*\)/g, '');
            text = text.replace(/!\[[^\]]*\]\([^)]*\)/g, '');
            text = text.replace(/\*\*(.*?)\*\*/g, '$1');
            text = text.replace(/\*([^*]+)\*/g, '$1');
            text = text.replace(/~~(.*?)~~/g, '$1');
            text = text.replace(/\[([^\]]*)\]\([^)]*\)/g, '$1');
            text = text.replace(/^#{1,6}\s+/gm, '');
            text = text.replace(/^-\s+/gm, '');
            text = text.replace(/^\d+\.\s+/gm, '');
            text = text.replace(/^>\s+/gm, '');
            text = text.replace(/^---$/gm, '');
            text = text.replace(/\n/g, ' ');
            text = text.replace(/\s{2,}/g, ' ');
            return text.trim();
        }

        function showToast(message, icon) {
            icon = icon || 'fa-info-circle';
            const toast = document.getElementById('toast');
            toast.innerHTML = '<i class="fas ' + icon + '"></i> ' + message;
            toast.classList.add('show');
            clearTimeout(toast._hideTimer);
            toast._hideTimer = setTimeout(function() {
                toast.classList.remove('show');
            }, 2000);
        }
        const progressWrap = document.getElementById('readingProgress');
        const progressBar = document.getElementById('progressBar');
        let lastProgress = 0;
        let hideTimer = null;
        let isProgressLocked = false;
        let progressRAF = null;
        let lbProgress = 0;

        function updateReadingProgress() {
            if (isProgressLocked) return;
            const articleDetail = document.querySelector('.article-detail');
            if (!articleDetail) {
                progressBar.style.width = '0%';
                return;
            }
            const rect = articleDetail.getBoundingClientRect();
            const articleHeight = rect.height;
            const articleTop = rect.top + window.scrollY;
            const windowHeight = window.innerHeight;
            const maxScroll = articleHeight - windowHeight;
            let progress = 0;
            if (maxScroll <= 0) {
                progress = 100;
            } else {
                const currentScroll = window.scrollY - articleTop;
                progress = Math.min(Math.max((currentScroll / maxScroll) * 100, 0), 100);
            }
            progressBar.style.width = progress + '%';
            if (progress >= 100 && lastProgress < 100) {
                if (hideTimer) {
                    clearTimeout(hideTimer);
                    hideTimer = null;
                }
                hideTimer = setTimeout(() => {
                    progressWrap.style.transition = 'opacity 0.8s ease';
                    progressWrap.style.opacity = '0';
                    setTimeout(() => {
                        progressWrap.style.display = 'none';
                    }, 800);
                }, 600);
            }
            if (progress < 100) {
                if (hideTimer) {
                    clearTimeout(hideTimer);
                    hideTimer = null;
                }
                progressWrap.style.display = 'block';
                progressWrap.style.opacity = '1';
                progressWrap.style.transition = 'opacity 0.3s ease';
            }
            lastProgress = progress;
        }
        window.addEventListener('scroll', updateReadingProgress);
        window.addEventListener('resize', updateReadingProgress);
        window.addEventListener('load', updateReadingProgress);
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        let currentTheme = localStorage.getItem('ks-theme') || (prefersDark ? 'dark' : 'light');

        function setTheme(theme) {
            document.body.classList.toggle('dark', theme === 'dark');
            themeIcon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
            localStorage.setItem('ks-theme', theme);
            currentTheme = theme;
        }
        setTheme(currentTheme);
        themeToggle.addEventListener('click', function() {
            setTheme(currentTheme === 'dark' ? 'light' : 'dark');
        });
        const backToTopBtn = document.getElementById('backToTopBtn');
        let isScrollingToTop = false;
        window.addEventListener('scroll', function() {
            const scrollY = window.scrollY || window.pageYOffset;
            if (scrollY > 300 && !isScrollingToTop) {
                backToTopBtn.classList.add('show');
            } else if (!isScrollingToTop) {
                backToTopBtn.classList.remove('show');
            }
        });

        function fastScrollToTop() {
            const startY = window.scrollY || window.pageYOffset;
            if (startY === 0) return;
            const duration = 300;
            const startTime = performance.now();

            function step(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const ease = 1 - Math.pow(1 - progress, 3);
                const nextY = startY * (1 - ease);
                window.scrollTo(0, nextY);
                if (progress < 1) {
                    requestAnimationFrame(step);
                } else {
                    window.scrollTo(0, 0);
                    isScrollingToTop = false;
                    backToTopBtn.classList.remove('disabled');
                    backToTopBtn.classList.remove('show');
                }
            }
            requestAnimationFrame(step);
        }
        backToTopBtn.addEventListener('click', function() {
            if (isScrollingToTop) return;
            const scrollY = window.scrollY || window.pageYOffset;
            if (scrollY === 0) return;
            isScrollingToTop = true;
            backToTopBtn.classList.add('disabled');
            fastScrollToTop();
        });
        const backBtn = document.getElementById('backButton');
        const from = getParam('from');
        const page = getParam('page');
        const folder = getParam('folder');
        let returnUrl = 'index.html?return=articles';
        if (page) returnUrl += '&page=' + page;
        if (from === 'archive' && folder === 'articles') {
            returnUrl = 'index.html?return=archive&folder=articles';
        } else if (from === 'archive') {
            returnUrl = 'index.html?return=archive';
        }
        backBtn.href = returnUrl;
        const appContent = document.getElementById('appContent');
        let currentArticle = null;
        let currentShareText = '';
        let walineInitialized = false;

        function countWords(markdown) {
            if (!markdown) return 0;
            let text = markdown
                .replace(/```[\s\S]*?```/g, '')
                .replace(/`[^`]+`/g, '')
                .replace(/!video\[[^\]]*\]\([^)]*\)/g, '')
                .replace(/!\[[^\]]*\]\([^)]*\)/g, '')
                .replace(/\*\*(.*?)\*\*/g, '$1')
                .replace(/\*([^*]+)\*/g, '$1')
                .replace(/~~(.*?)~~/g, '$1')
                .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
                .replace(/!\[([^\]]*)\]\([^)]*\)/g, '')
                .replace(/^#{1,6}\s+/gm, '')
                .replace(/^-\s+/gm, '')
                .replace(/^\d+\.\s+/gm, '')
                .replace(/^>\s+/gm, '')
                .replace(/^---$/gm, '')
                .replace(/^\s*[-*+]\s+\[[ x]\]\s+/gm, '')
                .replace(/\s+/g, ' ')
                .trim();
            return text.length;
        }

        function calculateReadTime(wordCount) {
            if (wordCount === 0) return 114514;
            const minutes = Math.ceil(wordCount / 300);
            return minutes < 1 ? 1 : minutes;
        }

        function formatReadTime(minutes) {
            if (minutes === 114514) return '114514 分钟';
            return '大约 ' + minutes + ' 分钟';
        }

        function formatWordCount(count) {
            if (count === 0) return '没有字哦';
            return count + ' 字';
        }

        function getSharePreview(content, title) {
            const plain = markdownToPlainText(content);
            const wordCount = countWords(content);
            if (wordCount === 0) return '[没有字捏 是什么自己打开看]';
            const chars = [...plain];
            if (chars.length <= 80) return plain;
            const truncated = chars.slice(0, 80).join('');
            return truncated + '…';
        }

        function getShareDesc(content) {
            const wordCount = countWords(content);
            if (wordCount === 0) return '[没有字捏 是什么自己打开看]';
            const plain = markdownToPlainText(content);
            const chars = [...plain];
            if (chars.length <= 80) return plain;
            const truncated = chars.slice(0, 80).join('');
            return truncated + '…';
        }

        function getPlainPreview(content, maxLength) {
            maxLength = maxLength || 80;
            const plain = markdownToPlainText(content);
            const wordCount = countWords(content);
            if (wordCount === 0) return '[没有字捏 是什么自己打开看]';
            const chars = [...plain];
            if (chars.length <= maxLength) return plain;
            const truncated = chars.slice(0, maxLength).join('');
            return truncated + '…';
        }
        let lbImageData = [];
        let currentLbIndex = 0;
        let isPlaying = false;
        let lbIsOpen = false;
        let lbProgressRAF = null;
        let lbPlayTimer = null;
        let lbIntervalId = null;

        function renderMarkdown(md) {
            if (!md) return '';
            const escMap = {};
            let escCounter = 0;
            md = md.replace(/\\([\\`*_{}\[\]()#+\-.!|$])/g, function(match, char) {
                const key = '\uE000' + (escCounter++) + '\uE001';
                escMap[key] = char;
                return key;
            });
            const safeTags = ['u', 'kbd', 'mark', 's', 'sub', 'sup', 'ins', 'del', 'b', 'i', 'em', 'strong', 'code',
                'span', 'br', 'hr'
            ];

            let footnotes = {};
            let footnoteCounter = 0;
            let footnoteIdMap = {};

            function getFootnoteId(key) {
                if (!footnoteIdMap[key]) {
                    footnoteCounter++;
                    footnoteIdMap[key] = footnoteCounter;
                }
                return footnoteIdMap[key];
            }

            function restoreEscapes(text) {
                let r = text;
                for (const [key, char] of Object.entries(escMap)) {
                    r = r.replace(new RegExp(key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g'), char);
                }
                return r;
            }

            function renderInline(text) {
                let html = text;
                html = html.replace(/<([a-zA-Z][a-zA-Z0-9+.-]*:\/\/[^\s<>]+)>/g, '<a href="$1">$1</a>');
                var tagMap = {};
                var tagIndex = 0;
                html = html.replace(/<[^>]+>/g, function(match) {
                    var key = '\uE002' + (tagIndex++) + '\uE003';
                    tagMap[key] = match;
                    return key;
                });
                html = html.replace(/<([a-zA-Z][a-zA-Z0-9]*)\b([^>]*)>(.*?)<\/\1>/gs, function(match, tag, attrs,
                    content) {
                    if (safeTags.includes(tag.toLowerCase())) {
                        return '<' + tag + attrs + '>' + renderInline(content) + '</' + tag + '>';
                    }
                    return match;
                });
                html = html.replace(/<br\s*\/?>/gi, '<br>');
                html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
                html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
                html = html.replace(/~~(.*?)~~/g, '<del>$1</del>');
                html = html.replace(/!\[([^\]]*)\]\(([^)]*?)(?:\s+"([^"]*)")?(?:\s+=\s*(\d*)(?:x(\d+))?)?\)/g,
                    function(match, alt, src, title, w, h) {
                        var style = '';
                        if (w && h) style = ' style="width:' + w + 'px; height:' + h + 'px;"';
                        else if (w) style = ' style="width:' + w + 'px; height:auto;"';
                        else if (h) style = ' style="height:' + h + 'px; width:auto;"';
                        var titleAttr = title ? ' title="' + title + '"' : '';
                        return '<img src="' + src + '" alt="' + alt + '" loading="lazy"' + style + titleAttr +
                            ' />';
                    });
                html = html.replace(
                    /!video\[([^\]]*)\]\(([^)]*?)(?:\s+"([^"]*)")?(?:\s+=\s*(\d*)(?:x(\d+))?)?\)/g,
                    function(match, desc, src, title, w, h) {
                        var style = '';
                        if (w && h) style = ' style="width:' + w + 'px; height:' + h + 'px;"';
                        else if (w) style = ' style="width:' + w + 'px; height:auto;"';
                        else if (h) style = ' style="height:' + h + 'px; width:auto;"';
                        var descHtml = desc ? '<div class="video-alt-text">' + desc + '</div>' : '';
                        var youtubeMatch = src.match(
                            /(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
                        if (youtubeMatch) {
                            var vid = youtubeMatch[1];
                            return '<div class="video-placeholder"><span class="video-loading"><i class="fas fa-spinner fa-spin"></i></span><iframe src="https://www.youtube.com/embed/' +
                                vid + '" frameborder="0" allowfullscreen' + style + '></iframe>' +
                                descHtml + '</div>';
                        }
                        var bilibiliMatch = src.match(/(?:bilibili\.com\/video\/)(BV[a-zA-Z0-9]+)/);
                        if (bilibiliMatch) {
                            var vid = bilibiliMatch[1];
                            return '<div class="video-placeholder"><span class="video-loading"><i class="fas fa-spinner fa-spin"></i></span><iframe src="https://player.bilibili.com/player.html?bvid=' +
                                vid + '" frameborder="0" allowfullscreen' + style + '></iframe>' +
                                descHtml + '</div>';
                        }
                        return '<div class="video-placeholder"><video src="' + src + '" controls' + style +
                            '></video>' + descHtml + '</div>';
                    });
                html = html.replace(/\[([^\]]*)\]\(([^)]*)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
                html = html.replace(/\[\^([^\]]+)\]/g, function(match, key) {
                    var id = getFootnoteId(key);
                    return '<sup class="footnote-ref"><a data-footnote-ref="' + id + '">' + id +
                        '</a></sup>';
                });
                html = restoreEscapes(html);
                for (var key in tagMap) {
                    if (tagMap.hasOwnProperty(key)) {
                        html = html.replace(new RegExp(key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g'), tagMap[
                            key
                        ]);
                    }
                }
                return html;
            }

            function renderBlock(content) {
                if (!content) return '';
                var lines = content.split('\n');
                var result = '';
                var inList = false;
                var listStack = [];

                function flushList() {
                    if (!inList) return;
                    var html = '';
                    for (var i = listStack.length - 1; i >= 0; i--) {
                        var list = listStack[i];
                        var tag = list.type === 'ol' ? 'ol' : 'ul';
                        var cls = list.type === 'task' ? ' class="task-list"' : '';
                        var startAttr = '';
                        if (list.type === 'ol' && list.start !== null && list.start !== 1) {
                            startAttr = ' start="' + list.start + '"';
                        }
                        html = '<' + tag + cls + startAttr + '>\n' + list.items.join('\n') + '\n</' + tag + '>\n' +
                            html;
                    }
                    result += html;
                    inList = false;
                    listStack = [];
                }
                for (var i = 0; i < lines.length; i++) {
                    var line = lines[i];
                    if (line.trim() === '') {
                        if (inList) {
                            flushList();
                            result += '\n';
                        } else {
                            result += '\n';
                        }
                        continue;
                    }
                    var footnoteDefMatch = line.match(/^\[\^([^\]]+)\]:\s*(.*)/);
                    if (footnoteDefMatch) {
                        if (inList) flushList();
                        var fnKey = footnoteDefMatch[1];
                        var fnContent = footnoteDefMatch[2];
                        var fnId = getFootnoteId(fnKey);
                        footnotes[fnId] = { key: fnKey, content: fnContent };
                        continue;
                    }
                    var blockquoteMatch = line.match(/^(>+)\s?(.*)/);
                    if (blockquoteMatch) {
                        if (inList) flushList();
                        var quoteLines = [];
                        var j = i;
                        while (j < lines.length) {
                            var qm = lines[j].match(/^((?:>\s*)+)(.*)/);
                            if (qm) {
                                var level = (qm[1].match(/>/g) || []).length;
                                quoteLines.push({ level: level, content: qm[2] });
                                j++;
                            } else if (lines[j].trim() === '') {
                                break;
                            } else {
                                break;
                            }
                        }
                        i = j - 1;

                        function processQuotes(quoteLines) {
                            if (quoteLines.length === 0) return '';
                            var minLevel = Math.min.apply(null, quoteLines.map(function(q) { return q
                                    .level; }));

                            function buildLevel(startIdx, currentLevel) {
                                var html = '';
                                var k = startIdx;
                                while (k < quoteLines.length) {
                                    if (quoteLines[k].level < currentLevel) {
                                        break;
                                    }
                                    if (quoteLines[k].level === currentLevel) {
                                        var contentParts = [];
                                        while (k < quoteLines.length && quoteLines[k].level ===
                                            currentLevel) {
                                            contentParts.push(renderInline(quoteLines[k].content));
                                            k++;
                                        }
                                        html += contentParts.join('<br>');
                                    } else if (quoteLines[k].level > currentLevel) {
                                        var nextLevel = quoteLines[k].level;
                                        var nestedResult = buildLevel(k, nextLevel);
                                        html += nestedResult.html;
                                        k = nestedResult.newIndex;
                                    }
                                }
                                return { html: '<blockquote>' + html + '</blockquote>', newIndex: k };
                            }
                            return buildLevel(0, minLevel).html;
                        }
                        result += processQuotes(quoteLines) + '\n';
                        continue;
                    }
                    var headingMatch = line.match(/^(#{1,6})\s+(.*)/);
                    if (headingMatch) {
                        if (inList) flushList();

                        var htext = headingMatch[2];
                        result += '<h' + hlevel + '>' + renderInline(htext) + '</h' + hlevel + '>\n';
                        continue;
                    }
                    if (/^---$/.test(line.trim()) || /^\*\*\*$/.test(line.trim()) || /^___$/.test(line.trim())) {
                        if (inList) flushList();

                        continue;
                    }
                    var tableLineMatch = line.match(/^\|(.+)\|$/);
                    if (tableLineMatch) {
                        if (inList) flushList();
                        var tableRows = [];
                        var j = i;
                        while (j < lines.length) {
                            var tmatch = lines[j].match(/^\|(.+)\|$/);
                            if (tmatch) {
                                tableRows.push(tmatch[1]);
                                j++;
                            } else {
                                break;
                            }
                        }
                        i = j - 1;
                        if (tableRows.length >= 2) {
                            var headerCells = tableRows[0].split('|').map(function(cell) { return cell.trim(); });
                            var alignRow = tableRows[1].split('|').map(function(cell) { return cell.trim(); });
                            var isAlignRow = alignRow.every(function(cell) {
                                return /^:?-+:?$/.test(cell);
                            });
                            var dataStart = isAlignRow ? 2 : 1;
                            var alignments = [];
                            if (isAlignRow) {
                                alignments = alignRow.map(function(cell) {
                                    if (/^:-+:$/.test(cell)) return 'center';
                                    if (/^-+:$/.test(cell)) return 'right';

                                });
                            } else {
                                alignments = headerCells.map(function() { return 'left'; });
                            }
                            var tableHtml = '<table><thead><tr>';
                            for (var ci = 0; ci < headerCells.length; ci++) {
                                var alignAttr = alignments[ci] ? ' style="text-align:' + alignments[ci] + ';"' :
                                    '';
                                tableHtml += '<th' + alignAttr + '>' + renderInline(headerCells[ci]) + '</th>';
                            }
                            tableHtml += '</tr></thead><tbody>';
                            for (var ri = dataStart; ri < tableRows.length; ri++) {
                                var rowCells = tableRows[ri].split('|').map(function(cell) { return cell.trim(); });
                                tableHtml += '<tr>';
                                for (var rci = 0; rci < headerCells.length; rci++) {
                                    var cellContent = rci < rowCells.length ? rowCells[rci] : '';
                                    var rAlignAttr = alignments[rci] ? ' style="text-align:' + alignments[rci] +
                                        ';"' : '';
                                    tableHtml += '<td' + rAlignAttr + '>' + renderInline(cellContent) + '</td>';
                                }

                            }
                            tableHtml += '</tbody></table>';

                        }
                    }
                    var listMatch = line.match(/^(\s*)([-*+]|\d+\.)\s+(.*)/);
                    if (listMatch) {
                        var indent = listMatch[1].length;
                        var marker = listMatch[2];
                        var listContent = listMatch[3];
                        var isTask = listContent.match(/^\[([ x])\]\s+(.*)/);
                        var taskChecked = false;
                        var taskContent = listContent;
                        if (isTask) {
                            taskChecked = isTask[1] === 'x';
                            taskContent = isTask[2];
                        }
                        var isOrdered = marker.match(/^\d+\.$/);
                        var listType = isOrdered ? 'ol' : (isTask ? 'task' : 'ul');
                        var currentLevel = Math.floor(indent / 2);
                        if (!inList) {
                            inList = true;
                            listStack = [];
                            listStack.push({
                                type: listType,
                                items: [],
                                level: currentLevel,
                                start: isOrdered ? parseInt(marker) : null
                            });
                        } else {
                            while (listStack.length > 0 && listStack[listStack.length - 1].level > currentLevel) {
                                var last = listStack.pop();
                                if (listStack.length > 0 && last.items.length > 0) {
                                    listStack[listStack.length - 1].items.push(last.items.join(''));
                                } else if (listStack.length === 0 && last.items.length > 0) {
                                    result += '<' + (last.type === 'ol' ? 'ol' : 'ul') + '>\n' + last.items.join(
                                        '\n') + '\n</' + (last.type === 'ol' ? 'ol' : 'ul') + '>\n';
                                }
                            }
                            if (listStack.length === 0 || listStack[listStack.length - 1].level < currentLevel) {
                                listStack.push({
                                    type: listType,
                                    items: [],
                                    level: currentLevel,
                                    start: isOrdered ? parseInt(marker) : null
                                });
                            }
                        }
                        var itemContent;
                        if (isTask) {
                            itemContent = '<li data-checked="' + (taskChecked ? 'true' : 'false') + '">' +
                                renderInline(taskContent) + '</li>';
                        } else {
                            itemContent = '<li>' + renderInline(listContent) + '</li>';
                        }
                        if (listStack.length > 0) {
                            var currentList = listStack[listStack.length - 1];
                            if (currentList.type !== listType && currentList.type !== 'task') {
                                var newList = {
                                    type: listType,
                                    items: [itemContent],
                                    level: currentLevel + 1,

                                listStack.push(newList);
                            } else {
                                currentList.items.push(itemContent);
                            }
                        }
                        var subItems = [];
                        var k = i + 1;

                            var nextLine2 = lines[k];
                            var nextMatch2 = nextLine2.match(/^(\s*)([-*+]|\d+\.)\s+(.*)/);
                            if (nextMatch2 && parseInt(nextMatch2[1].length) > indent) {
                                var subContent = nextMatch2[3];
                                var subIsTask = subContent.match(/^\[([ x])\]\s+(.*)/);
                                var subHtml = '';
                                if (subIsTask) {
                                    var subChecked = subIsTask[1] === 'x';
                                    subHtml = '<li data-checked="' + (subChecked ? 'true' : 'false') +
                                        '">' + renderInline(subIsTask[2]) + '</li>';
                                } else {
                                    subHtml = '<li>' + renderInline(subContent) + '</li>';
                                }
                                subItems.push(subHtml);
                                k++;
                            } else {
                                break;
                            }
                        }
                        if (subItems.length > 0) {
                            var hasCheckbox = subItems.some(function(item) {
                                return item.includes('data-checked');
                            });
                            var subHtml2 = '<ul class="' + (hasCheckbox ? 'task-list' : '') + '">\n' + subItems
                                .join('\n') + '\n</ul>';
                            if (listStack.length > 0) {
                                var currentList2 = listStack[listStack.length - 1];
                                var lastItem2 = currentList2.items[currentList2.items.length - 1];
                                currentList2.items[currentList2.items.length - 1] = lastItem2.replace(
                                    /<\/li>$/, subHtml2 + '</li>');
                            }
                        }
                        i = k - 1;
                        continue;
                    }
                    if (inList) {
                        flushList();
                    }
                    var dlMatch = line.match(/^([^:]+):\s+(.*)/);
                    if (dlMatch && i + 1 < lines.length && lines[i + 1].match(/^:\s+/)) {
                        var term = renderInline(dlMatch[1]);
                        var defs = [];
                        i++;
                        while (i < lines.length && lines[i].match(/^:\s+/)) {
                            defs.push(renderInline(lines[i].replace(/^:\s+/, '')));
                            i++;
                        }
                        while (i < lines.length && lines[i].trim() === '') i++;
                        var ddHtml = defs.map(function(d) { return '<dd>' + d + '</dd>'; }).join('');
                        result += '<dl><dt>' + term + '</dt>' + ddHtml + '</dl>\n';
                        continue;
                    }
                    result += '<p>' + renderInline(line) + '</p>\n';
                }
                if (inList) {
                    flushList();
                }
                return result;
            }
            var codeBlockRegex = /^```(\w*)\s*([\s\S]*?)```/gm;
            var codeBlocks = [];
            var codeIndex = 0;
            md = md.replace(codeBlockRegex, function(match, lang, code) {
                var id = 'CODEBLOCK_' + (codeIndex++);
                codeBlocks.push({ id: id, lang: lang, code: code });
                return id;
            });
            var html = renderBlock(md);
            for (var b = 0; b < codeBlocks.length; b++) {
                var block = codeBlocks[b];
                var copyId = 'code-' + Date.now() + '-' + b;
                var lines2 = block.code.split('\n');
                var lineCount = lines2.length;
                var maxLineLength = 0;
                var totalChars = 0;
                for (var j2 = 0; j2 < lines2.length; j2++) {
                    var lineLen = lines2[j2].length;
                    if (lineLen > maxLineLength) maxLineLength = lineLen;
                    totalChars += lineLen;
                }
                totalChars += lineCount > 0 ? lineCount - 1 : 0;
                var codeHtml = '';
                for (var j3 = 0; j3 < lines2.length; j3++) {
                    var lineNum = j3 + 1;
                    var escapedLine = escapeHtml(lines2[j3]);
                    codeHtml += '<span class="code-line"><span class="line-number">' + lineNum +
                        '</span><span class="hljs">' + escapedLine + '</span></span>';
                }
                var statsHtml = '<span>' + lineCount + ' 行</span> · <span>' + maxLineLength + ' 列</span> · <span>' +
                    totalChars + ' 字符</span>';
                var codeBlockHtml = `
                    <div class="code-block-wrapper" id="cbw-${copyId}">
                        <div class="code-block-header">
                            <span class="lang-label">${escapeHtml(block.lang || 'text')}</span>
                            <span class="code-stats">${statsHtml}</span>
                            <span class="header-actions">
                                <button class="copy-btn" data-copy="${copyId}"><i class="fas fa-copy"></i> 复制</button>
                                <button class="collapse-btn" data-target="cbw-${copyId}">

                        <div class="code-block-body-wrapper">
                            <div class="code-block-body" id="code-body-${copyId}">
                                ${codeHtml}
                            </div>
                        </div>
                    </div>
                `;
                html = html.replace(block.id, codeBlockHtml);
            }
            if (Object.keys(footnotes).length > 0) {
                var footnotesHtml = '<div class="footnotes">';
                for (var fnId = 1; fnId <= footnoteCounter; fnId++) {
                    if (footnotes[fnId]) {
                        footnotesHtml += '<div class="footnote-def" id="footnote-def-' + fnId + '">';
                        footnotesHtml += '<a class="footnote-back" data-footnote-back="' + fnId + '">↩</a> ';
                        footnotesHtml += '<span class="footnote-number">[' + fnId + ']</span> ';
                        footnotesHtml += renderInline(footnotes[fnId].content);
                        footnotesHtml += '</div>';
                    }
                }
                footnotesHtml += '</div>';
                html += footnotesHtml;
            }
            html = html.replace(/\n{3,}/g, '\n\n');
            return html;
        }

        function scrollToFootnote(id) {
            var el = document.getElementById(id);
            if (!el) return;
            var targetY = el.getBoundingClientRect().top + window.scrollY - 80;
            var startY = window.scrollY || window.pageYOffset;
            var distance = targetY - startY;
            if (Math.abs(distance) < 5) return;
            var duration = 350;
            var startTime = performance.now();

            function step(currentTime) {
                var elapsed = currentTime - startTime;
                var progress = Math.min(elapsed / duration, 1);
                var ease = progress < 0.5 ? 4 * progress * progress * progress : 1 - Math.pow(-2 * progress + 2, 3) / 2;
                var nextY = startY + distance * ease;
                window.scrollTo(0, nextY);
                if (progress < 1) {
                    requestAnimationFrame(step);
                } else {
                    window.scrollTo(0, targetY);
                    if (window.history && window.history.replaceState) {
                        window.history.replaceState(null, '', window.location.pathname + window.location.search);
                    }
                }
            }
            requestAnimationFrame(step);
        }

        function initImageLazyLoad() {
            var placeholders = document.querySelectorAll('.img-placeholder');
            placeholders.forEach(function(container) {
                var img = container.querySelector('img');
                if (!img) return;
                if (img.complete && img.naturalWidth !== 0) {
                    container.classList.add('loaded');
                    img.classList.add('loaded');
                    var loading = container.querySelector('.img-loading');
                    if (loading) loading.style.display = 'none';
                    return;
                }
                img.addEventListener('load', function() {
                    container.classList.add('loaded');
                    img.classList.add('loaded');
                    var loading = container.querySelector('.img-loading');
                    if (loading) loading.style.display = 'none';
                });
                img.addEventListener('error', function() {
                    container.classList.add('loaded');
                    var loading = container.querySelector('.img-loading');
                    if (loading) loading.style.display = 'none';
                });
            });
        }

        function initVideoLazyLoad() {
            var placeholders = document.querySelectorAll('.video-placeholder');
            placeholders.forEach(function(container) {
                var iframe = container.querySelector('iframe');
                if (!iframe) return;
                var loadingEl = container.querySelector('.video-loading');
                iframe.addEventListener('load', function() {
                    container.classList.add('loaded');
                    if (loadingEl) loadingEl.style.display = 'none';
                });
                setTimeout(function() {
                    if (!container.classList.contains('loaded')) {
                        container.classList.add('loaded');
                        if (loadingEl) loadingEl.style.display = 'none';
                    }

            });
        }

        function compressImage(file, maxSize, quality) {
            return new Promise(function(resolve) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    var img = new Image();
                    img.onload = function() {
                        var canvas = document.createElement('canvas');
                        var w = img.width,
                            h = img.height;
                        if (w > h) {
                            if (w > maxSize) { h = h * maxSize / w;
                                w = maxSize; }
                        } else {
                            if (h > maxSize) { w = w * maxSize / h;
                                h = maxSize; }
                        }
                        canvas.width = w;
                        canvas.height = h;
                        var ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        canvas.toBlob(function(blob) {
                            resolve(new File([blob], file.name, { type: 'image/jpeg' }));
                        }, 'image/jpeg', quality);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function generateQRCanvas(text, size) {
            return new Promise(function(resolve, reject) {
                var img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = function() {
                    var canvas = document.createElement('canvas');
                    canvas.width = size;
                    canvas.height = size;
                    var ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, size, size);
                    resolve(canvas);
                };
                img.onerror = function() {
                    reject(new Error('二维码图片加载失败'));
                };
                img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=' + size + 'x' + size + '&data=' +

            img.addEventListener('wheel', function(e) {

                var ratioX = (e.clientX - rect.left) / rect.width;
                var ratioY = (e.clientY - rect.top) / rect.height;
                var oldScale = scale;
                scale = newScale;
                translateX += (1 - newScale / oldScale) * (rect.width / 2 - rect.width * ratioX);

        var currentShareImageDataUrl = '';

        function generateShareImage() {
            if (!currentArticle) return;
            var title = currentArticle.title || '无标题';
            var date = currentArticle.date || '';
            var desc = getShareDesc(currentArticle.content || '');
            var url = window.location.origin + window.location.pathname + '?id=' + getParam('id');
            var canvas = document.createElement('canvas');
            var ctx = canvas.getContext('2d');
            var W = 900,
                H = 540;
            canvas.width = W;
            canvas.height = H;
            var grad = ctx.createLinearGradient(0, 0, W, H);
            grad.addColorStop(0, '#f8f5ff');
            grad.addColorStop(1, '#e8e0ff');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);
            ctx.globalAlpha = 0.05;
            for (var i = 0; i < 6; i++) {
                ctx.beginPath();
                ctx.arc(60 + i * 160, 40 + (i % 3) * 30, 80, 0, Math.PI * 2);
                ctx.fillStyle = '#7a6bcf';
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.textAlign = 'right';
            ctx.textBaseline = 'top';
            ctx.font = '400 14px "Inter", sans-serif';
            ctx.fillStyle = '#8a8ab5';
            ctx.fillText(date || '', W - 40, 28);
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.font = '700 52px "Inter", "PingFang SC", sans-serif';
            ctx.fillStyle = '#1a1a2e';
            var titleLines = wrapText(ctx, title || '无标题', W - 260);
            var titleDisplay = truncateLines(titleLines, 2);
            titleDisplay.forEach(function(line, i) {
                ctx.fillText(line, 40, 70 + i * 60);
            });
            var subY = 70 + Math.min(titleDisplay.length, 2) * 60 + 20;
            ctx.font = '400 22px "Inter", "PingFang SC", sans-serif';
            ctx.fillStyle = '#4a4a6e';
            var descLines = wrapText(ctx, desc || ' ', W - 260);
            var descDisplay = truncateLines(descLines, 4);
            descDisplay.forEach(function(line, i) {
                ctx.fillText(line, 40, subY + 10 + i * 34);
            });
            var bottomY = H - 44;
            ctx.font = '500 16px "Inter", "PingFang SC", sans-serif';
            ctx.fillStyle = '#6a6a92';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'bottom';
            ctx.fillText('ks', 40, bottomY);
            var qrSize = 180;
            var qrX = W - qrSize - 40;
            var qrY = H - qrSize - 40;
            generateQRCanvas(url, qrSize).then(function(qrCanvas) {
                ctx.shadowColor = 'rgba(0,0,0,0.06)';
                ctx.shadowBlur = 16;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 4;
                ctx.drawImage(qrCanvas, qrX, qrY, qrSize, qrSize);
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.font = '400 13px "Inter", sans-serif';
                ctx.fillStyle = '#aaaacc';
                ctx.fillText('扫码观看全文', qrX + qrSize / 2, qrY + qrSize + 10);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'bottom';
                ctx.font = '400 13px "Inter", sans-serif';
                ctx.fillStyle = '#c8c8e0';
                ctx.fillText('cuizi.top', W - 40, 18);
                currentShareImageDataUrl = canvas.toDataURL('image/png');
                document.getElementById('sharePreviewImg').src = currentShareImageDataUrl;
            }).catch(function() {
                ctx.fillStyle = '#f0edff';
                ctx.fillRect(qrX, qrY, qrSize, qrSize);
                ctx.fillStyle = '#aaa';
                ctx.font = '16px "Inter", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('二维码失败', qrX + qrSize / 2, qrY + qrSize / 2);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.font = '400 13px "Inter", sans-serif';
                ctx.fillStyle = '#aaaacc';
                ctx.fillText('扫码观看全文', qrX + qrSize / 2, qrY + qrSize + 10);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'bottom';
                ctx.font = '400 13px "Inter", sans-serif';
                ctx.fillStyle = '#c8c8e0';
                ctx.fillText('cuizi.top', W - 40, 18);
                currentShareImageDataUrl = canvas.toDataURL('image/png');
                document.getElementById('sharePreviewImg').src = currentShareImageDataUrl;
            });
        }

        function wrapText(ctx, text, maxWidth) {
            var chars = Array.from(text);
            var lines = [];
            var current = '';
            for (var i = 0; i < chars.length; i++) {
                var ch = chars[i];
                if (ctx.measureText(current + ch).width > maxWidth) {
                    lines.push(current);
                    current = ch;
                } else {
                    current += ch;
                }
            }
            if (current) lines.push(current);
            return lines;
        }

        function truncateLines(lines, maxLines) {
            if (lines.length <= maxLines) return lines;
            var result = lines.slice(0, maxLines);
            var last = result[result.length - 1];
            var trimmed = last.slice(0, -1) + '…';
            result[result.length - 1] = trimmed;
            return result;
        }

                scrollToFootnote('footnote-def-' + refId);
                return;
            }
            var footnoteBack = e.target.closest('[data-footnote-back]');
            if (footnoteBack) {
                e.preventDefault();
                var backId = footnoteBack.getAttribute('data-footnote-back');
                var refLink = document.querySelector('[data-footnote-ref="' + backId + '"]');
                if (refLink) {
                    var targetY = refLink.getBoundingClientRect().top + window.scrollY - 80;
                    var startY = window.scrollY || window.pageYOffset;
                    var distance = targetY - startY;
                    if (Math.abs(distance) < 5) return;
                    var duration = 350;
                    var startTime = performance.now();

                    function step(currentTime) {
                        var elapsed = currentTime - startTime;
                        var progress = Math.min(elapsed / duration, 1);
                        var ease = progress < 0.5 ? 4 * progress * progress * progress : 1 - Math.pow(-2 * progress +
                            2, 3) / 2;
                        var nextY = startY + distance * ease;
                        window.scrollTo(0, nextY);
                        if (progress < 1) {
                            requestAnimationFrame(step);
                        } else {
                            window.scrollTo(0, targetY);
                        }
                    }
                    requestAnimationFrame(step);
                }
                return;
            }
            var copyBtn = e.target.closest('.copy-btn');

                String(now.getHours()).padStart(2, '0') +
                String(now.getMinutes()).padStart(2, '0');
            a.download = '分享图_' + ts + '.png';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast('已保存', 'fa-check-circle');
        });
        renderArticle();
    </script>
</body>
</html>

    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{font-family:'Inter',-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#FAFAFE;color:#1A1A2E;line-height:1.8;min-height:100vh;transition:background 0.4s ease,color 0.3s ease}
        body.dark{background:#14131F;color:#E8E6F0}
        .reading-progress{position:fixed;top:0;left:0;width:100%;height:3px;background:rgba(0,0,0,0.08);z-index:9999;pointer-events:none;opacity:1;transition:opacity 0.3s ease}
        body.dark .reading-progress{background:rgba(255,255,255,0.1)}
        .reading-progress .progress-bar{height:100%;width:0%;background:#4A90D9;border-radius:0 4px 4px 0;transition:width 0.05s linear}
        body.dark .reading-progress .progress-bar{background:#60A5FA}
        .bg-glow{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-2;background:radial-gradient(circle at 30% 30%,#F6F2FF,#FFFFFF);transition:background 0.5s ease}
        body.dark .bg-glow{background:radial-gradient(circle at 30% 30%,#28253D,#0E0D18)}
        .glow-soft{position:fixed;width:70vw;height:70vw;background:radial-gradient(circle,rgba(160,130,230,0.15),rgba(210,190,255,0) 70%);border-radius:50%;top:-25vh;right:-20vw;z-index:-1;filter:blur(80px);animation:floatGlow 20s infinite alternate ease-in-out;transition:background 0.5s ease}
        body.dark .glow-soft{background:radial-gradient(circle,rgba(120,100,200,0.20),rgba(60,40,120,0) 70%)}
        .glow-soft-2{position:fixed;width:50vw;height:50vw;background:radial-gradient(circle,rgba(200,180,255,0.10),rgba(255,240,255,0) 70%);border-radius:50%;bottom:-15vh;left:-10vw;z-index:-1;filter:blur(70px);animation:floatGlow2 22s infinite alternate ease-in-out;transition:background 0.5s ease}
        body.dark .glow-soft-2{background:radial-gradient(circle,rgba(90,70,160,0.15),rgba(30,20,60,0) 70%)}
        @keyframes floatGlow{0%{transform:translate(0,0) scale(1);opacity:0.3}100%{transform:translate(5%,8%) scale(1.2);opacity:0.7}}
        @keyframes floatGlow2{0%{transform:translate(0,0) scale(1);opacity:0.2}100%{transform:translate(-6%,-5%) scale(1.3);opacity:0.6}}
        .container{max-width:700px;margin:0 auto;padding:2.8rem 1.8rem 2rem;display:flex;flex-direction:column;min-height:100vh;position:relative}
        .top-buttons{position:fixed;top:20px;left:20px;right:20px;z-index:50;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
        .top-buttons .left,.top-buttons .right{pointer-events:auto;display:flex;align-items:center;gap:0.5rem}
        .back-btn{background:rgba(255,255,255,0.6);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,0.8);border-radius:60px;padding:0.5rem 1.2rem 0.5rem 1rem;display:flex;align-items:center;gap:0.5rem;font-size:0.85rem;font-weight:500;color:#4F4F78;text-decoration:none;transition:0.25s ease;box-shadow:0 6px 20px rgba(80,60,160,0.10);cursor:pointer;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent!important;outline:none!important}
        body.dark .back-btn{background:rgba(30,28,50,0.7);border-color:rgba(255,255,255,0.08);color:#D0CAF0;box-shadow:0 6px 20px rgba(0,0,0,0.3)}
        .back-btn:hover{background:rgba(255,255,255,0.85);transform:translateY(-2px) scale(1.02)}
        body.dark .back-btn:hover{background:rgba(50,45,80,0.8)}
        .back-btn i{font-size:0.9rem}
        .share-btn{background:rgba(255,255,255,0.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,0.8);border-radius:60px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:#4F4F78;transition:0.25s ease;box-shadow:0 6px 20px rgba(80,60,160,0.10);cursor:pointer;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent!important;outline:none!important}
        body.dark .share-btn{background:rgba(30,28,50,0.7);border-color:rgba(255,255,255,0.08);color:#D0CAF0;box-shadow:0 6px 20px rgba(0,0,0,0.3)}
        .share-btn:hover{background:rgba(255,255,255,0.85);transform:scale(1.05)}
        body.dark .share-btn:hover{background:rgba(50,45,80,0.8)}
        .share-btn i{font-size:1.2rem}
        .back-to-top-btn{position:fixed;top:20px;right:80px;z-index:49;width:48px;height:48px;border:none;border-radius:50%;background:rgba(255,255,255,0.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.8);color:#4F4F78;font-size:1.2rem;cursor:pointer;transition:opacity 0.35s ease,transform 0.25s ease,background 0.3s ease,box-shadow 0.3s ease;box-shadow:0 6px 20px rgba(80,60,160,0.10);opacity:0;pointer-events:none;user-select:none;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent!important;outline:none!important}
        .back-to-top-btn:hover{transform:scale(1.05);background:rgba(255,255,255,0.85);box-shadow:0 10px 28px rgba(80,60,160,0.18)}
        .back-to-top-btn.show{opacity:1;pointer-events:auto}
        .back-to-top-btn:active{transform:scale(0.92)}
        .back-to-top-btn.disabled{opacity:0.3!important;pointer-events:none!important}
        body.dark .back-to-top-btn{background:rgba(30,28,50,0.7);border-color:rgba(255,255,255,0.08);color:#D0CAF0;box-shadow:0 6px 20px rgba(0,0,0,0.3)}
        body.dark .back-to-top-btn:hover{background:rgba(50,45,80,0.8)}
        .theme-toggle{position:fixed;top:20px;right:24px;z-index:50;background:rgba(255,255,255,0.6);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.8);border-radius:60px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:#4F4F78;cursor:pointer;transition:0.3s ease;box-shadow:0 6px 20px rgba(80,60,160,0.10);user-select:none;-webkit-tap-highlight-color:transparent!important;outline:none!important}
        .theme-toggle:hover{transform:scale(1.05) rotate(8deg);background:rgba(255,255,255,0.85);box-shadow:0 10px 28px rgba(80,60,160,0.18)}
        body.dark .theme-toggle{background:rgba(30,28,50,0.7);border-color:rgba(255,255,255,0.08);color:#D0CAF0;box-shadow:0 6px 20px rgba(0,0,0,0.3)}
        body.dark .theme-toggle:hover{background:rgba(50,45,80,0.8)}
        .theme-toggle:active{transform:scale(0.92)}
        @media (max-width:560px){
            .back-to-top-btn{top:14px;right:66px;width:42px;height:42px;font-size:1rem}
            .theme-toggle{top:14px;right:16px;width:42px;height:42px;font-size:1.2rem}
            .share-btn{width:42px;height:42px;font-size:1rem}
            .share-btn i{font-size:1rem}
            .top-buttons{top:14px;left:14px;right:14px}
            .back-btn{padding:0.4rem 1rem 0.4rem 0.8rem;font-size:0.75rem}
            .back-btn i{font-size:0.8rem}
            .reading-progress{height:2px}
        }
        .article-detail{max-width:640px;margin:0 auto;padding-top:2rem;width:100%}

        body.dark .article-detail .detail-title{color:#E8E6F0}

        body.dark .article-detail .detail-tags .tag{color:#88ccff;background:rgba(136,204,255,0.10)}

        body.dark .article-detail .detail-tags .tag:hover{background:rgba(136,204,255,0.20)}
        .article-detail .detail-tags .tag i{font-size:0.6rem;opacity:0.7}
        .article-detail .detail-divider{border:none;border-top:1px solid rgba(0,0,0,0.06);margin-bottom:1.5rem;transition:border-color 0.3s ease}

        .article-detail .detail-content{font-size:1rem;line-height:1.9;color:#2D2D4A;word-break:break-word;transition:color 0.3s ease}

        .article-detail .detail-content h1,.article-detail .detail-content h2,.article-detail .detail-content h3,.article-detail .detail-content h4,.article-detail .detail-content h5,.article-detail .detail-content h6{font-weight:700;margin:1.2rem 0 0.6rem 0;line-height:1.3;color:#1A1A2E;transition:color 0.3s ease}
        body.dark .article-detail .detail-content h1,body.dark .article-detail .detail-content h2,body.dark .article-detail .detail-content h3,body.dark .article-detail .detail-content h4,body.dark .article-detail .detail-content h5,body.dark .article-detail .detail-content h6{color:#E8E6F0}
        .article-detail .detail-content h1{font-size:1.8rem}
        .article-detail .detail-content h2{font-size:1.5rem}
        .article-detail .detail-content h3{font-size:1.25rem}
        .article-detail .detail-content h4{font-size:1.1rem}
        .article-detail .detail-content h5{font-size:1rem}
        .article-detail .detail-content h6{font-size:0.9rem;opacity:0.7}
        .article-detail .detail-content p{margin-bottom:0.8rem;transition:color 0.3s ease}
        .article-detail .detail-content p:last-child{margin-bottom:0}
        .article-detail .detail-content strong{color:#3D2D8A;font-weight:700;transition:color 0.3s ease}
        body.dark .article-detail .detail-content strong{color:#C8C0F0}
        .article-detail .detail-content em{font-style:italic;color:#6A6A92;transition:color 0.3s ease}
        body.dark .article-detail .detail-content em{color:#A8A4C8}

        body.dark .article-detail .detail-content a{color:#88ccff}
        .article-detail .detail-content del{color:#8A8AB5;text-decoration:line-through;transition:color 0.3s ease}
        body.dark .article-detail .detail-content del{color:#6A6A8A}
        .article-detail .detail-content u{text-decoration:underline;text-underline-offset:2px}
        .article-detail .detail-content kbd{display:inline-block;background:rgba(0,0,0,0.06);padding:0.1rem 0.5rem;border-radius:4px;font-family:'Inter',monospace;font-size:0.85em;border:1px solid rgba(0,0,0,0.08);box-shadow:0 1px 0 rgba(0,0,0,0.04);transition:background 0.3s ease,border-color 0.3s ease}
        body.dark .article-detail .detail-content kbd{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.08)}
        .article-detail .detail-content mark{background:rgba(255,215,0,0.3);padding:0 0.2rem;border-radius:2px;transition:background 0.3s ease}
        body.dark .article-detail .detail-content mark{background:rgba(255,215,0,0.2)}
        .article-detail .detail-content sup{font-size:0.7em;vertical-align:super}
        .article-detail .detail-content sub{font-size:0.7em;vertical-align:sub}
        .article-detail .detail-content table{width:100%;border-collapse:collapse;margin:1rem 0;font-size:0.9rem;transition:border-color 0.3s ease}
        .article-detail .detail-content th,.article-detail .detail-content td{border:1px solid rgba(0,0,0,0.08);padding:0.5rem 0.8rem;text-align:left;transition:border-color 0.3s ease,background 0.3s ease}
        body.dark .article-detail .detail-content th,body.dark .article-detail .detail-content td{border-color:rgba(255,255,255,0.06)}
        .article-detail .detail-content th{background:rgba(0,0,0,0.04);font-weight:600;transition:background 0.3s ease}
        body.dark .article-detail .detail-content th{background:rgba(255,255,255,0.04)}
        .article-detail .detail-content tr:nth-child(even) td{background:rgba(0,0,0,0.02)}
        body.dark .article-detail .detail-content tr:nth-child(even) td{background:rgba(255,255,255,0.02)}
        .article-detail .detail-content .footnote-ref{font-size:0.75em;vertical-align:super;text-decoration:none;color:#6B5ACF;margin-left:1px;transition:color 0.3s ease}
        body.dark .article-detail .detail-content .footnote-ref{color:#88ccff}
        .article-detail .detail-content .footnote-ref::before{content:'['}
        .article-detail .detail-content .footnote-ref::after{content:']'}
        .article-detail .detail-content .footnotes{margin-top:2rem;padding-top:1rem;border-top:1px solid rgba(0,0,0,0.06);font-size:0.85rem;color:#6A6A92;transition:border-color 0.3s ease,color 0.3s ease}
        body.dark .article-detail .detail-content .footnotes{border-top-color:rgba(255,255,255,0.06);color:#8A8AA8}
        .article-detail .detail-content .footnotes .footnote-def{margin-bottom:0.3rem;padding-left:1.8rem;position:relative}
        .article-detail .detail-content .footnotes .footnote-def .footnote-back{position:absolute;left:0;text-decoration:none;color:#6B5ACF;font-size:0.8rem}
        body.dark .article-detail .detail-content .footnotes .footnote-def .footnote-back{color:#88ccff}
        .article-detail .detail-content ul,.article-detail .detail-content ol{padding-left:1.8rem;margin:0.6rem 0;list-style-position:outside}
        .article-detail .detail-content li{display:list-item;word-break:break-word;white-space:normal;line-height:1.8;margin-bottom:0.2rem}
        .article-detail .detail-content li ul,.article-detail .detail-content li ol{margin:0.2rem 0}
        .article-detail .detail-content ul.task-list{list-style:none;padding-left:0.2rem;margin:0.6rem 0}
        .article-detail .detail-content ul.task-list li{display:flex;align-items:flex-start;gap:0;list-style:none;margin-bottom:0.2rem}
        .article-detail .detail-content ul.task-list li::before{content:'';display:inline-block;width:1rem;height:1rem;border:2px solid #6B5ACF;border-radius:3px;background:transparent;flex-shrink:0;margin-top:0.25rem;margin-right:0.4rem;box-sizing:border-box;font-size:0.7rem;line-height:1;text-align:center;color:#fff}
        body.dark .article-detail .detail-content ul.task-list li::before{border-color:#88ccff}
        .article-detail .detail-content ul.task-list li[data-checked="true"]::before{background:#6B5ACF;border-color:#6B5ACF;content:'✓'}
        body.dark .article-detail .detail-content ul.task-list li[data-checked="true"]::before{background:#88ccff;border-color:#88ccff;color:#1a1a2e}
        .article-detail .detail-content ul.task-list ul.task-list{padding-left:1.2rem}
        .img-placeholder{position:relative;border-radius:12px;overflow:hidden;margin:0.8rem 0;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:transparent}
        .img-placeholder .img-loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:2.4rem;color:rgba(100,90,160,0.35);z-index:2;animation:spin 1s linear infinite;pointer-events:none;transition:opacity 0.3s ease}
        body.dark .img-placeholder .img-loading{color:rgba(180,170,220,0.35)}
        .img-placeholder.loaded .img-loading{opacity:0;pointer-events:none}
        @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
        .img-placeholder img{width:100%;height:auto;display:block;opacity:0;transition:opacity 0.5s ease;border-radius:0;margin:0;box-shadow:none!important;min-height:300px;object-fit:contain}
        .img-placeholder img.loaded{opacity:1}
        .img-placeholder .img-alt-text{display:none;text-align:center;font-style:italic;font-size:0.85rem;color:#8A8AB5;padding:0.5rem 0.6rem 0.4rem 0.6rem;border-radius:0 0 12px 12px;background:rgba(255,255,255,0.3);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:color 0.3s ease,background 0.3s ease;width:100%;position:relative;z-index:3;box-sizing:border-box}
        body.dark .img-placeholder .img-alt-text{color:#8A8AB5;background:rgba(0,0,0,0.2)}
        .img-placeholder.loaded .img-alt-text{display:block}
        .video-placeholder{position:relative;border-radius:12px;overflow:hidden;margin:0.8rem 0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:transparent}
        .video-placeholder video,.video-placeholder iframe{width:100%;height:auto;display:block;border-radius:0;margin:0;box-shadow:none!important;min-height:200px;object-fit:contain}
        .video-placeholder .video-alt-text{text-align:center;font-style:italic;font-size:0.85rem;color:#8A8AB5;padding:0.5rem 0.6rem 0.4rem 0.6rem;border-radius:0 0 12px 12px;background:rgba(255,255,255,0.3);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:color 0.3s ease,background 0.3s ease;width:100%;position:relative;z-index:3;box-sizing:border-box}
        body.dark .video-placeholder .video-alt-text{color:#8A8AB5;background:rgba(0,0,0,0.2)}
        .article-detail .detail-content img{max-width:100%;height:auto;border-radius:12px;margin:0.8rem 0;display:block;box-shadow:0 4px 16px rgba(0,0,0,0.06);transition:box-shadow 0.3s ease;cursor:pointer}
        body.dark .article-detail .detail-content img{box-shadow:0 4px 16px rgba(0,0,0,0.2)}
        .article-detail .detail-content img:hover{box-shadow:0 8px 32px rgba(0,0,0,0.12)}
        body.dark .article-detail .detail-content img:hover{box-shadow:0 8px 32px rgba(0,0,0,0.3)}
        .article-detail .detail-content code{font-family:'JetBrains Mono','Courier New',monospace;font-size:0.9em;background:rgba(0,0,0,0.06);padding:0.1rem 0.4rem;border-radius:4px;color:#D14C4C;transition:background 0.3s ease,color 0.3s ease}
        body.dark .article-detail .detail-content code{background:rgba(255,255,255,0.06);color:#E8A87C}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>文章详情 · ks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://unpkg.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <!-- 新增：Luckiest Guy 字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/7.0.1/css/all.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <link rel="stylesheet" href="/assets/markdown/markdown.css">
    <link rel="stylesheet" href="/assets/waline-custom.css">
    <link rel="stylesheet" href="/assets/footer.css">
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" type="image/png" href="/favicon-192x192.png" sizes="192x192">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent
        }

        body {
            font-family: 'Inter', -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #FAFAFE;
            color: #1A1A2E;
            line-height: 1.8;
            min-height: 100vh;
            transition: background 0.4s ease, color 0.3s ease
        }

        body.dark {
            background: #14131F;
            color: #E8E6F0
        }

        .reading-progress {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(0, 0, 0, 0.08);
            z-index: 9999;
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.3s ease
        }

        body.dark .reading-progress {
            background: rgba(255, 255, 255, 0.1)
        }

        .reading-progress .progress-bar {
            height: 100%;
            width: 0%;
            background: #4A90D9;
            border-radius: 0 4px 4px 0;
            transition: width 0.05s linear
        }

        body.dark .reading-progress .progress-bar {
            background: #60A5FA
        }

        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(circle at 30% 30%, #F6F2FF, #FFFFFF);
            transition: background 0.5s ease
        }

        body.dark .bg-glow {
            background: radial-gradient(circle at 30% 30%, #28253D, #0E0D18)
        }

        .glow-soft {
            position: fixed;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(160, 130, 230, 0.15), rgba(210, 190, 255, 0) 70%);
            border-radius: 50%;
            top: -25vh;
            right: -20vw;
            z-index: -1;
            filter: blur(80px);
            animation: floatGlow 20s infinite alternate ease-in-out;
            transition: background 0.5s ease
        }

        body.dark .glow-soft {
            background: radial-gradient(circle, rgba(120, 100, 200, 0.20), rgba(60, 40, 120, 0) 70%)
        }

        .glow-soft-2 {
            position: fixed;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(200, 180, 255, 0.10), rgba(255, 240, 255, 0) 70%);
            border-radius: 50%;
            bottom: -15vh;
            left: -10vw;
            z-index: -1;
            filter: blur(70px);
            animation: floatGlow2 22s infinite alternate ease-in-out;
            transition: background 0.5s ease
        }

        body.dark .glow-soft-2 {
            background: radial-gradient(circle, rgba(90, 70, 160, 0.15), rgba(30, 20, 60, 0) 70%)
        }

        @keyframes floatGlow {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.3
            }

            100% {
                transform: translate(5%, 8%) scale(1.2);
                opacity: 0.7
            }
        }

        @keyframes floatGlow2 {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.2
            }

            100% {
                transform: translate(-6%, -5%) scale(1.3);
                opacity: 0.6
            }
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 2.8rem 1.8rem 2rem;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative
        }

        #appContent {
            width: 100%;
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 1rem;
            color: #8A8AB5;
            transition: color 0.3s ease;
            width: 100%;
            box-sizing: border-box;
        }

        .loading i {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        body.dark .loading {
            color: #8A8AB5
        }

        .top-buttons {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 50;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none
        }

        .top-buttons .left,
        .top-buttons .right {
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 0.5rem
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 60px;
            padding: 0.5rem 1.2rem 0.5rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: #4F4F78;
            text-decoration: none;
            transition: 0.25s ease;
            box-shadow: 0 6px 20px rgba(80, 60, 160, 0.10);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important
        }

        body.dark .back-btn {
            background: rgba(30, 28, 50, 0.7);
            border-color: rgba(255, 255, 255, 0.08);
            color: #D0CAF0;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3)
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.85);
            transform: translateY(-2px) scale(1.02)
        }

        body.dark .back-btn:hover {
            background: rgba(50, 45, 80, 0.8)
        }

        .back-btn i {
            font-size: 0.9rem
        }

        .share-btn {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 60px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #4F4F78;
            transition: 0.25s ease;
            box-shadow: 0 6px 20px rgba(80, 60, 160, 0.10);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important
        }

        body.dark .share-btn {
            background: rgba(30, 28, 50, 0.7);
            border-color: rgba(255, 255, 255, 0.08);
            color: #D0CAF0;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3)
        }

        .share-btn:hover {
            background: rgba(255, 255, 255, 0.85);
            transform: scale(1.05)
        }

        body.dark .share-btn:hover {
            background: rgba(50, 45, 80, 0.8)
        }

        .share-btn i {
            font-size: 1.2rem
        }

        .back-to-top-btn {
            position: fixed;
            top: 20px;
            right: 80px;
            z-index: 49;
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            color: #4F4F78;
            font-size: 1.2rem;
            cursor: pointer;
            transition: opacity 0.35s ease, transform 0.25s ease, background 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 6px 20px rgba(80, 60, 160, 0.10);
            opacity: 0;
            pointer-events: none;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important
        }

        .back-to-top-btn:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 10px 28px rgba(80, 60, 160, 0.18)
        }

        .back-to-top-btn.show {
            opacity: 1;
            pointer-events: auto
        }

        .back-to-top-btn:active {
            transform: scale(0.92)
        }

        .back-to-top-btn.disabled {
            opacity: 0.3 !important;
            pointer-events: none !important
        }

        body.dark .back-to-top-btn {
            background: rgba(30, 28, 50, 0.7);
            border-color: rgba(255, 255, 255, 0.08);
            color: #D0CAF0;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3)
        }

        body.dark .back-to-top-btn:hover {
            background: rgba(50, 45, 80, 0.8)
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 24px;
            z-index: 50;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 60px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: #4F4F78;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 6px 20px rgba(80, 60, 160, 0.10);
            user-select: none;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important
        }

        .theme-toggle:hover {
            transform: scale(1.05) rotate(8deg);
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 10px 28px rgba(80, 60, 160, 0.18)
        }

        body.dark .theme-toggle {
            background: rgba(30, 28, 50, 0.7);
            border-color: rgba(255, 255, 255, 0.08);
            color: #D0CAF0;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3)
        }

        body.dark .theme-toggle:hover {
            background: rgba(50, 45, 80, 0.8)
        }

        .theme-toggle:active {
            transform: scale(0.92)
        }

        @media (max-width:560px) {
            .back-to-top-btn {
                top: 14px;
                right: 66px;
                width: 42px;
                height: 42px;
                font-size: 1rem
            }

            .theme-toggle {
                top: 14px;
                right: 16px;
                width: 42px;
                height: 42px;
                font-size: 1.2rem
            }

            .share-btn {
                width: 42px;
                height: 42px;
                font-size: 1rem
            }

            .share-btn i {
                font-size: 1rem
            }

            .top-buttons {
                top: 14px;
                left: 14px;
                right: 14px
            }

            .back-btn {
                padding: 0.4rem 1rem 0.4rem 0.8rem;
                font-size: 0.75rem
            }

            .back-btn i {
                font-size: 0.8rem
            }

            .reading-progress {
                height: 2px
            }
        }

        .article-detail {
            max-width: 640px;
            margin: 0 auto;
            padding-top: 2rem;
            width: 100%
        }

        .article-detail .detail-title {
            font-size: 2rem;
            font-weight: 700;
            color: #1A1A2E;
            margin-bottom: 0.3rem;
            line-height: 1.3;
            transition: color 0.3s ease
        }

        body.dark .article-detail .detail-title {
            color: #E8E6F0
        }

        .article-detail .detail-date {
            font-size: 0.85rem;
            color: #8A8AB5;
            margin-bottom: 0.6rem;
            display: block;
            transition: color 0.3s ease
        }

        body.dark .article-detail .detail-date {
            color: #7A7AA0
        }

        .article-detail .detail-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem 0.6rem;
            margin-bottom: 1rem
        }

        .article-detail .detail-tags .tag {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.75rem;
            font-weight: 500;
            color: #6B5ACF;
            background: rgba(107, 90, 207, 0.10);
            padding: 0.1rem 0.7rem 0.1rem 0.5rem;
            border-radius: 40px;
            transition: 0.2s ease;
            cursor: pointer;
            user-select: none;
            text-decoration: none
        }

        body.dark .article-detail .detail-tags .tag {
            color: #88ccff;
            background: rgba(136, 204, 255, 0.10)
        }

        .article-detail .detail-tags .tag:hover {
            background: rgba(107, 90, 207, 0.20);
            transform: scale(1.04)
        }

        body.dark .article-detail .detail-tags .tag:hover {
            background: rgba(136, 204, 255, 0.20)
        }

        .article-detail .detail-tags .tag i {
            font-size: 0.6rem;
            opacity: 0.7
        }

        .article-detail .detail-divider {
            border: none;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            margin-bottom: 1.5rem;
            transition: border-color 0.3s ease
        }

        body.dark .article-detail .detail-divider {
            border-top-color: rgba(255, 255, 255, 0.06)
        }

        .not-found {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 1rem;
            color: #8A8AB5;
            transition: color 0.3s ease
        }

        body.dark .not-found {
            color: #8A8AB5
        }

        .not-found i {
            font-size: 3rem;
            display: block;
            margin-bottom: 1rem;
            opacity: 0.5
        }

        .share-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0);
            backdrop-filter: blur(0px);
            -webkit-backdrop-filter: blur(0px);
            z-index: 999;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, background 0.3s ease, backdrop-filter 0.3s ease, visibility 0.3s ease
        }

        .share-modal-overlay.active {
            display: flex;
            opacity: 1;
            visibility: visible;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px)
        }

        .share-modal-overlay .share-modal-box {
            max-width: 480px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 2rem;
            padding: 2rem 1.8rem 1.8rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.15);
            text-align: center;
            animation: modalFadeIn 0.3s ease;
            transition: background 0.4s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            max-height: 90vh;
            overflow-y: auto
        }

        body.dark .share-modal-overlay .share-modal-box {
            background: rgba(30, 28, 50, 0.92);
            border-color: rgba(255, 255, 255, 0.08);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5)
        }

        @keyframes modalFadeIn {
            0% {
                opacity: 0;
                transform: scale(0.92) translateY(20px)
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0)
            }
        }

        .share-modal-overlay .share-modal-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 0.8rem;
            letter-spacing: 0.3px;
            transition: color 0.3s ease;
            text-align: center
        }

        body.dark .share-modal-overlay .share-modal-title {
            color: #fff
        }

        .share-modal-overlay .share-modal-title i {
            margin-right: 0.5rem;
            color: #624ed0
        }

        body.dark .share-modal-overlay .share-modal-title i {
            color: #88ccff
        }

        #sharePreviewWrap {
            border-radius: 0.8rem;
            overflow: hidden;
            background: #fff;
            border: 1px solid rgba(0, 0, 0, 0.06);
            margin-bottom: 0.8rem
        }

        #sharePreviewWrap img {
            width: 100%;
            display: block
        }

        .share-modal-actions {
            display: flex;
            gap: 0.6rem
        }

        .share-modal-actions button {
            flex: 1;
            padding: 0.7rem 1.2rem;
            border-radius: 60px;
            border: none;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem
        }

        .share-modal-actions .btn-text {
            background: rgba(0, 0, 0, 0.06);
            color: #6a6a92;
            border: 1px solid rgba(0, 0, 0, 0.06);
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease
        }

        .share-modal-actions .btn-text:hover {
            background: rgba(0, 0, 0, 0.1)
        }

        body.dark .share-modal-actions .btn-text {
            background: rgba(255, 255, 255, 0.08);
            color: #9a96b8;
            border-color: rgba(255, 255, 255, 0.06)
        }

        body.dark .share-modal-actions .btn-text:hover {
            background: rgba(255, 255, 255, 0.15)
        }

        .share-modal-actions .btn-image {
            background: linear-gradient(145deg, #7A6BCF, #624ED0);
            color: #fff;
            box-shadow: 0 8px 24px rgba(90, 70, 170, 0.2)
        }

        .share-modal-actions .btn-image:hover {
            transform: scale(1.02);
            box-shadow: 0 12px 32px rgba(90, 70, 170, 0.3)
        }

        body.dark .share-modal-actions .btn-image {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3)
        }

        body.dark .share-modal-actions .btn-image:hover {
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4)
        }

        .share-modal-actions .btn-image i {
            font-size: 0.9rem
        }

        .share-close-btn {
            margin-top: 0.6rem;
            padding: 0.5rem;
            background: none;
            border: none;
            color: #8a8ab5;
            font-size: 0.85rem;
            cursor: pointer;
            width: 100%;
            font-family: 'Inter', sans-serif;
            transition: 0.2s ease
        }

        .share-close-btn:hover {
            color: #4a4a6e
        }

        body.dark .share-close-btn:hover {
            color: #d0caf0
        }

        @media (max-width:480px) {
            .share-modal-overlay .share-modal-box {
                padding: 1.6rem 1.4rem 1.4rem
            }

            .share-modal-actions button {
                font-size: 0.8rem;
                padding: 0.6rem 1rem
            }
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(28, 26, 44, 0.92);
            backdrop-filter: blur(16px);
            padding: 0.8rem 2.5rem;
            border-radius: 60px;
            color: #EFEAFF;
            font-size: 0.9rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 1000;
            pointer-events: none;
            white-space: nowrap;
            min-width: 240px;
            text-align: center
        }

        body.dark .toast {
            background: rgba(20, 18, 30, 0.95);
            border-color: rgba(255, 255, 255, 0.05)
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0)
        }

        .toast i {
            margin-right: 0.5rem;
            font-size: 1rem
        }

        .toast .fa-check-circle {
            color: #4ade80
        }

        .toast .fa-info-circle {
            color: #60a5fa
        }

        .toast .fa-exclamation-circle {
            color: #fbbf24
        }

        @media (max-width:480px) {
            .toast {
                font-size: 0.8rem;
                padding: 0.6rem 1.5rem;
                min-width: 180px;
                white-space: normal
            }
        }

        #qrTemp {
            display: none
        }

        #waline-comments {
            max-width: 640px;
            margin: 3rem auto 0;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(0, 0, 0, 0.06)
        }

        body.dark #waline-comments {
            border-top-color: rgba(255, 255, 255, 0.06)
        }

        #waline-comments * {
            font-family: 'Inter', -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif !important
        }

        #waline-comments .wl-content a {
            word-break: break-all;
            overflow-wrap: break-word;
            max-width: 100%
        }

        /* ========== 新增：上下文导航栏样式 ========== */
        .article-nav {
            display: flex;
            gap: 1rem;
            align-items: stretch;
            margin: 2rem 0 1rem;
        }

        .nav-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            padding: 1.2rem 1.4rem;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 1.2rem;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            cursor: pointer;
            font-family: inherit;
            text-align: left;
            color: #1A1A2E;
            box-shadow: 0 4px 16px rgba(80, 60, 160, 0.06);
            outline: none !important;
            -webkit-tap-highlight-color: transparent !important;
            text-decoration: none;
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1),

    <script src="/assets/markdown/markdown.js"></script>
    <script>
        function getParam(name) {
            const url = new URL(window.location.href);
            return url.searchParams.get(name);
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function compressImage(file, maxSize, quality) {
            return new Promise(function(resolve, reject) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    var img = new Image();
                    img.onload = function() {
                        var canvas = document.createElement('canvas');
                        var w = img.width,
                            h = img.height;
                        if (w > h) {
                            if (w > maxSize) { h = h * maxSize / w;
                                w = maxSize; }
                        } else {
                            if (h > maxSize) { w = w * maxSize / h;
                                h = maxSize; }
                        }
                        canvas.width = w;
                        canvas.height = h;
                        var ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        canvas.toBlob(function(blob) {
                            resolve(new File([blob], file.name, { type: 'image/jpeg' }));
                        }, 'image/jpeg', quality);
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function showToast(message, icon) {
            icon = icon || 'fa-info-circle';
            const toast = document.getElementById('toast');
            toast.innerHTML = '<i class="fas ' + icon + '"></i> ' + message;
            toast.classList.add('show');
            clearTimeout(toast._hideTimer);
            toast._hideTimer = setTimeout(function() {
                toast.classList.remove('show');
            }, 2000);
        }

        const progressWrap = document.getElementById('readingProgress');
        const progressBar = document.getElementById('progressBar');
        let lastProgress = 0;
        let hideTimer = null;
        let isProgressLocked = false;

        function updateReadingProgress() {
            if (isProgressLocked) return;
            const articleDetail = document.querySelector('.article-detail');
            if (!articleDetail) {
                progressBar.style.width = '0%';
                return;
            }
            const rect = articleDetail.getBoundingClientRect();
            const articleHeight = rect.height;
            const articleTop = rect.top + window.scrollY;
            const windowHeight = window.innerHeight;
            const maxScroll = articleHeight - windowHeight;
            let progress = 0;
            if (maxScroll <= 0) {
                progress = 100;
            } else {
                const currentScroll = window.scrollY - articleTop;
                progress = Math.min(Math.max((currentScroll / maxScroll) * 100, 0), 100);
            }
            progressBar.style.width = progress + '%';
            if (progress >= 100 && lastProgress < 100) {
                if (hideTimer) {
                    clearTimeout(hideTimer);
                    hideTimer = null;
                }
                hideTimer = setTimeout(() => {
                    progressWrap.style.transition = 'opacity 0.8s ease';
                    progressWrap.style.opacity = '0';
                    setTimeout(() => {
                        progressWrap.style.display = 'none';
                    }, 800);
                }, 600);
            }
            if (progress < 100) {
                if (hideTimer) {
                    clearTimeout(hideTimer);
                    hideTimer = null;
                }
                progressWrap.style.display = 'block';
                progressWrap.style.opacity = '1';
                progressWrap.style.transition = 'opacity 0.3s ease';
            }
            lastProgress = progress;
        }
        window.addEventListener('scroll', updateReadingProgress);
        window.addEventListener('resize', updateReadingProgress);
        window.addEventListener('load', updateReadingProgress);

        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        let currentTheme = localStorage.getItem('ks-theme') || (prefersDark ? 'dark' : 'light');

        function setTheme(theme) {
            document.body.classList.toggle('dark', theme === 'dark');
            themeIcon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
            localStorage.setItem('ks-theme', theme);
            currentTheme = theme;
        }
        setTheme(currentTheme);
        themeToggle.addEventListener('click', function() {
            setTheme(currentTheme === 'dark' ? 'light' : 'dark');
        });

        const backToTopBtn = document.getElementById('backToTopBtn');
        let isScrollingToTop = false;
        window.addEventListener('scroll', function() {
            const scrollY = window.scrollY || window.pageYOffset;
            if (scrollY > 300 && !isScrollingToTop) {
                backToTopBtn.classList.add('show');
            } else if (!isScrollingToTop) {
                backToTopBtn.classList.remove('show');
            }
        });

        function fastScrollToTop() {
            const startY = window.scrollY || window.pageYOffset;
            if (startY === 0) return;
            const duration = 300;
            const startTime = performance.now();

            function step(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const ease = 1 - Math.pow(1 - progress, 3);
                const nextY = startY * (1 - ease);
                window.scrollTo(0, nextY);
                if (progress < 1) {
                    requestAnimationFrame(step);
                } else {
                    window.scrollTo(0, 0);
                    isScrollingToTop = false;
                    backToTopBtn.classList.remove('disabled');
                    backToTopBtn.classList.remove('show');
                }
            }
            requestAnimationFrame(step);
        }
        backToTopBtn.addEventListener('click', function() {
            if (isScrollingToTop) return;
            const scrollY = window.scrollY || window.pageYOffset;
            if (scrollY === 0) return;
            isScrollingToTop = true;
            backToTopBtn.classList.add('disabled');
            fastScrollToTop();
        });

        const backBtn = document.getElementById('backButton');
        const from = getParam('from');
        const page = getParam('page');
        const folder = getParam('folder');
        let returnUrl = 'index.html?return=articles';
        if (page) returnUrl += '&page=' + page;
        if (from === 'archive' && folder === 'articles') {
            returnUrl = 'index.html?return=archive&folder=articles';
        } else if (from === 'archive') {
            returnUrl = 'index.html?return=archive';
        }
        backBtn.href = returnUrl;

        const appContent = document.getElementById('appContent');
        let currentArticle = null;
        let currentShareText = '';
        let walineInitialized = false;

        function countWords(markdown) {
            if (!markdown) return 0;
            let text = markdown
                .replace(/```[\s\S]*?```/g, '')
                .replace(/`[^`]+`/g, '')
                .replace(/!video\[[^\]]*\]\([^)]*\)/g, '')
                .replace(/!\[[^\]]*\]\([^)]*\)/g, '')
                .replace(/\*\*(.*?)\*\*/g, '$1')
                .replace(/\*([^*]+)\*/g, '$1')
                .replace(/~~(.*?)~~/g, '$1')
                .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
                .replace(/!\[([^\]]*)\]\([^)]*\)/g, '')
                .replace(/^#{1,6}\s+/gm, '')
                .replace(/^-\s+/gm, '')
                .replace(/^\d+\.\s+/gm, '')
                .replace(/^>\s+/gm, '')
                .replace(/^---$/gm, '')
                .replace(/^\s*[-*+]\s+\[[ x]\]\s+/gm, '')
                .replace(/\s+/g, ' ')
                .trim();
            return text.length;
        }

        function calculateReadTime(wordCount) {
            if (wordCount === 0) return 114514;
            const minutes = Math.ceil(wordCount / 300);
            return minutes < 1 ? 1 : minutes;
        }

        function formatReadTime(minutes) {
            if (minutes === 114514) return '114514 分钟';
            return '大约 ' + minutes + ' 分钟';
        }

        function formatWordCount(count) {
            if (count === 0) return '没有字哦';
            return count + ' 字';
        }

        function markdownToPlainText(md) {
            if (!md) return '';
            let text = md;
            text = text.replace(/```[\s\S]*?```/g, '');
            text = text.replace(/`([^`]+)`/g, '$1');
            text = text.replace(/!video\[[^\]]*\]\([^)]*\)/g, '');
            text = text.replace(/!\[[^\]]*\]\([^)]*\)/g, '');
            text = text.replace(/\*\*(.*?)\*\*/g, '$1');
            text = text.replace(/\*([^*]+)\*/g, '$1');
            text = text.replace(/~~(.*?)~~/g, '$1');
            text = text.replace(/\[([^\]]*)\]\([^)]*\)/g, '$1');
            text = text.replace(/^#{1,6}\s+/gm, '');
            text = text.replace(/^-\s+/gm, '');
            text = text.replace(/^\d+\.\s+/gm, '');
            text = text.replace(/^>\s+/gm, '');
            text = text.replace(/^---$/gm, '');
            text = text.replace(/\n/g, ' ');
            text = text.replace(/\s{2,}/g, ' ');
            return text.trim();
        }

        function getPlainPreview(content, maxLength) {
            maxLength = maxLength || 80;
            const plain = markdownToPlainText(content);
            const wordCount = countWords(content);
            if (wordCount === 0) return '[没有字捏 是什么自己打开看]';
            const chars = [...plain];
            if (chars.length <= maxLength) return plain;
            return chars.slice(0, maxLength).join('') + '…';
        }

        function generateQRCanvas(text, size) {
            return new Promise(function(resolve, reject) {
                var img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = function() {
                    var canvas = document.createElement('canvas');
                    canvas.width = size;
                    canvas.height = size;
                    var ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, size, size);
                    resolve(canvas);
                };
                img.onerror = function() {
                    reject(new Error('二维码图片加载失败'));
                };
                img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=' + size + 'x' + size + '&data=' +
                    encodeURIComponent(text);
            });
        }

        function wrapText(ctx, text, maxWidth) {
            var chars = Array.from(text);
            var lines = [];
            var current = '';
            for (var i = 0; i < chars.length; i++) {
                var ch = chars[i];
                if (ctx.measureText(current + ch).width > maxWidth) {
                    lines.push(current);
                    current = ch;
                } else {
                    current += ch;
                }
            }
            if (current) lines.push(current);
            return lines;
        }

        function truncateLines(lines, maxLines) {
            if (lines.length <= maxLines) return lines;
            var result = lines.slice(0, maxLines);
            var last = result[result.length - 1];
            result[result.length - 1] = last.slice(0, -1) + '…';
            return result;
        }

        function initWaline(articleId) {
            if (walineInitialized) return;
            var commentEl = document.getElementById('waline-comments');
            if (!commentEl) return;
            walineInitialized = true;
            import('/assets/waline.js')
                .then(function(module) {
                    var init = module.init;
                    init({
                        el: '#waline-comments',
                        serverURL: 'https://comment.cuizi.top',
                        lang: 'zh-CN',
                        path: '/article/' + articleId,
                        dark: 'body.dark',
                        imageUploader: function(file) {
                            return new Promise(function(resolve, reject) {
                                var uploadFile = file;
                                var shouldCompress = !['image/gif', 'image/svg+xml'].includes(file
                                    .type);
                                if (shouldCompress) {
                                    compressImage(file, 720, 0.8).then(function(compressed) {
                                        uploadFile = compressed;
                                        var reader = new FileReader();
                                        reader.onload = function() {
                                            var base64 = reader.result.split(',')[1];
                                            fetch(
                                                    'https://comment.cuizi.top/api/upload', {
                                                        method: 'POST',
                                                        headers: { 'Content-Type': 'application/json' },
                                                        body: JSON.stringify({ image: base64,
                                                            filename: file.name })
                                                    }).then(function(resp) { return resp
                                                .json(); }).then(function(data) {
                                                resolve(data.url);
                                            }).catch(reject);
                                        };
                                        reader.readAsDataURL(uploadFile);
                                    }).catch(reject);
                                } else {
                                    var reader = new FileReader();
                                    reader.onload = function() {
                                        var base64 = reader.result.split(',')[1];
                                        fetch('https://comment.cuizi.top/api/upload', {
                                            method: 'POST',
                                            headers: { 'Content-Type': 'application/json' },
                                            body: JSON.stringify({ image: base64,
                                                filename: file.name })
                                        }).then(function(resp) { return resp.json(); }).then(
                                            function(data) {
                                                resolve(data.url);
                                            }).catch(reject);
                                    };
                                    reader.readAsDataURL(uploadFile);
                                }
                            });
                        },
                        emoji: ['https://unpkg.com/@waline/emojis@1.4.0/alus',
                            'https://unpkg.com/@waline/emojis@1.4.0/bilibili',
                            'https://unpkg.com/@waline/emojis@1.4.0/bmoji',
                            'https://unpkg.com/@waline/emojis@1.4.0/qq',
                            'https://unpkg.com/@waline/emojis@1.4.0/tieba'
                        ],
                        requiredMeta: ['nick', 'mail'],
                        locale: {
                            placeholder: '邮箱用于接收邮件回复，不会展示给其他人。欢迎评论捏',
                            sofa: '还没有人评论哦！来抢个沙发吧~',
                            submit: '发射!',
                            nick: '昵称*',
                            mail: '邮箱*',
                            link: '网站'
                        }
                    });
                })
                .catch(function(err) {
                    console.error('Waline 加载失败:', err);
                    walineInitialized = false;
                });
        }

        // ========== 新增：导航相关全局变量 ==========
        let archiveList = [];
        let archiveLoaded = false;

        function loadArchive() {
            return fetch('articles/archive.json', { cache: 'no-cache' })
                .then(resp => {
                    if (!resp.ok) throw new Error('archive.json 加载失败');
                    return resp.json();
                })
                .then(data => {
                    archiveList = data.list || [];
                    archiveLoaded = true;
                })
                .catch(err => {
                    console.warn('加载 archive.json 失败:', err);
                    archiveList = [];
                    archiveLoaded = true;
                });
        }

        function renderNav() {
            const navEl = document.getElementById('articleNav');
            if (!navEl) return;
            const currentId = getParam('id');
            if (!currentId || archiveList.length === 0) {
                navEl.style.display = 'none';
                return;
            }
            const index = archiveList.findIndex(a => String(a.id) === String(currentId));
            if (index === -1) {
                navEl.style.display = 'none';
                return;
            }
            const prevMeta = index > 0 ? archiveList[index - 1] : null;
            const nextMeta = index < archiveList.length - 1 ? archiveList[index + 1] : null;

            // 并行获取相邻文章全文以计算字数
            const fetchPromises = [];
            if (prevMeta) {
                fetchPromises.push(
                    fetch(`articles/article-${prevMeta.id}.json`, { cache: 'no-cache' })
                        .then(r => r.json())
                        .then(article => ({ ...prevMeta, content: article.content }))
                        .catch(() => null) // 如果加载失败，忽略该篇文章
                );
            }
            if (nextMeta) {
                fetchPromises.push(
                    fetch(`articles/article-${nextMeta.id}.json`, { cache: 'no-cache' })
                        .then(r => r.json())
                        .then(article => ({ ...nextMeta, content: article.content }))
                        .catch(() => null)
                );
            }

            Promise.all(fetchPromises).then(results => {
                const prevArticle = prevMeta ? results.find(a => a && String(a.id) === String(prevMeta.id)) : null;
                const nextArticle = nextMeta ? results.find(a => a && String(a.id) === String(nextMeta.id)) : null;

                function buildButton(article, type) {
                    if (!article) {
                        const label = type === 'prev' ? '上一篇' : '下一篇';
                        const icon = type === 'prev' ? '<i class="fas fa-arrow-left"></i>' : '<i class="fas fa-arrow-right"></i>';
                        return `<a class="nav-btn ${type}-btn disabled" href="javascript:void(0)"><div class="nav-content"><span class="nav-label">${icon} ${label}</span><div class="nav-title">没有${label}了</div></div></a>`;
                    }
                    const icon = type === 'prev' ? '<i class="fas fa-arrow-left"></i>' : '<i class="fas fa-arrow-right"></i>';
                    const label = type === 'prev' ? '上一篇' : '下一篇';
                    const bgText = type === 'prev' ? 'Last one' : 'Next one';
                    const wordCount = countWords(article.content || '');
                    const readMinutes = calculateReadTime(wordCount);
                    const displayWord = formatWordCount(wordCount);
                    const displayTime = formatReadTime(readMinutes);
                    const maxTags = 5;
                    const tags = article.tags || [];
                    let tagsHtml = '';
                    if (tags.length > 0) {
                        const visibleTags = tags.slice(0, maxTags);
                        tagsHtml = visibleTags.map(tag => `<span class="nav-tag"><i class="fas fa-tag"></i> ${tag}</span>`).join('');
                        if (tags.length > maxTags) {
                            tagsHtml += `<span class="nav-tag"><i class="fas fa-tag"></i> …</span>`;
                        }
                    }
                    const metaHtml = `
                        <span><i class="far fa-calendar-alt"></i> ${article.date}</span>
                        <span><i class="far fa-clock"></i> ${displayTime}</span>
                        <span><i class="far fa-file-alt"></i> ${displayWord}</span>
                    `;
                    return `
                        <a class="nav-btn ${type}-btn" href="article.html?id=${article.id}">
                            <span class="nav-bg-text">${bgText}</span>
                            <div class="nav-content">
                                <span class="nav-label">${icon} ${label}</span>
                                <div class="nav-title">${escapeHtml(article.title)}</div>
                                <div class="nav-meta">${metaHtml}</div>
                                <div class="nav-tags">${tagsHtml}</div>
                            </div>
                        </a>
                    `;
                }

                navEl.innerHTML = `
                    ${buildButton(prevArticle, 'prev')}
                    <div class="nav-divider"></div>
                    ${buildButton(nextArticle, 'next')}
                `;
                navEl.style.display = 'flex';
            }).catch(err => {
                console.error('加载相邻文章失败:', err);
                navEl.style.display = 'none';
            });
        }
        // ========== 导航逻辑结束 ==========

        function renderArticle() {
            var id = getParam('id');
            if (id === null || id === '') {
                appContent.innerHTML = `
                    <div class="not-found">
                        <i class="far fa-frown"></i>
                        <p>缺少文章 ID</p>
                        <p style="font-size:0.85rem; margin-top:0.5rem;">请从文章列表点击进入</p>
                    </div>
                `;
                return;
            }
            // 直接从独立的 JSON 文件加载文章数据
            fetch('articles/article-' + id + '.json', { cache: 'no-cache' })
                .then(function(response) {
                    if (!response.ok) {
                        throw new Error('文章不存在或已被删除');
                    }
                    return response.json();
                })
                .then(function(article) {
                    if (article.delete === true) {
                        appContent.innerHTML = `
                            <div class="not-found">
                                <i class="far fa-frown"></i>
                                <p>文章不存在</p>
                                <p style="font-size:0.85rem; margin-top:0.5rem;">可能已被删除</p>
                            </div>
                        `;
                        return;
                    }
                    currentArticle = article;
                    document.title = (currentArticle.title || '文章详情') + ' · ks';
                    var title = currentArticle.title || '无标题';
                    var date = currentArticle.date || '';
                    var content = currentArticle.content || '（暂无内容）';
                    var tags = currentArticle.tags || [];

                    var wordCount = countWords(content);
                    var readTime = calculateReadTime(wordCount);
                    var displayWord = formatWordCount(wordCount);
                    var displayTime = formatReadTime(readTime);
                    var preview = getPlainPreview(content, 80);
                    var articleUrl = window.location.origin + window.location.pathname + '?id=' + id;
                    currentShareText = title + '：' + preview + '\n查看完整内容？请访问：' + articleUrl;

                    var tagsHtml = '';
                    if (tags.length > 0) {
                        tagsHtml = '<div class="detail-tags">';
                        tags.forEach(function(tag) {
                            var tagName = escapeHtml(tag);
                            tagsHtml += '<span class="tag" data-tag="' + tagName +
                                '"><i class="fas fa-tag"></i> ' + tagName + '</span>';
                        });
                        tagsHtml += '</div>';
                    }

                    appContent.innerHTML = `
                        <div class="article-detail">
                            <h1 class="detail-title">${escapeHtml(title)}</h1>
                            <span class="detail-date">${date ? escapeHtml(date) + '  ·  ' : ''}${displayTime} · ${displayWord}</span>
                            ${tagsHtml}
                            <hr class="detail-divider">
                            <div class="detail-content" id="detailContent"></div>
                            <div class="article-nav" id="articleNav"></div>
                        </div>
                    `;

                    var detailContentEl = document.getElementById('detailContent');
                    if (detailContentEl && window.KSMarkdown && window.KSMarkdown.mountMarkdown) {
                        window.KSMarkdown.mountMarkdown(detailContentEl, content);
                    } else {
                        detailContentEl.textContent = content;
                    }

                    setTimeout(updateReadingProgress, 100);
                    generateShareImage();
                    initWaline(id);

                    // 加载 archive.json 并渲染导航
                    loadArchive().then(function() {
                        renderNav();
                    });
                })
                .catch(function() {
                    appContent.innerHTML = `
                        <div class="not-found">
                            <i class="far fa-frown"></i>
                            <p>加载文章失败</p>
                            <p style="font-size:0.85rem; margin-top:0.5rem;">文章不存在或已被删除，也可能是网络问题。</p>
                        </div>
                    `;
                });
        }

        var currentShareImageDataUrl = '';

        function generateShareImage() {
            if (!currentArticle) return;
            var title = currentArticle.title || '无标题';
            var date = currentArticle.date || '';
            var desc = getPlainPreview(currentArticle.content || '', 80);
            var url = window.location.origin + window.location.pathname + '?id=' + getParam('id');
            var canvas = document.createElement('canvas');
            var ctx = canvas.getContext('2d');
            var W = 900,
                H = 540;
            canvas.width = W;
            canvas.height = H;
            var grad = ctx.createLinearGradient(0, 0, W, H);
            grad.addColorStop(0, '#f8f5ff');
            grad.addColorStop(1, '#e8e0ff');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);
            ctx.globalAlpha = 0.05;
            for (var i = 0; i < 6; i++) {
                ctx.beginPath();
                ctx.arc(60 + i * 160, 40 + (i % 3) * 30, 80, 0, Math.PI * 2);
                ctx.fillStyle = '#7a6bcf';
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.textAlign = 'right';
            ctx.textBaseline = 'top';
            ctx.font = '400 14px "Inter", sans-serif';
            ctx.fillStyle = '#8a8ab5';
            ctx.fillText(date || '', W - 40, 28);
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.font = '700 52px "Inter", "PingFang SC", sans-serif';
            ctx.fillStyle = '#1a1a2e';
            var titleLines = wrapText(ctx, title || '无标题', W - 260);
            var titleDisplay = truncateLines(titleLines, 2);
            titleDisplay.forEach(function(line, i) {
                ctx.fillText(line, 40, 70 + i * 60);
            });
            var subY = 70 + Math.min(titleDisplay.length, 2) * 60 + 20;
            ctx.font = '400 22px "Inter", "PingFang SC", sans-serif';
            ctx.fillStyle = '#4a4a6e';
            var descLines = wrapText(ctx, desc || ' ', W - 260);
            var descDisplay = truncateLines(descLines, 4);
            descDisplay.forEach(function(line, i) {
                ctx.fillText(line, 40, subY + 10 + i * 34);
            });
            var bottomY = H - 44;
            ctx.font = '500 16px "Inter", "PingFang SC", sans-serif';
            ctx.fillStyle = '#6a6a92';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'bottom';
            ctx.fillText('ks', 40, bottomY);
            var qrSize = 180;
            var qrX = W - qrSize - 40;
            var qrY = H - qrSize - 40;
            generateQRCanvas(url, qrSize).then(function(qrCanvas) {
                ctx.shadowColor = 'rgba(0,0,0,0.06)';
                ctx.shadowBlur = 16;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 4;
                ctx.drawImage(qrCanvas, qrX, qrY, qrSize, qrSize);
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.font = '400 13px "Inter", sans-serif';
                ctx.fillStyle = '#aaaacc';
                ctx.fillText('扫码观看全文', qrX + qrSize / 2, qrY + qrSize + 10);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'bottom';
                ctx.font = '400 13px "Inter", sans-serif';
                ctx.fillStyle = '#c8c8e0';
                ctx.fillText('cuizi.top', W - 40, 18);
                currentShareImageDataUrl = canvas.toDataURL('image/png');
                document.getElementById('sharePreviewImg').src = currentShareImageDataUrl;
            }).catch(function() {
                ctx.fillStyle = '#f0edff';
                ctx.fillRect(qrX, qrY, qrSize, qrSize);
                ctx.fillStyle = '#aaa';
                ctx.font = '16px "Inter", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('二维码失败', qrX + qrSize / 2, qrY + qrSize / 2);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.font = '400 13px "Inter", sans-serif';
                ctx.fillStyle = '#aaaacc';
                ctx.fillText('扫码观看全文', qrX + qrSize / 2, qrY + qrSize + 10);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'bottom';
                ctx.font = '400 13px "Inter", sans-serif';
                ctx.fillStyle = '#c8c8e0';
                ctx.fillText('cuizi.top', W - 40, 18);
                currentShareImageDataUrl = canvas.toDataURL('image/png');
                document.getElementById('sharePreviewImg').src = currentShareImageDataUrl;
            });
        }

        var shareModal = document.getElementById('shareModal');
        var sharePreviewImg = document.getElementById('sharePreviewImg');
        document.getElementById('shareButton').addEventListener('click', function() {
            if (!currentArticle) {
                showToast('文章未加载', 'fa-exclamation-circle');
                return;
            }
            shareModal.classList.add('active');
            document.body.style.overflow = 'hidden';
        });
        document.getElementById('shareCloseBtn').addEventListener('click', function() {
            shareModal.classList.remove('active');
            document.body.style.overflow = '';
        });
        shareModal.addEventListener('click', function(e) {
            if (e.target === this) {
                shareModal.classList.remove('active');
                document.body.style.overflow = '';
            }
        });

        var shareTextDisplay = document.getElementById('shareTextDisplay');
        var textModal = document.getElementById('textModal');
        document.getElementById('shareCopyBtn').addEventListener('click', function() {
            shareTextDisplay.textContent = currentShareText || '暂无内容';
            textModal.classList.add('active');
        });
        document.getElementById('textModalCancel').addEventListener('click', function() {
            textModal.classList.remove('active');
        });
        textModal.addEventListener('click', function(e) {
            if (e.target === this) {
                textModal.classList.remove('active');
            }
        });
        document.getElementById('textModalCopy').addEventListener('click', function() {
            var text = shareTextDisplay.textContent;
            navigator.clipboard.writeText(text).then(function() {
                showToast('已复制', 'fa-check-circle');
                textModal.classList.remove('active');
                shareModal.classList.remove('active');
                document.body.style.overflow = '';
            }).catch(function() {
                var ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast('已复制', 'fa-check-circle');
                textModal.classList.remove('active');
                shareModal.classList.remove('active');
                document.body.style.overflow = '';
            });
        });
        document.getElementById('shareSaveBtn').addEventListener('click', function() {
            if (!currentShareImageDataUrl) {
                showToast('图片未生成', 'fa-exclamation-circle');
                return;
            }
            var a = document.createElement('a');
            a.href = currentShareImageDataUrl;
            var now = new Date();
            var ts = now.getFullYear().toString().slice(2) +
                String(now.getMonth() + 1).padStart(2, '0') +
                String(now.getDate()).padStart(2, '0') +
                String(now.getHours()).padStart(2, '0') +
                String(now.getMinutes()).padStart(2, '0');
            a.download = '分享图_' + ts + '.png';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast('已保存', 'fa-check-circle');
        });

        renderArticle();
    </script>
    <script>
        fetch('/assets/footer.html')
            .then(function(res) {
                if (!res.ok) throw new Error('加载失败');
                return res.text();
            })
            .then(function(html) {
                document.getElementById('footer-root').innerHTML = html;
            })
            .catch(function() {});
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ks · 个人博客</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #FAFAFE;
            color: #1A1A2E;
            line-height: 1.5;
            min-height: 100vh;
            transition: background 0.4s ease, color 0.3s ease;
        }

        body.dark {
            background: #14131F;
            color: #E8E6F0;
        }

        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(circle at 30% 30%, #F6F2FF, #FFFFFF);
            transition: background 0.5s ease;
        }
        body.dark .bg-glow {
            background: radial-gradient(circle at 30% 30%, #28253D, #0E0D18);
        }

        .glow-soft {
            position: fixed;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(160, 130, 230, 0.15), rgba(210, 190, 255, 0) 70%);
            border-radius: 50%;
            top: -25vh;
            right: -20vw;
            z-index: -1;
            filter: blur(80px);
            animation: floatGlow 20s infinite alternate ease-in-out;
            transition: background 0.5s ease;
        }
        body.dark .glow-soft {
            background: radial-gradient(circle, rgba(120, 100, 200, 0.20), rgba(60, 40, 120, 0) 70%);
        }

        .glow-soft-2 {
            position: fixed;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(200, 180, 255, 0.10), rgba(255, 240, 255, 0) 70%);
            border-radius: 50%;
            bottom: -15vh;
            left: -10vw;
            z-index: -1;
            filter: blur(70px);
            animation: floatGlow2 22s infinite alternate ease-in-out;
            transition: background 0.5s ease;
        }
        body.dark .glow-soft-2 {
            background: radial-gradient(circle, rgba(90, 70, 160, 0.15), rgba(30, 20, 60, 0) 70%);
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
            100% { transform: translate(5%, 8%) scale(1.2); opacity: 0.7; }
        }
        @keyframes floatGlow2 {
            0% { transform: translate(0, 0) scale(1); opacity: 0.2; }
            100% { transform: translate(-6%, -5%) scale(1.3); opacity: 0.6; }
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 2.8rem 1.8rem 2rem;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
        }

        /* ===== 头部：头像左移 + 文字右排 ===== */
        .site-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.8rem;
            position: relative;
        }

        .avatar {
            width: 80px;
            height: 80px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 16px 36px rgba(90, 70, 170, 0.20), 0 0 0 1px rgba(255,255,255,0.6);
            transition: 0.3s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.3s ease;
            background: #F3F0FF;
        }
        body.dark .avatar {
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255,255,255,0.08);
            background: #2C2845;
        }
        .avatar:hover {
            transform: scale(1.02) translateY(-2px);
            box-shadow: 0 20px 44px rgba(90, 70, 170, 0.28), 0 0 0 1px rgba(255,255,255,0.8);
        }
        body.dark .avatar:hover {
            box-shadow: 0 20px 44px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255,255,255,0.12);
        }
        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .header-text {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex: 1;
            min-width: 0;
        }

        .site-title {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.6px;
            background: linear-gradient(135deg, #201D3A, #5B4DAF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.2;
            transition: background 0.3s ease;
        }
        body.dark .site-title {
            background: linear-gradient(135deg, #C8C0F0, #8F7BE0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .welcome-tag {
            font-size: 0.9rem;
            color: #6F6F96;
            font-weight: 400;
            letter-spacing: 0.3px;
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(4px);
            display: inline-block;
            padding: 0.1rem 0.8rem;
            border-radius: 40px;
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
            border: 1px solid rgba(255,255,255,0.2);
            width: fit-content;
        }
        body.dark .welcome-tag {
            color: #B0ACD0;
            background: rgba(40, 35, 70, 0.5);
            border-color: rgba(255,255,255,0.06);
        }
        .welcome-tag i {
            margin-right: 0.4rem;
            color: #A89FD0;
        }
        body.dark .welcome-tag i {
            color: #8F7BE0;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 24px;
            z-index: 50;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 60px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: #4F4F78;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 6px 20px rgba(80, 60, 160, 0.10);
            user-select: none;
        }
        .theme-toggle:hover {
            transform: scale(1.05) rotate(8deg);
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 10px 28px rgba(80, 60, 160, 0.18);
        }
        body.dark .theme-toggle {
            background: rgba(30, 28, 50, 0.7);
            border-color: rgba(255, 255, 255, 0.08);
            color: #D0CAF0;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        body.dark .theme-toggle:hover {
            background: rgba(50, 45, 80, 0.8);
        }

        /* ===== 回到顶部按钮 ===== */
        .back-to-top-btn {
            position: fixed;
            bottom: 28px;
            right: 24px;
            z-index: 49;
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            color: #4F4F78;
            font-size: 1.2rem;
            cursor: pointer;
            transition: opacity 0.35s ease, transform 0.25s ease, background 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 6px 20px rgba(80, 60, 160, 0.10);
            opacity: 0;
            pointer-events: none;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .back-to-top-btn:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 10px 28px rgba(80, 60, 160, 0.18);
        }
        .back-to-top-btn.show {
            opacity: 1;
            pointer-events: auto;
        }
        .back-to-top-btn:active {
            transform: scale(0.92);
        }
        .back-to-top-btn.disabled {
            opacity: 0.3 !important;
            pointer-events: none !important;
        }
        body.dark .back-to-top-btn {
            background: rgba(30, 28, 50, 0.7);
            border-color: rgba(255, 255, 255, 0.08);
            color: #D0CAF0;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        body.dark .back-to-top-btn:hover {
            background: rgba(50, 45, 80, 0.8);
        }

        @media (max-width: 560px) {
            .back-to-top-btn {
                bottom: 20px;
                right: 16px;
                width: 42px;
                height: 42px;
                font-size: 1rem;
            }
            .theme-toggle {
                top: 14px;
                right: 16px;
                width: 42px;
                height: 42px;
                font-size: 1.2rem;
            }
        }

        .nav-wrapper {
            position: relative;
            margin: 0.5rem 0 2rem;
            padding: 6px;
            background: rgba(255, 255, 255, 0.20);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            overflow: hidden;
            transition: background 0.3s ease, border-color 0.3s ease;
            touch-action: pan-x;
            box-shadow: 0 4px 20px rgba(80, 60, 160, 0.06);
        }
        body.dark .nav-wrapper {
            background: rgba(40, 38, 65, 0.30);
            border-color: rgba(255, 255, 255, 0.06);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .nav-slider {
            position: absolute;
            top: 6px;
            left: 6px;
            height: calc(100% - 12px);
            border-radius: 60px;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 4px 20px rgba(80, 60, 160, 0.10), inset 0 1px 0 rgba(255,255,255,0.6);
            transition: left 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            z-index: 0;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .nav-slider.no-transition {
            transition: none !important;
        }
        body.dark .nav-slider {
            background: rgba(60, 55, 100, 0.55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255,255,255,0.05);
            border-color: rgba(255, 255, 255, 0.06);
        }

        .nav-scroll {
            overflow-x: auto;
            overflow-y: hidden;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
            position: relative;
            z-index: 1;
            border-radius: 60px;
            padding: 0 2px;
        }
        .nav-scroll::-webkit-scrollbar {
            display: none;
        }

        .nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            min-width: 100%;
            gap: 0;
            padding: 0 4px;
            position: relative;
        }

        .nav a {
            flex: 1 0 auto;
            text-align: center;
            text-decoration: none;
            color: #6A6A92;
            font-weight: 500;
            font-size: 0.9rem;
            padding: 0.7rem 0.8rem;
            cursor: pointer;
            transition: color 0.3s ease;
            position: relative;
            z-index: 2;
            white-space: nowrap;
            border-radius: 60px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            min-width: 60px;
        }
        body.dark .nav a {
            color: #9A96B8;
        }

        .nav a.active {
            color: #3D2D8A;
        }
        body.dark .nav a.active {
            color: #C8C0F0;
        }

        .nav a i {
            margin-right: 5px;
            font-size: 0.8rem;
        }

        .content-placeholder {
            flex: 1;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            padding: 1rem 0.5rem 2rem;
        }

        .link-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
            max-width: 380px;
            margin: 0.5rem 0 1.2rem;
        }
        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(8px);
            padding: 1rem 1.6rem;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 6px 18px rgba(80, 60, 160, 0.08);
            transition: 0.25s ease, background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            color: #1E1C3A;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
        }
        body.dark .link-card {
            background: rgba(40, 38, 65, 0.7);
            border-color: rgba(255, 255, 255, 0.06);
            color: #E0DCF5;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
        }
        .link-card i {
            font-size: 1.3rem;
            color: #6B5ACF;
            opacity: 0.8;
            transition: 0.2s;
        }
        body.dark .link-card i {
            color: #A89FD0;
        }
        .link-card:hover {
            background: rgba(255, 255, 255, 0.95);
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 14px 30px rgba(80, 60, 160, 0.16);
            border-color: #D6CCFF;
        }
        body.dark .link-card:hover {
            background: rgba(55, 50, 90, 0.8);
            border-color: rgba(160, 140, 220, 0.3);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.3);
        }
        .link-card .link-label {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .link-card .link-arrow {
            color: #A89FD0;
            font-size: 0.9rem;
        }
        body.dark .link-card .link-arrow {
            color: #7A6AA8;
        }

        .software-toggle-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            padding: 1rem 1.6rem;
            border-radius: 60px;
            border: 1px solid #D6CCFF;
            box-shadow: 0 6px 18px rgba(80, 60, 160, 0.08);
            transition: 0.25s ease;
            text-decoration: none;
            color: #1E1C3A;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            gap: 0.5rem;
            width: 100%;
        }
        body.dark .software-toggle-card {
            background: rgba(55, 50, 90, 0.8);
            border-color: rgba(160, 140, 220, 0.3);
            color: #E0DCF5;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
        }
        .software-toggle-card:hover {
            background: rgba(255, 255, 255, 0.95);
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 14px 30px rgba(80, 60, 160, 0.16);
            border-color: #D6CCFF;
        }
        body.dark .software-toggle-card:hover {
            background: rgba(70, 60, 110, 0.85);
            border-color: rgba(160, 140, 220, 0.4);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.3);
        }
        .software-toggle-card .icon-arrow {
            transition: transform 0.3s ease;
            color: #A89FD0;
            flex-shrink: 0;
        }
        body.dark .software-toggle-card .icon-arrow {
            color: #7A6AA8;
        }
        .software-toggle-card .icon-arrow.open {
            transform: rotate(180deg);
        }

        .software-list {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease, padding 0.3s ease;
            opacity: 0;
            padding: 0 0 0 0.5rem;
            width: 100%;
        }
        .software-list.open {
            max-height: 200px;
            opacity: 1;
            padding: 0.5rem 0 0.2rem 0.5rem;
        }

        .software-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(8px);
            padding: 0.8rem 1.4rem;
            border-radius: 60px;
            border: 1px solid rgba(200, 180, 255, 0.3);
            box-shadow: 0 6px 18px rgba(80, 60, 160, 0.06);
            transition: 0.25s ease;
            text-decoration: none;
            color: #1E1C3A;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            margin-bottom: 0.4rem;
        }
        body.dark .software-item {
            background: rgba(40, 38, 65, 0.7);
            border-color: rgba(255, 255, 255, 0.06);
            color: #E0DCF5;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
        }
        .software-item:hover {
            background: rgba(255, 255, 255, 0.95);
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 14px 30px rgba(80, 60, 160, 0.14);
            border-color: #D6CCFF;
        }
        body.dark .software-item:hover {
            background: rgba(55, 50, 90, 0.8);
            border-color: rgba(160, 140, 220, 0.3);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.3);
        }
        .software-item .item-label {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .software-item .item-arrow {
            color: #A89FD0;
            font-size: 0.9rem;
        }
        body.dark .software-item .item-arrow {
            color: #7A6AA8;
        }

        /* ===== 关于页面两个方块 ===== */
        .about-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 2rem 2.2rem;
            border: 1px solid rgba(255,255,255,0.8);
            box-shadow: 0 12px 28px rgba(80, 60, 160, 0.08);
            width: 100%;
            max-width: 480px;
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            text-align: left;
        }
        body.dark .about-card {
            background: rgba(35, 32, 60, 0.6);
            border-color: rgba(255, 255, 255, 0.05);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
        }
        .about-card h3 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            font-weight: 600;
            color: #2D2D4A;
            letter-spacing: -0.3px;
            transition: color 0.3s ease;
        }
        body.dark .about-card h3 {
            color: #D0CAF0;
        }
        .about-card p {
            margin-bottom: 0.6rem;
            color: #4A4A6E;
            line-height: 1.7;
            transition: color 0.3s ease;
        }
        body.dark .about-card p {
            color: #A8A4C8;
        }
        .about-card .contact-line {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: #6A6A95;
            font-size: 0.9rem;
        }
        body.dark .about-card .contact-line {
            color: #A8A4C8;
        }
        .about-card .signature-text {
            font-size: 0.9rem;
            color: #7B7BA5;
            font-style: italic;
            text-align: center;
            margin-top: 1rem;
            transition: color 0.3s ease;
        }
        body.dark .about-card .signature-text {
            color: #9A96B8;
        }

        /* ===== 统计方块 ===== */
        .stats-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 2rem 2.2rem;
            border: 1px solid rgba(255,255,255,0.8);
            box-shadow: 0 12px 28px rgba(80, 60, 160, 0.08);
            width: 100%;
            max-width: 480px;
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            text-align: left;
            margin-top: 0.75rem;
        }
        body.dark .stats-card {
            background: rgba(35, 32, 60, 0.6);
            border-color: rgba(255, 255, 255, 0.05);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
        }

        .stats-card .stat-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: #4A4A6E;
            font-size: 0.95rem;
            padding: 0.3rem 0;
            transition: color 0.3s ease;
        }
        body.dark .stats-card .stat-item {
            color: #B8B4D8;
        }
        .stats-card .stat-item i {
            width: 1.4rem;
            color: #6B5ACF;
            font-size: 1rem;
            text-align: center;
        }
        body.dark .stats-card .stat-item i {
            color: #A89FD0;
        }

        .stats-card .divider {
            border: none;
            border-top: 1px solid rgba(0,0,0,0.06);
            margin: 1rem 0;
            transition: border-color 0.3s ease;
        }
        body.dark .stats-card .divider {
            border-top-color: rgba(255,255,255,0.06);
        }

        .stats-card .domain-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .stats-card .domain-row .domain-url {
            color: #6B5ACF;
            font-weight: 500;
            word-break: break-all;
            font-size: 0.95rem;
        }
        body.dark .stats-card .domain-row .domain-url {
            color: #88ccff;
        }
        .stats-card .domain-row .copy-btn {
            background: rgba(107, 90, 207, 0.1);
            border: none;
            border-radius: 8px;
            padding: 0.2rem 0.8rem;
            font-size: 0.75rem;
            color: #6B5ACF;
            cursor: pointer;
            transition: 0.2s ease;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .stats-card .domain-row .copy-btn:hover {
            background: rgba(107, 90, 207, 0.2);
            transform: scale(1.04);

<div id="toastMsg" class="toast"></div>

<script>
    const toast = document.getElementById('toastMsg');
    function showMessage(text) {
        toast.style.opacity = '1';
        toast.innerText = text;
        setTimeout(() => { toast.style.opacity = '0'; }, 1500);
    }

    const themeToggle = document.getElementById('themeToggle');
    const icon = themeToggle.querySelector('i');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    let currentTheme = localStorage.getItem('ks-theme') || (prefersDark ? 'dark' : 'light');

    function setTheme(theme) {
        document.body.classList.toggle('dark', theme === 'dark');
        icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        localStorage.setItem('ks-theme', theme);
        currentTheme = theme;
    }
    setTheme(currentTheme);
    themeToggle.addEventListener('click', () => {
        setTheme(currentTheme === 'dark' ? 'light' : 'dark');
    });

    // ============================================================
    // 回到顶部（参考 article.html 的实现）
    // ============================================================
    const backToTopBtn = document.getElementById('backToTopBtn');
    let isScrollingToTop = false;

    window.addEventListener('scroll', function() {
        const scrollY = window.scrollY || window.pageYOffset;
        if (scrollY > 300 && !isScrollingToTop) {
            backToTopBtn.classList.add('show');
        } else if (!isScrollingToTop) {
            backToTopBtn.classList.remove('show');
        }
    });

    function fastScrollToTop() {
        const startY = window.scrollY || window.pageYOffset;
        if (startY === 0) return;
        const duration = 300;
        const startTime = performance.now();

        function step(currentTime) {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const ease = 1 - Math.pow(1 - progress, 3);
            const nextY = startY * (1 - ease);
            window.scrollTo(0, nextY);
            if (progress < 1) {
                requestAnimationFrame(step);
            } else {
                window.scrollTo(0, 0);
                isScrollingToTop = false;
                backToTopBtn.classList.remove('disabled');
                backToTopBtn.classList.remove('show');
            }
        }
        requestAnimationFrame(step);
    }

    backToTopBtn.addEventListener('click', function() {
        if (isScrollingToTop) return;
        const scrollY = window.scrollY || window.pageYOffset;
        if (scrollY === 0) return;
        isScrollingToTop = true;
        backToTopBtn.classList.add('disabled');
        fastScrollToTop();
    });

    const navLinks = document.querySelectorAll('.nav a');
    const navSlider = document.getElementById('navSlider');
    const navWrapper = document.getElementById('navWrapper');
    const navScroll = document.getElementById('navScroll');

    function updateSlider(activeLink) {
        const wrapperRect = navWrapper.getBoundingClientRect();
        const linkRect = activeLink.getBoundingClientRect();
        const left = linkRect.left - wrapperRect.left + 6;
        const width = linkRect.width - 12;
        navSlider.style.left = left + 'px';
        navSlider.style.width = width + 'px';
    }

    setTimeout(() => {
        const active = document.querySelector('.nav a.active');
        if (active) {
            updateSlider(active);
            requestAnimationFrame(() => {
                navSlider.classList.remove('no-transition');
            });
        }
    }, 50);

    let resizeTimer;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            const active = document.querySelector('.nav a.active');
            if (active) updateSlider(active);
        }, 100);
    });

    // ============================================================
    // 折叠菜单状态管理
    // ============================================================
    const SOFTWARE_STATE_KEY = 'software_folded_state';

    function getStoredState() {
        try {
            return sessionStorage.getItem(SOFTWARE_STATE_KEY) === 'true';
        } catch {
            return false;
        }
    }

    function setStoredState(isOpen) {
        try {
            sessionStorage.setItem(SOFTWARE_STATE_KEY, String(isOpen));
        } catch {}
    }

    function applySoftwareState(forceState) {
        const toggle = document.getElementById('softwareToggle');
        const list = document.getElementById('softwareList');
        const arrow = document.getElementById('softwareArrow');
        if (!toggle || !list || !arrow) return;

        const shouldOpen = forceState !== undefined ? forceState : getStoredState();

        if (shouldOpen) {
            list.classList.add('open');
            arrow.classList.add('open');
        } else {
            list.classList.remove('open');
            arrow.classList.remove('open');
        }
    }

    function bindSoftwareToggle() {
        const toggle = document.getElementById('softwareToggle');
        const list = document.getElementById('softwareList');
        const arrow = document.getElementById('softwareArrow');
        if (!toggle || !list || !arrow) return;

        const newToggle = toggle.cloneNode(true);
        toggle.parentNode.replaceChild(newToggle, toggle);

        const newList = document.getElementById('softwareList');
        const newArrow = document.getElementById('softwareArrow');
        const newToggleBtn = document.getElementById('softwareToggle');

        const isOpen = getStoredState();
        if (isOpen) {
            newList.classList.add('open');
            newArrow.classList.add('open');
        } else {
            newList.classList.remove('open');
            newArrow.classList.remove('open');
        }

        newToggleBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            const listEl = document.getElementById('softwareList');
            const arrowEl = document.getElementById('softwareArrow');
            const isCurrentlyOpen = listEl.classList.toggle('open');
            arrowEl.classList.toggle('open');
            setStoredState(isCurrentlyOpen);
        });
    }

    const recommendHTML = `
        <div class="content-placeholder" style="justify-content: flex-start; padding-top: 0.2rem;">
            <div class="link-grid">
                <a href="muqin.html" class="link-card">
                    <span class="link-label"><i class="fas fa-heart" style="color: #E88BB0;"></i> 母亲节庆祝页面</span>
                    <span class="link-arrow"><i class="fas fa-arrow-right"></i></span>
                </a>
                <a href="fuqin.html" class="link-card">
                    <span class="link-label"><i class="fas fa-star" style="color: #6E9FDF;"></i> 父亲节庆祝页面</span>
                    <span class="link-arrow"><i class="fas fa-arrow-right"></i></span>
                </a>
                <div style="display:flex; flex-direction:column; gap:0.5rem; width:100%;">
                    <div class="software-toggle-card" id="softwareToggle">
                        <span class="link-label"><i class="fas fa-box" style="color: #8F7BE0;"></i> 下载软件</span>
                        <span class="icon-arrow" id="softwareArrow"><i class="fas fa-chevron-down"></i></span>
                    </div>
                    <div class="software-list" id="softwareList">
                        <a href="nordownload.html" class="software-item" id="norLink">
                            <span class="item-label"><i class="fas fa-clock" style="color: #6E9FDF;"></i> nor叔</span>
                            <span class="item-arrow"><i class="fas fa-arrow-right"></i></span>
                        </a>
                        <a href="zhuanhuandownload.html" class="software-item" id="zhuanhuanLink">
                            <span class="item-label"><i class="fas fa-font" style="color: #E88BB0;"></i> 特殊字符转换器</span>
                            <span class="item-arrow"><i class="fas fa-arrow-right"></i></span>
                        </a>
                    </div>
                </div>
            </div>
            <div style="margin-top: 1.6rem; font-size: 0.75rem; color: #AEAECB; letter-spacing: 0.2px; transition: color 0.3s ease;">
                <i class="far fa-clock"></i> 保持好奇，保持诚实
            </div>
        </div>
    `;

    // ===== 文章相关 =====
    let allArticles = [];
    let currentFilter = 'newest';
    let currentPage = 1;
    let currentKeyword = '';
    const PAGE_SIZE = 10;  // ← 改为每页 10 篇
    const PRELOAD_PAGES = 4;
    let loadedCount = 0;

    function saveArticleState() {
        sessionStorage.setItem('articlePage', currentPage);
        sessionStorage.setItem('articleFilter', currentFilter);
        sessionStorage.setItem('articleKeyword', currentKeyword);
    }

    function loadArticleState() {
        const page = sessionStorage.getItem('articlePage');
        const filter = sessionStorage.getItem('articleFilter');
        const keyword = sessionStorage.getItem('articleKeyword');
        if (page) currentPage = parseInt(page);
        if (filter) currentFilter = filter;
        if (keyword !== null) currentKeyword = keyword;
    }

    function getUrlParam(name) {
        const url = new URL(window.location.href);
        return url.searchParams.get(name);
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function highlightText(text, keyword) {
        if (!keyword || !text) return text;
        const kw = escapeHtml(keyword);
        const regex = new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
        return text.replace(regex, match => `<span class="highlight">${match}</span>`);
    }

    function markdownToPlainText(md) {
        if (!md) return '';
        let text = md;
        text = text.replace(/```[\s\S]*?```/g, '');
        text = text.replace(/`([^`]+)`/g, '$1');
        text = text.replace(/\*\*(.*?)\*\*/g, '$1');
        text = text.replace(/\*([^*]+)\*/g, '$1');
        text = text.replace(/~~(.*?)~~/g, '$1');
        text = text.replace(/\[([^\]]*)\]\([^)]*\)/g, '$1');
        text = text.replace(/^#{1,6}\s+/gm, '');
        text = text.replace(/^-\s+/gm, '');
        text = text.replace(/^\d+\.\s+/gm, '');
        text = text.replace(/^>\s+/gm, '');
        text = text.replace(/^---$/gm, '');
        text = text.replace(/\n{3,}/g, '\n\n');
        return text.trim();
    }

    function getPreviewAroundMatch(content, keyword, contextLength = 80) {
        const plainText = markdownToPlainText(content);
        if (!keyword || !plainText) {
            return plainText.substring(0, 120) + (plainText.length > 120 ? '...' : '');
        }
        const kw = keyword.trim().toLowerCase();
        const lowerText = plainText.toLowerCase();
        const index = lowerText.indexOf(kw);
        if (index === -1) {
            return plainText.substring(0, 120) + (plainText.length > 120 ? '...' : '');
        }
        let start = Math.max(0, index - contextLength);
        let end = Math.min(plainText.length, index + kw.length + contextLength);
        let preview = plainText.substring(start, end);
        if (start > 0) preview = '...' + preview;
        if (end < plainText.length) preview = preview + '...';
        return preview;
    }

    function renderPreviewMarkdown(text) {
        if (!text) return '';
        let html = escapeHtml(text);
        html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
        html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
        html = html.replace(/\[([^\]]*)\]\(([^)]*)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
        return html;
    }

    function getDisplayArticles(filtered) {
        const total = filtered.length;
        const loadLimit = Math.min(total, loadedCount + PAGE_SIZE * PRELOAD_PAGES);
        if (loadedCount < Math.min(total, loadLimit)) {
            loadedCount = Math.min(total, loadLimit);
        }
        return filtered.slice(0, loadedCount);
    }

    function checkAndLoadMore(filtered, page) {
        const total = filtered.length;
        const loadedPages = Math.ceil(loadedCount / PAGE_SIZE);
        if (page >= loadedPages - 1 && loadedCount < total) {
            const nextLoad = Math.min(total, loadedCount + PAGE_SIZE * PRELOAD_PAGES);
            loadedCount = nextLoad;
            return true;
        }
        return false;
    }

    function renderArticleList(filtered, kw, page) {
        const list = document.querySelector('.articles-list');
        const countEl = document.querySelector('.result-count');
        const paginationEl = document.querySelector('.pagination');
        if (!list) return;

        const totalItems = filtered.length;
        const totalPages = Math.max(1, Math.ceil(totalItems / PAGE_SIZE));
        if (page > totalPages) page = totalPages;
        if (page < 1) page = 1;
        currentPage = page;
        currentKeyword = kw || '';

        if (checkAndLoadMore(filtered, page)) {
            renderArticleList(filtered, kw, page);
            return;
        }

        const displayArticles = getDisplayArticles(filtered);
        const start = (page - 1) * PAGE_SIZE;
        const end = Math.min(start + PAGE_SIZE, displayArticles.length);
        const pageItems = displayArticles.slice(start, end);

        if (displayArticles.length === 0) {
            list.innerHTML = `<div class="no-result">没有找到匹配的文章</div>`;
            if (countEl) countEl.textContent = '';
            if (paginationEl) paginationEl.innerHTML = '';
            saveArticleState();
            return;
        }

        let html = '';
        pageItems.forEach((item, index) => {
            const realIndex = allArticles.indexOf(item);
            const title = item.title || '无标题';
            const date = item.date || '';
            const content = item.content || '';
            const plainContent = markdownToPlainText(content);
            const wordCount = plainContent.length;
            const readTime = Math.ceil(wordCount / 300);
            const readTimeDisplay = readTime === 1 ? '1分钟' : readTime + '分钟';
            const titleHtml = highlightText(escapeHtml(title), kw);
            const previewText = getPreviewAroundMatch(content, kw);
            const previewHtml = renderPreviewMarkdown(previewText);
            const previewHighlighted = highlightText(previewHtml, kw);

            html += `
                <div class="article-item" data-index="${realIndex}">
                    <div class="item-header">
                        <span class="item-title">${titleHtml}</span>
                        <span class="item-meta">${readTimeDisplay} · ${wordCount}字</span>
                    </div>
                    <div class="item-summary">${previewHighlighted}</div>
                    <div class="item-date">${date}</div>
                </div>
            `;
        });

        list.innerHTML = html;

        list.querySelectorAll('.article-item').forEach(el => {
            el.addEventListener('click', function() {
                const idx = this.dataset.index;
                saveArticleState();
                window.location.href = `article.html?id=${idx}&page=${currentPage}`;
            });
        });

        if (countEl) {
            countEl.textContent = totalItems > 0 ? `共 ${totalItems} 篇` : '';
        }

        if (paginationEl) {
            if (totalPages <= 1) {
                paginationEl.innerHTML = '';
                saveArticleState();
                return;
            }
            let pgHtml = '';
            pgHtml += `<button class="page-prev" ${page <= 1 ? 'disabled' : ''}><i class="fas fa-chevron-left"></i></button>`;
            const startPage = Math.max(1, page - 2);
            const endPage = Math.min(totalPages, page + 2);
            if (startPage > 1) {
                pgHtml += `<button class="page-num" data-page="1">1</button>`;
                if (startPage > 2) pgHtml += `<span style="color:#8A8AB5;font-size:0.7rem;">…</span>`;
            }
            for (let i = startPage; i <= endPage; i++) {
                pgHtml += `<button class="page-num ${i === page ? 'active-page' : ''}" data-page="${i}">${i}</button>`;
            }
            if (endPage < totalPages) {
                if (endPage < totalPages - 1) pgHtml += `<span style="color:#8A8AB5;font-size:0.7rem;">…</span>`;
                pgHtml += `<button class="page-num" data-page="${totalPages}">${totalPages}</button>`;
            }
            pgHtml += `<button class="page-next" ${page >= totalPages ? 'disabled' : ''}><i class="fas fa-chevron-right"></i></button>`;
            pgHtml += `<span class="page-info">${page} / ${totalPages}</span>`;
            paginationEl.innerHTML = pgHtml;

            paginationEl.querySelectorAll('.page-num').forEach(btn => {
                btn.addEventListener('click', function() {
                    const p = parseInt(this.dataset.page);
                    if (p !== currentPage) {
                        renderArticleList(filtered, kw, p);
                        saveArticleState();
                    }
                });
            });
            paginationEl.querySelector('.page-prev')?.addEventListener('click', function() {
                if (currentPage > 1) {
                    renderArticleList(filtered, kw, currentPage - 1);
                    saveArticleState();
                }
            });
            paginationEl.querySelector('.page-next')?.addEventListener('click', function() {
                if (currentPage < totalPages) {
                    renderArticleList(filtered, kw, currentPage + 1);
                    saveArticleState();
                }
            });
        }

        saveArticleState();

        if (kw && filtered.length > 0) {
            const firstItem = list.querySelector('.article-item');
            if (firstItem) {
                setTimeout(() => {
                    const container = list.closest('.content-placeholder');
                    if (container) {
                        container.scrollIntoView({ block: 'start', behavior: 'smooth' });
                    }
                    firstItem.scrollIntoView({ block: 'center', behavior: 'smooth' });
                }, 150);
            }
        } else {
            const container = list.closest('.content-placeholder');
            if (container) {
                container.scrollIntoView({ block: 'start', behavior: 'smooth' });
            }
        }
    }

    function applySearch(keyword) {
        const kw = keyword.trim().toLowerCase();
        let filtered = [...allArticles];

        if (kw) {
            filtered = filtered.filter(item => {
                const title = (item.title || '').toLowerCase();
                const plainContent = markdownToPlainText(item.content || '').toLowerCase();
                return title.includes(kw) || plainContent.includes(kw);
            });
        }

        filtered.sort((a, b) => {
            const dateA = a.date || '1970-01-01';
            const dateB = b.date || '1970-01-01';
            if (currentFilter === 'newest') {
                return dateB.localeCompare(dateA);
            } else {
                return dateA.localeCompare(dateB);
            }
        });

        loadedCount = 0;
        renderArticleList(filtered, kw, 1);
        currentPage = 1;
        saveArticleState();
    }

    function renderArticles() {
        const container = document.getElementById('appContent');
        container.innerHTML = `
            <div class="content-placeholder" style="justify-content: flex-start; padding-top: 0.2rem; width: 100%;">
                <div class="articles-container">
                    <div class="articles-toolbar">
                        <div class="search-wrap">
                            <i class="fas fa-search"></i>
                            <input class="articles-search-input" type="text" placeholder="搜索文章..." autocomplete="off" value="${escapeHtml(currentKeyword)}">
                            <button class="search-clear" id="searchClearBtn" aria-label="清空搜索">✕</button>
                        </div>
                        <div class="filter-wrap">
                            <button class="filter-btn ${currentFilter === 'newest' ? 'active' : ''}" data-filter="newest">最新</button>
                            <button class="filter-btn ${currentFilter === 'oldest' ? 'active' : ''}" data-filter="oldest">最早</button>
                        </div>
                        <span class="result-count"></span>
                    </div>
                    <div class="articles-list" id="articlesList">
                        <div style="text-align:center; padding: 2rem; color: #8A8AB5;">
                            <i class="fas fa-spinner fa-spin"></i> 加载中...
                        </div>
                    </div>
                    <div class="pagination" id="pagination"></div>
                </div>
            </div>
        `;

        const searchInput = container.querySelector('.articles-search-input');
        const searchClearBtn = document.getElementById('searchClearBtn');
        const filterBtns = container.querySelectorAll('.filter-btn');
        const list = container.querySelector('.articles-list');

        function updateClearBtn() {
            if (searchInput && searchClearBtn) {
                if (searchInput.value.length > 0) {
                    searchClearBtn.classList.add('visible');
                } else {
                    searchClearBtn.classList.remove('visible');
                }
            }
        }

        const urlPage = getUrlParam('page');
        if (urlPage) {
            sessionStorage.setItem('articlePage', urlPage);
        }

        loadArticleState();
        if (searchInput && currentKeyword) {
            searchInput.value = currentKeyword;
        }
        filterBtns.forEach(btn => {
            btn.classList.toggle('active', btn.dataset.filter === currentFilter);
        });

        setTimeout(updateClearBtn, 50);
        loadedCount = 0;

        fetch('wenzhang.json', { cache: 'no-cache' })
            .then(response => {
                if (!response.ok) throw new Error('文件不存在');
                return response.json();
            })
            .then(data => {
                allArticles = data.announcements || [];
                if (allArticles.length === 0) {
                    list.innerHTML = `<div class="no-result">还没有文章！</div>`;
                    return;
                }
                const kw = currentKeyword || '';
                let filtered = [...allArticles];
                if (kw) {
                    filtered = filtered.filter(item => {
                        const title = (item.title || '').toLowerCase();
                        const plainContent = markdownToPlainText(item.content || '').toLowerCase();
                        return title.includes(kw) || plainContent.includes(kw);
                    });
                }
                filtered.sort((a, b) => {
                    const dateA = a.date || '1970-01-01';
                    const dateB = b.date || '1970-01-01';
                    if (currentFilter === 'newest') {
                        return dateB.localeCompare(dateA);
                    } else {
                        return dateA.localeCompare(dateB);
                    }
                });

                const savedPage = parseInt(sessionStorage.getItem('articlePage')) || 1;
                const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
                const pageToLoad = Math.min(savedPage, totalPages);
                renderArticleList(filtered, kw, pageToLoad);
            })
            .catch(() => {
                list.innerHTML = `
                    <div class="no-result">
                        <i class="far fa-frown"></i> 加载文章数据失败<br>
                        <span style="font-size:0.8rem;">请稍后再试或刷新网页…</span>
                    </div>
                `;
            });

        searchInput.addEventListener('input', function() {
            applySearch(this.value);
            updateClearBtn();
        });

        searchClearBtn.addEventListener('click', function() {
            if (searchInput) {
                searchInput.value = '';
                applySearch('');
                updateClearBtn();
                searchInput.focus();
            }
        });

        filterBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                filterBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                applySearch(searchInput.value);
                updateClearBtn();
            });
        });

        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                if (document.querySelector('.articles-search-input')) {
                    e.preventDefault();
                    searchInput.focus();
                    searchInput.select();
                }
            }
            if (e.key === 'Escape') {
                searchInput.blur();
                updateClearBtn();
            }
        });

        if (searchInput) {
            searchInput.addEventListener('focus', updateClearBtn);
            searchInput.addEventListener('blur', function() {
                setTimeout(updateClearBtn, 200);
            });
        }
    }

    // ============================================================
    // 归档页面：文件夹 + 文章列表 + 过渡动画
    // ============================================================
    function renderArchive() {
        const container = document.getElementById('appContent');

        container.innerHTML = `
            <div class="content-placeholder" style="justify-content: flex-start; padding-top: 0.2rem; width: 100%;">
                <div class="archive-container">
                    <!-- 文件夹列表视图 -->
                    <div class="archive-folder-view" id="archiveFolderView">
                        <div class="archive-folder-list">
                            <div class="archive-folder-item" data-target="articles">
                                <i class="fas fa-folder"></i>
                                文章
                                <span class="folder-badge" id="articleCountBadge">0</span>
                                <span class="folder-arrow"><i class="fas fa-chevron-right"></i></span>
                            </div>
                            <div class="archive-folder-item" data-target="tags">
                                <i class="fas fa-tags"></i>
                                标签 / 分类
                                <span class="folder-badge">开发中</span>
                                <span class="folder-arrow"><i class="fas fa-chevron-right"></i></span>
                            </div>
                        </div>
                    </div>

                    <!-- 文章列表视图（原归档内容） -->
                    <div class="archive-articles-view" id="archiveArticlesView">
                        <button class="archive-back-btn" id="archiveBackBtn">
                            <i class="fas fa-arrow-left"></i> 返回
                        </button>
                        <div class="archive-title"><i class="fas fa-folder-open"></i> 全部文章</div>
                        <div id="archiveList">
                            <div style="text-align:center; padding: 2rem; color: #8A8AB5;">
                                <i class="fas fa-spinner fa-spin"></i> 加载中...
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;

        // 获取文章数量并更新徽标
        fetch('wenzhang.json', { cache: 'no-cache' })
            .then(response => {
                if (!response.ok) throw new Error('文件不存在');
                return response.json();
            })
            .then(data => {
                const articles = data.announcements || [];
                const badge = document.getElementById('articleCountBadge');
                if (badge) badge.textContent = articles.length;

                renderArchiveList(articles);
            })
            .catch(() => {
                document.getElementById('archiveList').innerHTML = `
                    <div class="archive-empty">
                        <i class="far fa-frown"></i> 加载文章数据失败<br>
                        <span style="font-size:0.8rem;">请稍后再试或刷新网页…</span>
                    </div>
                `;
            });

        // 文件夹点击事件（带过渡动画）
        document.querySelectorAll('.archive-folder-item').forEach(item => {
            item.addEventListener('click', function() {
                const target = this.dataset.target;
                if (target === 'tags') {
                    showMessage('标签功能开发中，敬请期待 🏷️');
                    return;
                }
                if (target === 'articles') {
                    const folderView = document.getElementById('archiveFolderView');
                    const articlesView = document.getElementById('archiveArticlesView');

                    // 文件夹淡出
                    folderView.classList.remove('fade-in');
                    folderView.classList.add('fade-out');
                    setTimeout(() => {
                        folderView.classList.add('hidden');
                        folderView.classList.remove('fade-out');

                        // 文章列表淡入
                        articlesView.classList.remove('hidden', 'fade-out');
                        articlesView.classList.add('active', 'fade-in');
                    }, 300);
                }
            });
        });

        // 返回按钮（带过渡动画）
        document.getElementById('archiveBackBtn').addEventListener('click', function() {
            const folderView = document.getElementById('archiveFolderView');
            const articlesView = document.getElementById('archiveArticlesView');

            // 文章列表淡出
            articlesView.classList.remove('fade-in');
            articlesView.classList.add('fade-out');
            setTimeout(() => {
                articlesView.classList.remove('active', 'fade-out');
                articlesView.classList.add('hidden');

                // 文件夹淡入
                folderView.classList.remove('hidden', 'fade-out');
                folderView.classList.add('fade-in');
            }, 300);
        });
    }

    function renderArchiveList(articles) {
        const listEl = document.getElementById('archiveList');
        if (!listEl) return;

        if (articles.length === 0) {
            listEl.innerHTML = `<div class="archive-empty">📭 还没有文章</div>`;
            return;
        }

        const yearGroups = {};
        articles.forEach((item, index) => {
            const date = item.date || '1970-01-01';
            const parts = date.split('-');
            const year = parts[0] || '1970';
            const month = parts[1] || '01';
            if (!yearGroups[year]) {
                yearGroups[year] = {};
            }
            if (!yearGroups[year][month]) {
                yearGroups[year][month] = [];
            }
            yearGroups[year][month].push({ ...item, index });
        });

        const sortedYears = Object.keys(yearGroups).sort((a, b) => b.localeCompare(a));

        let html = '';
        sortedYears.forEach(year => {
            const months = yearGroups[year];
            let yearTotal = 0;
            const sortedMonths = Object.keys(months).sort((a, b) => b.localeCompare(a));
            sortedMonths.forEach(month => {
                yearTotal += months[month].length;
            });

            html += `<div class="archive-year-group">`;
            html += `<div class="archive-year-label">${year} 年 <span class="count">(${yearTotal} 篇)</span></div>`;

            sortedMonths.forEach(month => {
                const items = months[month];
                const monthName = month + '月';
                html += `<div class="archive-month-group">`;
                html += `<div class="archive-month-label">${monthName} <span class="count">${items.length} 篇</span></div>`;
                items.sort((a, b) => {
                    const da = a.date || '1970-01-01';
                    const db = b.date || '1970-01-01';
                    return db.localeCompare(da);
                });
                items.forEach(item => {
                    const title = escapeHtml(item.title || '无标题');
                    const date = item.date || '';
                    html += `
                        <div class="archive-item" data-index="${item.index}">
                            <span class="item-title">${title}</span>
                            <span class="item-date">${date}</span>
                        </div>
                    `;
                });
                html += `</div>`;
            });
            html += `</div>`;
        });

        listEl.innerHTML = html;

        listEl.querySelectorAll('.archive-item').forEach(el => {
            el.addEventListener('click', function() {
                const idx = this.dataset.index;
                window.location.href = `article.html?id=${idx}&from=archive&folder=articles`;
            });
        });
    }

    // ===== 关于页面 =====
    function renderAbout() {
        const container = document.getElementById('appContent');

        const startDate = new Date(2026, 6, 5);
        const now = new Date();
        const diffMs = now - startDate;
        const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

        let years = 0;
        let months = 0;
        let days = diffDays;
        if (days >= 365) {
            years = Math.floor(days / 365);
            days = days % 365;
        }
        if (days >= 30) {
            months = Math.floor(days / 30);
            days = days % 30;
        }
        let carryDisplay = '';
        if (years > 0) carryDisplay += years + ' 年 ';
        if (months > 0) carryDisplay += months + ' 月 ';
        carryDisplay += days + ' 天';

        const sameDisplay = (diffDays + ' 天') === carryDisplay.trim();

        fetch('wenzhang.json', { cache: 'no-cache' })
            .then(response => {
                if (!response.ok) throw new Error('文件不存在');
                return response.json();
            })
            .then(data => {
                const articles = data.announcements || [];
                const articleCount = articles.length;
                let totalWordCount = 0;
                articles.forEach(item => {
                    const content = item.content || '';
                    const text = content
                        .replace(/```[\s\S]*?```/g, '')
                        .replace(/`[^`]+`/g, '')
                        .replace(/\*\*(.*?)\*\*/g, '$1')
                        .replace(/\*([^*]+)\*/g, '$1')
                        .replace(/~~(.*?)~~/g, '$1')
                        .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
                        .replace(/!\[([^\]]*)\]\([^)]*\)/g, '')
                        .replace(/^#{1,6}\s+/gm, '')
                        .replace(/^-\s+/gm, '')
                        .replace(/^\d+\.\s+/gm, '')
                        .replace(/^>\s+/gm, '')
                        .replace(/^---$/gm, '')
                        .replace(/\s+/g, ' ')
                        .trim();
                    totalWordCount += text.length;
                });
                renderAboutContent(articleCount, totalWordCount, diffDays, carryDisplay, sameDisplay);
            })
            .catch(() => {
                renderAboutContent(0, 0, diffDays, carryDisplay, sameDisplay);
            });

        function renderAboutContent(articleCount, totalWordCount, diffDays, carryDisplay, sameDisplay) {
            let timeHtml = `
                <div class="stat-item">
                    <i class="fas fa-clock"></i>
                    <span>运行时间</span>
                    <span style="margin-left: auto; color: #6B5ACF; font-weight: 500;">2026.07.05 至今</span>
                </div>
                <div class="stat-item" style="padding-left: 2rem; font-size: 0.9rem; color: #7A7AA8;">
                    <span>${diffDays} 天</span>
                </div>
            `;
            if (!sameDisplay) {
                timeHtml += `
                <div class="stat-item" style="padding-left: 2rem; font-size: 0.9rem; color: #7A7AA8;">
                    <span>${carryDisplay}</span>
                </div>
                `;
            }

            container.innerHTML = `
                <div class="content-placeholder" style="justify-content: center; gap: 0.75rem;">
                    <div class="about-card">
                        <h3><i class="fas fa-user" style="margin-right: 0.6rem; color: #6B5ACF;"></i>关于 ks</h3>
                        <p>一个普通的人类。</p>
                        <p>一个用 Ai 跑出来的博客</p>
                        <div class="contact-line">
                            <i class="fas fa-envelope" style="color: #7A6BCF;"></i> 340313894@qq.com
                        </div>
                        <div class="signature-text">"保持好奇，保持诚实。"</div>
                    </div>

                    <div class="stats-card">
                        ${timeHtml}
                        <hr class="divider">
                        <div class="domain-row">
                            <span><i class="fas fa-globe" style="color: #6B5ACF; margin-right: 0.6rem;"></i><span class="domain-url">https://cuizi.top/</span></span>
                            <button class="copy-btn" id="copyDomainBtn"><i class="fas fa-copy"></i> 复制</button>
                        </div>
                        <hr class="divider">
                        <div class="stat-item">
                            <i class="fas fa-file-alt"></i>
                            <span>文章数量</span>
                            <span style="margin-left: auto; font-weight: 500;">${articleCount} 篇</span>
                        </div>
                        <div class="stat-item">
                            <i class="fas fa-font"></i>
                            <span>文章字数</span>
                            <span style="margin-left: auto; font-weight: 500;">${totalWordCount} 字</span>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('copyDomainBtn').addEventListener('click', function() {
                const url = 'https://cuizi.top/';
                navigator.clipboard.writeText(url).then(() => {
                    this.innerHTML = '<i class="fas fa-check"></i> 已复制';
                    this.classList.add('copied');
                    setTimeout(() => {
                        this.innerHTML = '<i class="fas fa-copy"></i> 复制';
                        this.classList.remove('copied');
                    }, 2000);
                }).catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = url;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    this.innerHTML = '<i class="fas fa-check"></i> 已复制';
                    this.classList.add('copied');
                    setTimeout(() => {
                        this.innerHTML = '<i class="fas fa-copy"></i> 复制';
                        this.classList.remove('copied');
                    }, 2000);
                });
            });
        }
    }

    const appContent = document.getElementById('appContent');

    function renderRecommend() {
        appContent.innerHTML = recommendHTML;
        setTimeout(function() {
            bindSoftwareToggle();
        }, 50);
    }

    function switchPage(pageId, linkElement) {
        if (pageId === 'recommend') renderRecommend();
        else if (pageId === 'articles') renderArticles();
        else if (pageId === 'about') renderAbout();
        else if (pageId === 'archive') renderArchive();

        navLinks.forEach(link => link.classList.remove('active'));
        if (linkElement) {
            linkElement.classList.add('active');
            updateSlider(linkElement);
            const container = navScroll;
            const linkRect = linkElement.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();
            if (linkRect.left < containerRect.left || linkRect.right > containerRect.right) {
                linkElement.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }
        } else {
            const active = document.querySelector(`.nav a[data-page="${pageId}"]`);
            if (active) {
                active.classList.add('active');
                updateSlider(active);
            }
        }
    }

    navLinks.forEach(link => {
        link.addEventListener('click', (e) => {
            e.preventDefault();
            const page = link.getAttribute('data-page');
            switchPage(page, link);
        });
    });

    let scrollTimeout;
    navScroll.addEventListener('scroll', () => {
        clearTimeout(scrollTimeout);
        scrollTimeout = setTimeout(() => {
            const container = navScroll;
            const center = container.scrollLeft + container.offsetWidth / 2;
            let closest = null;
            let closestDist = Infinity;
            navLinks.forEach(link => {
                const rect = link.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();
                const linkCenter = rect.left + rect.width / 2 - containerRect.left;
                const dist = Math.abs(linkCenter - container.offsetWidth / 2);
                if (dist < closestDist) {
                    closestDist = dist;
                    closest = link;
                }
            });
            if (closest && !closest.classList.contains('active')) {
                const page = closest.getAttribute('data-page');
                switchPage(page, closest);
            }
        }, 80);
    });

    // ===== 启动逻辑：默认打开「文章」页 =====
    const returnParam = getUrlParam('return');
    const defaultActive = document.querySelector('.nav a.active');

    window.addEventListener('pageshow', function() {
        if (document.getElementById('softwareToggle')) {
            applySoftwareState();
        }
    });

    if (returnParam === 'archive') {
        const archiveLink = document.querySelector('.nav a[data-page="archive"]');
        if (archiveLink) {
            switchPage('archive', archiveLink);
        } else {
            switchPage('articles', navLinks[0]);
        }
        const cleanUrl = window.location.pathname;
        window.history.replaceState({}, '', cleanUrl);
    } else if (returnParam === 'articles' || getUrlParam('page')) {
        const articleLink = document.querySelector('.nav a[data-page="articles"]');
        if (articleLink) {
            switchPage('articles', articleLink);
        } else {
            switchPage('articles', navLinks[0]);
        }
        const cleanUrl = window.location.pathname;
        window.history.replaceState({}, '', cleanUrl);
    } else {
        const articlesLink = document.querySelector('.nav a[data-page="articles"]');
        if (articlesLink) {
            switchPage('articles', articlesLink);
        } else {
            switchPage('articles', navLinks[0]);
        }
    }
</script>

ile,maxSize,quality){return new Promise(function(resolve,reject){var reader=new FileReader();reader.onload=function(e){var img=new Image();img.onload=function(){var canvas=document.createElement('canvas');var w=img.width,h=img.height;if(w>h){if(w>maxSize){h=h*maxSize/w;w=maxSize;}}else{if(h>maxSize){w=w*maxSize/h;h=maxSize;}}canvas.width=w;canvas.height=h;var ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);canvas.toBlob(function(blob){resolve(new File([blob],file.name,{type:'image/jpeg'}));},'image/jpeg',quality);};img.onerror=reject;img.src=e.target.result;};reader.onerror=reject;reader.readAsDataURL(file);});}const themeToggle=document.getElementById('themeToggle');const themeIcon=document.getElementById('themeIcon');const prefersDark=window.matchMedia('(prefers-color-scheme: dark)').matches;let currentTheme=localStorage.getItem('ks-theme')||(prefersDark?'dark':'light');function setTheme(theme){document.body.classList.toggle('dark',theme==='dark');themeIcon.className=theme==='dark'?'fas fa-sun':'fas fa-moon';localStorage.setItem('ks-theme',theme);currentTheme=theme;}setTheme(currentTheme);themeToggle.addEventListener('click',function(){setTheme(currentTheme==='dark'?'light':'dark');});const backBtn=document.getElementById('backButton');const from=getParam('from');const page=getParam('page');const folder=getParam('folder');let returnUrl='index.html';if(page)returnUrl+='?page='+page;if(from==='archive'&&folder==='articles'){returnUrl='index.html?return=archive&folder=articles';}else if(from==='archive'){returnUrl='index.html?return=archive';}backBtn.href=returnUrl;let walineInitialized=false;function initWaline(){if(walineInitialized)return Promise.resolve();var commentEl=document.getElementById('waline-comments');if(!commentEl)return Promise.resolve();walineInitialized=true;return import('/assets/waline.js').then(function(module){var init=module.init;init({el:'#waline-comments',serverURL:'https://comment.cuizi.top',lang:'zh-CN',path:'/liuyan',dark:'body.dark

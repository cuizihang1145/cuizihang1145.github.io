        body.dark .icon-wrapper {

        .icon-wrapper img {

        .download-source.secondary {

        .source-label {

    <script>
        const themeToggle = document.getElementById('themeToggle');
        const icon = themeToggle.querySelector('i');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        // 【修改点1】把 nor-theme 改成 ks-theme
        let currentTheme = localStorage.getItem('ks-theme') || (prefersDark ? 'dark' : 'light');

        function setTheme(theme) {
            document.body.classList.toggle('dark', theme === 'dark');
            icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
            // 【修改点2】把 nor-theme 改成 ks-theme
            localStorage.setItem('ks-theme', theme);
            currentTheme = theme;
        }

        setTheme(currentTheme);

        themeToggle.addEventListener('click', () => {
            const next = currentTheme === 'dark' ? 'light' : 'dark';
            setTheme(next);
        });

        // 下载源1 文件检查（Gitee 直链）
        const source1 = document.querySelector('.download-source.primary');
        if (source1) {
            source1.addEventListener('click', function(e) {
                const url = this.getAttribute('href');
                fetch(url, { method: 'HEAD', cache: 'no-cache' })
                    .then(res => {
                        if (!res.ok) {
                            e.preventDefault();
                            alert('下载失败：文件暂时不可用，请尝试备用下载源。');
                        }
                    })
                    .catch(() => {
                        // 不阻止下载，让浏览器自己处理
                    });
            });
        }

        // 下载源2 文件检查（本地）
        const source2 = document.querySelector('.download-source.secondary');
        if (source2) {
            source2.addEventListener('click', function(e) {
                const url = this.getAttribute('href');
                fetch(url, { method: 'HEAD', cache: 'no-cache' })
                    .then(res => {
                        if (!res.ok) {
                            e.preventDefault();
                            alert('下载失败：未找到文件，请尝试下载源1。');
                        }
                    })
                    .catch(() => {});
            });
        }
    </script>

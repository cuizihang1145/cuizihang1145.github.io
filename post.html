<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <link rel="stylesheet" href="{{base}}assets/markdown/markdown.css">
    <link rel="stylesheet" href="{{base}}assets/waline-custom.css">
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" type="image/png" href="/favicon-192x192.png" sizes="192x192">
    {{global_head}}
    <style>
        /* ===== 所有样式直接从你原来的 article.html 复制过来 ===== */
        /* 这里由于篇幅，我放了你原文件里的完整样式，但你也可以直接复制你自己的 */
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body { font-family:'Inter',-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#FAFAFE; color:#1A1A2E; line-height:1.8; min-height:100vh; transition:background .4s ease,color .3s ease; }
        body.dark { background:#14131F; color:#E8E6F0; }
        .reading-progress { position:fixed; top:0; left:0; width:100%; height:3px; background:rgba(0,0,0,.08); z-index:9999; pointer-events:none; opacity:1; transition:opacity .3s ease; }
        body.dark .reading-progress { background:rgba(255,255,255,.1); }
        .reading-progress .progress-bar { height:100%; width:0%; background:#4A90D9; border-radius:0 4px 4px 0; transition:width .05s linear; }
        body.dark .reading-progress .progress-bar { background:#60A5FA; }
        .bg-glow { position:fixed; top:0; left:0; width:100%; height:100%; z-index:-2; background:radial-gradient(circle at 30% 30%,#F6F2FF,#FFFFFF); transition:background .5s ease; }
        body.dark .bg-glow { background:radial-gradient(circle at 30% 30%,#28253D,#0E0D18); }
        .glow-soft { position:fixed; width:70vw; height:70vw; background:radial-gradient(circle,rgba(160,130,230,.15),rgba(210,190,255,0) 70%); border-radius:50%; top:-25vh; right:-20vw; z-index:-1; filter:blur(80px); animation:floatGlow 20s infinite alternate ease-in-out; transition:background .5s ease; }
        body.dark .glow-soft { background:radial-gradient(circle,rgba(120,100,200,.20),rgba(60,40,120,0) 70%); }
        .glow-soft-2 { position:fixed; width:50vw; height:50vw; background:radial-gradient(circle,rgba(200,180,255,.10),rgba(255,240,255,0) 70%); border-radius:50%; bottom:-15vh; left:-10vw; z-index:-1; filter:blur(70px); animation:floatGlow2 22s infinite alternate ease-in-out; transition:background .5s ease; }
        body.dark .glow-soft-2 { background:radial-gradient(circle,rgba(90,70,160,.15),rgba(30,20,60,0) 70%); }
        @keyframes floatGlow { 0%{transform:translate(0,0) scale(1);opacity:.3;} 100%{transform:translate(5%,8%) scale(1.2);opacity:.7;} }
        @keyframes floatGlow2 { 0%{transform:translate(0,0) scale(1);opacity:.2;} 100%{transform:translate(-6%,-5%) scale(1.3);opacity:.6;} }
        .container { max-width:700px; margin:0 auto; padding:2.8rem 1.8rem 2rem; display:flex; flex-direction:column; min-height:100vh; position:relative; }
        .top-buttons { position:fixed; top:20px; left:20px; right:20px; z-index:50; display:flex; justify-content:space-between; align-items:center; pointer-events:none; }
        .top-buttons .left, .top-buttons .right { pointer-events:auto; display:flex; align-items:center; gap:.5rem; }
        .back-btn { background:rgba(255,255,255,.6); backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,.8); border-radius:60px; padding:.5rem 1.2rem .5rem 1rem; display:flex; align-items:center; gap:.5rem; font-size:.85rem; font-weight:500; color:#4F4F78; text-decoration:none; transition:.25s ease; box-shadow:0 6px 20px rgba(80,60,160,.10); cursor:pointer; font-family:'Inter',sans-serif; }
        body.dark .back-btn { background:rgba(30,28,50,.7); border-color:rgba(255,255,255,.08); color:#D0CAF0; box-shadow:0 6px 20px rgba(0,0,0,.3); }
        .back-btn:hover { background:rgba(255,255,255,.85); transform:translateY(-2px) scale(1.02); }
        body.dark .back-btn:hover { background:rgba(50,45,80,.8); }
        .back-btn i { font-size:.9rem; }
        .share-btn { background:rgba(255,255,255,.6); backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,.8); border-radius:60px; width:48px; height:48px; display:flex; align-items:center; justify-content:center; font-size:1.2rem; color:#4F4F78; transition:.25s ease; box-shadow:0 6px 20px rgba(80,60,160,.10); cursor:pointer; }
        body.dark .share-btn { background:rgba(30,28,50,.7); border-color:rgba(255,255,255,.08); color:#D0CAF0; box-shadow:0 6px 20px rgba(0,0,0,.3); }
        .share-btn:hover { background:rgba(255,255,255,.85); transform:scale(1.05); }
        body.dark .share-btn:hover { background:rgba(50,45,80,.8); }
        .share-btn i { font-size:1.2rem; }
        .back-to-top-btn { position:fixed; top:20px; right:80px; z-index:49; width:48px; height:48px; border:none; border-radius:50%; background:rgba(255,255,255,.6); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.8); color:#4F4F78; font-size:1.2rem; cursor:pointer; transition:opacity .35s ease,transform .25s ease,background .3s ease,box-shadow .3s ease; box-shadow:0 6px 20px rgba(80,60,160,.10); opacity:0; pointer-events:none; user-select:none; display:flex; align-items:center; justify-content:center; }
        .back-to-top-btn:hover { transform:scale(1.05); background:rgba(255,255,255,.85); box-shadow:0 10px 28px rgba(80,60,160,.18); }
        .back-to-top-btn.show { opacity:1; pointer-events:auto; }
        .back-to-top-btn:active { transform:scale(.92); }
        .back-to-top-btn.disabled { opacity:.3!important; pointer-events:none!important; }
        body.dark .back-to-top-btn { background:rgba(30,28,50,.7); border-color:rgba(255,255,255,.08); color:#D0CAF0; box-shadow:0 6px 20px rgba(0,0,0,.3); }
        body.dark .back-to-top-btn:hover { background:rgba(50,45,80,.8); }
        .theme-toggle { position:fixed; top:20px; right:24px; z-index:50; background:rgba(255,255,255,.6); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.8); border-radius:60px; width:48px; height:48px; display:flex; align-items:center; justify-content:center; font-size:1.4rem; color:#4F4F78; cursor:pointer; transition:.3s ease; box-shadow:0 6px 20px rgba(80,60,160,.10); user-select:none; }
        .theme-toggle:hover { transform:scale(1.05) rotate(8deg); background:rgba(255,255,255,.85); box-shadow:0 10px 28px rgba(80,60,160,.18); }
        body.dark .theme-toggle { background:rgba(30,28,50,.7); border-color:rgba(255,255,255,.08); color:#D0CAF0; box-shadow:0 6px 20px rgba(0,0,0,.3); }
        body.dark .theme-toggle:hover { background:rgba(50,45,80,.8); }
        @media (max-width:560px) { .back-to-top-btn { top:14px; right:66px; width:42px; height:42px; font-size:1rem; } .theme-toggle { top:14px; right:16px; width:42px; height:42px; font-size:1.2rem; } .share-btn { width:42px; height:42px; font-size:1rem; } .share-btn i { font-size:1rem; } .top-buttons { top:14px; left:14px; right:14px; } .back-btn { padding:.4rem 1rem .4rem .8rem; font-size:.75rem; } .back-btn i { font-size:.8rem; } .reading-progress { height:2px; } }
        .article-detail { max-width:640px; margin:0 auto; padding-top:2rem; width:100%; }
        .article-detail .detail-title { font-size:2rem; font-weight:700; color:#1A1A2E; margin-bottom:.3rem; line-height:1.3; transition:color .3s ease; }
        body.dark .article-detail .detail-title { color:#E8E6F0; }
        .article-detail .detail-date { font-size:.85rem; color:#8A8AB5; margin-bottom:.6rem; display:block; transition:color .3s ease; }
        body.dark .article-detail .detail-date { color:#7A7AA0; }
        .article-detail .detail-tags { display:flex; flex-wrap:wrap; gap:.4rem .6rem; margin-bottom:1rem; }
        .article-detail .detail-tags .tag { display:inline-flex; align-items:center; gap:.25rem; font-size:.75rem; font-weight:500; color:#6B5ACF; background:rgba(107,90,207,.10); padding:.1rem .7rem .1rem .5rem; border-radius:40px; transition:.2s ease; cursor:default; user-select:none; text-decoration:none; }
        body.dark .article-detail .detail-tags .tag { color:#88ccff; background:rgba(136,204,255,.10); }
        .article-detail .detail-divider { border:none; border-top:1px solid rgba(0,0,0,.06); margin-bottom:1.5rem; transition:border-color .3s ease; }
        body.dark .article-detail .detail-divider { border-top-color:rgba(255,255,255,.06); }
        .share-modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0); backdrop-filter:blur(0px); z-index:999; display:none; justify-content:center; align-items:center; padding:1.5rem; opacity:0; visibility:hidden; transition:opacity .3s ease,background .3s ease,backdrop-filter .3s ease,visibility .3s ease; }
        .share-modal-overlay.active { display:flex; opacity:1; visibility:visible; background:rgba(0,0,0,.5); backdrop-filter:blur(8px); }
        .share-modal-overlay .share-modal-box { max-width:480px; width:100%; background:rgba(255,255,255,.85); backdrop-filter:blur(24px); border-radius:2rem; padding:2rem 1.8rem 1.8rem; border:1px solid rgba(255,255,255,.5); box-shadow:0 24px 60px rgba(0,0,0,.15); text-align:center; animation:modalFadeIn .3s ease; transition:background .4s ease,border-color .3s ease,box-shadow .3s ease; max-height:90vh; overflow-y:auto; }
        body.dark .share-modal-overlay .share-modal-box { background:rgba(30,28,50,.92); border-color:rgba(255,255,255,.08); box-shadow:0 24px 60px rgba(0,0,0,.5); }
        @keyframes modalFadeIn { 0%{opacity:0; transform:scale(.92) translateY(20px);} 100%{opacity:1; transform:scale(1) translateY(0);} }
        .share-modal-overlay .share-modal-title { font-size:1.1rem; font-weight:600; color:#1a1a2e; margin-bottom:.8rem; letter-spacing:.3px; text-align:center; }
        body.dark .share-modal-overlay .share-modal-title { color:#fff; }
        .share-modal-overlay .share-modal-title i { margin-right:.5rem; color:#624ed0; }
        body.dark .share-modal-overlay .share-modal-title i { color:#88ccff; }
        #sharePreviewWrap { border-radius:.8rem; overflow:hidden; background:#fff; border:1px solid rgba(0,0,0,.06); margin-bottom:.8rem; }
        #sharePreviewWrap img { width:100%; display:block; }
        .share-modal-actions { display:flex; gap:.6rem; }
        .share-modal-actions button { flex:1; padding:.7rem 1.2rem; border-radius:60px; border:none; font-size:.9rem; font-weight:600; cursor:pointer; transition:.2s ease; font-family:'Inter',sans-serif; display:flex; align-items:center; justify-content:center; gap:.4rem; }
        .share-modal-actions .btn-text { background:rgba(0,0,0,.06); color:#6a6a92; border:1px solid rgba(0,0,0,.06); }
        body.dark .share-modal-actions .btn-text { background:rgba(255,255,255,.08); color:#9a96b8; border-color:rgba(255,255,255,.06); }
        .share-modal-actions .btn-text:hover { background:rgba(0,0,0,.1); }
        body.dark .share-modal-actions .btn-text:hover { background:rgba(255,255,255,.15); }
        .share-modal-actions .btn-image { background:linear-gradient(145deg,#7A6BCF,#624ED0); color:#fff; box-shadow:0 8px 24px rgba(90,70,170,.2); }
        .share-modal-actions .btn-image:hover { transform:scale(1.02); box-shadow:0 12px 32px rgba(90,70,170,.3); }
        body.dark .share-modal-actions .btn-image { box-shadow:0 8px 24px rgba(0,0,0,.3); }
        body.dark .share-modal-actions .btn-image:hover { box-shadow:0 12px 32px rgba(0,0,0,.4); }
        .share-modal-actions .btn-image i { font-size:.9rem; }
        .share-close-btn { margin-top:.6rem; padding:.5rem; background:none; border:none; color:#8a8ab5; font-size:.85rem; cursor:pointer; width:100%; font-family:'Inter',sans-serif; transition:.2s ease; }
        .share-close-btn:hover { color:#4a4a6e; }
        body.dark .share-close-btn:hover { color:#d0caf0; }
        @media (max-width:480px) { .share-modal-overlay .share-modal-box { padding:1.6rem 1.4rem 1.4rem; } .share-modal-actions button { font-size:.8rem; padding:.6rem 1rem; } }
        .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(100px); background:rgba(28,26,44,.92); backdrop-filter:blur(16px); padding:.8rem 2.5rem; border-radius:60px; color:#EFEAFF; font-size:.9rem; font-weight:500; font-family:'Inter',sans-serif; border:1px solid rgba(255,255,255,.08); box-shadow:0 16px 40px rgba(0,0,0,.3); opacity:0; transition:.4s cubic-bezier(.34,1.56,.64,1); z-index:1000; pointer-events:none; white-space:nowrap; min-width:240px; text-align:center; }
        body.dark .toast { background:rgba(20,18,30,.95); border-color:rgba(255,255,255,.05); }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
        .toast i { margin-right:.5rem; font-size:1rem; }
        .toast .fa-check-circle { color:#4ade80; }
        .toast .fa-info-circle { color:#60a5fa; }
        .toast .fa-exclamation-circle { color:#fbbf24; }
        @media (max-width:480px) { .toast { font-size:.8rem; padding:.6rem 1.5rem; min-width:180px; white-space:normal; } }
        #qrTemp { display:none; }
        #waline-comments { max-width:640px; margin:3rem auto 0; padding-top:1.5rem; border-top:1px solid rgba(0,0,0,.06); }
        body.dark #waline-comments { border-top-color:rgba(255,255,255,.06); }
        #waline-comments * { font-family:'Inter',-apple-system,"PingFang SC","Microsoft YaHei",sans-serif!important; }
        #waline-comments .wl-content a { word-break:break-all; overflow-wrap:break-word; max-width:100%; }
    </style>
</head>
<body>
    <div class="reading-progress" id="readingProgress"><div class="progress-bar" id="progressBar"></div></div>
    <div class="bg-glow"></div>
    <div class="glow-soft"></div>
    <div class="glow-soft-2"></div>
    <div class="top-buttons">
        <div class="left">
            <a href="{{base}}index.html" class="back-btn" id="backButton"><i class="fas fa-arrow-left"></i> 返回</a>
            <button class="share-btn" id="shareButton"><i class="fas fa-share-alt"></i></button>
        </div>
        <div class="right">
            <button class="back-to-top-btn" id="backToTopBtn"><i class="fas fa-arrow-up"></i></button>
            <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon" id="themeIcon"></i></button>
        </div>
    </div>
    <div class="container">
        <div id="appContent">
            <div class="article-detail">
                <h1 class="detail-title">{{post_title}}</h1>
                <span class="detail-date">{{post_date}}</span>
                {{post_tags}}
                <hr class="detail-divider">
                <div class="detail-content markdown-body">{{post_content}}</div>
            </div>
        </div>
        <div id="waline-comments"></div>
    </div>

    <!-- 分享弹窗 -->
    <div class="share-modal-overlay" id="shareModal">
        <div class="share-modal-box">
            <div class="share-modal-title"><i class="fas fa-share-alt"></i> 分享</div>
            <div id="sharePreviewWrap"><img id="sharePreviewImg" src="" alt="分享图预览"></div>
            <div class="share-modal-actions">
                <button class="btn-text" id="shareCopyBtn"><i class="fas fa-copy"></i> 复制文字</button>
                <button class="btn-image" id="shareSaveBtn"><i class="fas fa-download"></i> 保存图片</button>
            </div>
            <button class="share-close-btn" id="shareCloseBtn">关闭</button>
        </div>
    </div>
    <div class="share-modal-overlay" id="textModal" style="z-index:1000;">
        <div class="share-modal-box" style="max-width:420px;">
            <div class="share-modal-title"><i class="fas fa-copy"></i> 复制内容</div>
            <div class="share-text-box" id="shareTextDisplay" style="background:rgba(0,0,0,.04);border-radius:12px;padding:.8rem 1rem;text-align:left;font-size:.82rem;line-height:1.8;color:#4a4a6e;word-break:break-all;margin-bottom:1rem;border:1px solid rgba(0,0,0,.04);max-height:200px;overflow-y:auto;font-family:'Inter',sans-serif;">加载中...</div>
            <div class="share-modal-actions">
                <button class="btn-text" id="textModalCancel" style="flex:1;">取消</button>
                <button class="btn-image" id="textModalCopy" style="flex:1;"><i class="fas fa-copy"></i> 复制</button>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <div id="qrTemp"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="{{base}}assets/markdown/markdown.js"></script>
    <script>
        (function() {
            // ===== 阅读进度 =====
            const progressBar = document.getElementById('progressBar');
            const progressWrap = document.getElementById('readingProgress');
            let lastProgress = 0, hideTimer = null;
            function updateReadingProgress() {
                const el = document.querySelector('.article-detail');
                if (!el) { progressBar.style.width = '0%'; return; }
                const rect = el.getBoundingClientRect();
                const h = rect.height, top = rect.top + window.scrollY, winH = window.innerHeight;
                const max = h - winH;
                let p = 0;
                if (max <= 0) p = 100;
                else p = Math.min(Math.max((window.scrollY - top) / max * 100, 0), 100);
                progressBar.style.width = p + '%';
                if (p >= 100 && lastProgress < 100) {
                    if (hideTimer) clearTimeout(hideTimer);
                    hideTimer = setTimeout(() => {
                        progressWrap.style.transition = 'opacity .8s ease';
                        progressWrap.style.opacity = '0';
                        setTimeout(() => progressWrap.style.display = 'none', 800);
                    }, 600);
                }
                if (p < 100) {
                    if (hideTimer) clearTimeout(hideTimer);
                    progressWrap.style.display = 'block';
                    progressWrap.style.opacity = '1';
                    progressWrap.style.transition = 'opacity .3s ease';
                }
                lastProgress = p;
            }
            window.addEventListener('scroll', updateReadingProgress);
            window.addEventListener('resize', updateReadingProgress);
            window.addEventListener('load', updateReadingProgress);

            // ===== 深色模式 =====
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            let currentTheme = localStorage.getItem('ks-theme') || (prefersDark ? 'dark' : 'light');
            function setTheme(theme) {
                document.body.classList.toggle('dark', theme === 'dark');
                themeIcon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
                localStorage.setItem('ks-theme', theme);
                currentTheme = theme;
            }
            setTheme(currentTheme);
            themeToggle.addEventListener('click', () => setTheme(currentTheme === 'dark' ? 'light' : 'dark'));

            // ===== 回到顶部 =====
            const backToTopBtn = document.getElementById('backToTopBtn');
            let isScrollingToTop = false;
            window.addEventListener('scroll', () => {
                const scrollY = window.scrollY || window.pageYOffset;
                if (scrollY > 300 && !isScrollingToTop) backToTopBtn.classList.add('show');
                else if (!isScrollingToTop) backToTopBtn.classList.remove('show');
            });
            function fastScrollToTop() {
                const startY = window.scrollY || window.pageYOffset;
                if (startY === 0) return;
                const duration = 300, startTime = performance.now();
                function step(now) {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const ease = 1 - Math.pow(1 - progress, 3);
                    window.scrollTo(0, startY * (1 - ease));
                    if (progress < 1) requestAnimationFrame(step);
                    else { window.scrollTo(0, 0); isScrollingToTop = false; backToTopBtn.classList.remove('disabled', 'show'); }
                }
                requestAnimationFrame(step);
            }
            backToTopBtn.addEventListener('click', () => {
                if (isScrollingToTop) return;
                const scrollY = window.scrollY || window.pageYOffset;
                if (scrollY === 0) return;
                isScrollingToTop = true;
                backToTopBtn.classList.add('disabled');
                fastScrollToTop();
            });

            // ===== Toast =====
            function showToast(msg, icon) {
                icon = icon || 'fa-info-circle';
                const toast = document.getElementById('toast');
                toast.innerHTML = '<i class="fas ' + icon + '"></i> ' + msg;
                toast.classList.add('show');
                clearTimeout(toast._hideTimer);
                toast._hideTimer = setTimeout(() => toast.classList.remove('show'), 2000);
            }

            // ===== 分享功能 =====
            let currentShareText = '', currentShareImageDataUrl = '';
            const shareModal = document.getElementById('shareModal');
            const sharePreviewImg = document.getElementById('sharePreviewImg');
            const textModal = document.getElementById('textModal');
            const shareTextDisplay = document.getElementById('shareTextDisplay');

            function buildShareData() {
                const title = document.querySelector('.detail-title')?.textContent || '文章';
                const date = document.querySelector('.detail-date')?.textContent || '';
                const contentEl = document.querySelector('.detail-content');
                let plain = '';
                if (contentEl) {
                    const clone = contentEl.cloneNode(true);
                    clone.querySelectorAll('pre, code').forEach(el => el.remove());
                    plain = clone.textContent.trim().slice(0, 80);
                }
                const url = window.location.href;
                currentShareText = title + '：' + (plain || '') + '\n查看完整内容请访问：' + url;
                return { title, date, desc: plain, url };
            }

            function generateShareImage() {
                const data = buildShareData();
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const W = 900, H = 540;
                canvas.width = W; canvas.height = H;
                const grad = ctx.createLinearGradient(0,0,W,H);
                grad.addColorStop(0, '#f8f5ff'); grad.addColorStop(1, '#e8e0ff');
                ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
                ctx.globalAlpha = 0.05;
                for (let i=0;i<6;i++) { ctx.beginPath(); ctx.arc(60+i*160, 40+(i%3)*30, 80, 0, Math.PI*2); ctx.fillStyle='#7a6bcf'; ctx.fill(); }
                ctx.globalAlpha = 1;
                ctx.textAlign = 'right'; ctx.textBaseline = 'top'; ctx.font = '400 14px Inter,sans-serif'; ctx.fillStyle = '#8a8ab5';
                ctx.fillText(data.date || '', W-40, 28);
                ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.font = '700 52px Inter,"PingFang SC",sans-serif'; ctx.fillStyle = '#1a1a2e';
                function wrapText(ctx, text, maxWidth) {
                    const chars = Array.from(text); let lines=[], cur='';
                    for (const ch of chars) { if (ctx.measureText(cur+ch).width > maxWidth) { lines.push(cur); cur=ch; } else cur+=ch; }
                    if (cur) lines.push(cur); return lines;
                }
                function truncateLines(lines, max) { if (lines.length <= max) return lines; const r=lines.slice(0,max); const last=r[r.length-1]; r[r.length-1]=last.slice(0,-1)+'…'; return r; }
                let titleLines = wrapText(ctx, data.title || '无标题', W-260);
                let titleDisplay = truncateLines(titleLines, 2);
                titleDisplay.forEach((line,i) => ctx.fillText(line, 40, 70+i*60));
                let subY = 70 + Math.min(titleDisplay.length,2)*60 + 20;
                ctx.font = '400 22px Inter,"PingFang SC",sans-serif'; ctx.fillStyle = '#4a4a6e';
                let descLines = wrapText(ctx, data.desc || ' ', W-260);
                let descDisplay = truncateLines(descLines, 4);
                descDisplay.forEach((line,i) => ctx.fillText(line, 40, subY+10+i*34));
                let bottomY = H-44;
                ctx.font = '500 16px Inter,"PingFang SC",sans-serif'; ctx.fillStyle = '#6a6a92'; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
                ctx.fillText('ks', 40, bottomY);
                const qrSize = 180, qrX = W - qrSize - 40, qrY = H - qrSize - 40;
                const qrImg = new Image(); qrImg.crossOrigin = 'anonymous';
                qrImg.onload = function() {
                    ctx.shadowColor = 'rgba(0,0,0,.06)'; ctx.shadowBlur = 16; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 4;
                    ctx.drawImage(qrImg, qrX, qrY, qrSize, qrSize);
                    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.font = '400 13px Inter,sans-serif'; ctx.fillStyle = '#aaaacc';
                    ctx.fillText('扫码观看全文', qrX + qrSize/2, qrY + qrSize + 10);
                    ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.font = '400 13px Inter,sans-serif'; ctx.fillStyle = '#c8c8e0';
                    ctx.fillText('cuizi.top', W-40, 18);
                    currentShareImageDataUrl = canvas.toDataURL('image/png');
                    sharePreviewImg.src = currentShareImageDataUrl;
                };
                qrImg.onerror = function() {
                    ctx.fillStyle = '#f0edff'; ctx.fillRect(qrX, qrY, qrSize, qrSize);
                    ctx.fillStyle = '#aaa'; ctx.font = '16px Inter,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('二维码失败', qrX+qrSize/2, qrY+qrSize/2);
                    ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.font = '400 13px Inter,sans-serif'; ctx.fillStyle = '#aaaacc';
                    ctx.fillText('扫码观看全文', qrX+qrSize/2, qrY+qrSize+10);
                    ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.font = '400 13px Inter,sans-serif'; ctx.fillStyle = '#c8c8e0';
                    ctx.fillText('cuizi.top', W-40, 18);
                    currentShareImageDataUrl = canvas.toDataURL('image/png');
                    sharePreviewImg.src = currentShareImageDataUrl;
                };
                qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size='+qrSize+'x'+qrSize+'&data='+encodeURIComponent(data.url);
            }

            document.getElementById('shareButton').addEventListener('click', function() {
                buildShareData(); generateShareImage(); shareModal.classList.add('active'); document.body.style.overflow = 'hidden';
            });
            document.getElementById('shareCloseBtn').addEventListener('click', function() {
                shareModal.classList.remove('active'); document.body.style.overflow = '';
            });
            shareModal.addEventListener('click', function(e) { if (e.target === this) { shareModal.classList.remove('active'); document.body.style.overflow = ''; } });

            document.getElementById('shareCopyBtn').addEventListener('click', function() {
                shareTextDisplay.textContent = currentShareText || '暂无内容'; textModal.classList.add('active');
            });
            document.getElementById('textModalCancel').addEventListener('click', function() { textModal.classList.remove('active'); });
            textModal.addEventListener('click', function(e) { if (e.target === this) textModal.classList.remove('active'); });
            document.getElementById('textModalCopy').addEventListener('click', function() {
                const text = shareTextDisplay.textContent;
                navigator.clipboard.writeText(text).then(() => {
                    showToast('已复制', 'fa-check-circle'); textModal.classList.remove('active');
                    shareModal.classList.remove('active'); document.body.style.overflow = '';
                }).catch(() => {
                    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
                    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
                    showToast('已复制', 'fa-check-circle'); textModal.classList.remove('active');
                    shareModal.classList.remove('active'); document.body.style.overflow = '';
                });
            });
            document.getElementById('shareSaveBtn').addEventListener('click', function() {
                if (!currentShareImageDataUrl) { showToast('图片未生成', 'fa-exclamation-circle'); return; }
                const a = document.createElement('a'); a.href = currentShareImageDataUrl;
                const now = new Date();
                const ts = now.getFullYear().toString().slice(2) +
                    String(now.getMonth()+1).padStart(2,'0') +
                    String(now.getDate()).padStart(2,'0') +
                    String(now.getHours()).padStart(2,'0') +
                    String(now.getMinutes()).padStart(2,'0');
                a.download = '分享图_' + ts + '.png';
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                showToast('已保存', 'fa-check-circle');
            });

            // ===== Waline 评论 =====
            let walineInitialized = false;
            function initWaline() {
                if (walineInitialized) return;
                const el = document.getElementById('waline-comments');
                if (!el) return;
                walineInitialized = true;
                import('https://unpkg.com/@waline/client@v3/dist/waline.js')
                    .then(module => {
                        module.init({
                            el: '#waline-comments',
                            serverURL: 'https://comment.cuizi.top',
                            lang: 'zh-CN',
                            path: window.location.pathname,
                            dark: 'body.dark',
                            imageUploader: function(file) {
                                return new Promise((resolve, reject) => {
                                    const reader = new FileReader();
                                    reader.onload = function() {
                                        const base64 = reader.result.split(',')[1];
                                        fetch('https://comment.cuizi.top/api/upload', {
                                            method: 'POST',
                                            headers: { 'Content-Type': 'application/json' },
                                            body: JSON.stringify({ image: base64, filename: file.name })
                                        }).then(res => res.json()).then(data => resolve(data.url)).catch(reject);
                                    };
                                    reader.readAsDataURL(file);
                                });
                            },
                            emoji: ['https://unpkg.com/@waline/emojis@1.4.0/alus','https://unpkg.com/@waline/emojis@1.4.0/bilibili','https://unpkg.com/@waline/emojis@1.4.0/bmoji','https://unpkg.com/@waline/emojis@1.4.0/qq','https://unpkg.com/@waline/emojis@1.4.0/tieba'],
                            requiredMeta: ['nick','mail'],
                            locale: { placeholder: '邮箱用于接收邮件回复，不会展示给其他人。欢迎评论捏', sofa: '还没有人评论哦！来抢个沙发吧~', submit: '发射!', nick: '昵称*', mail: '邮箱*', link: '网站' }
                        });
                    }).catch(() => { walineInitialized = false; });
            }
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initWaline);
            else initWaline();

            // ===== 代码高亮 =====
            if (typeof hljs !== 'undefined') {
                document.querySelectorAll('.code-line .hljs').forEach(el => { try { hljs.highlightElement(el); } catch(e) {} });
            }

            // ===== 图片灯箱 =====
            if (window.KSMarkdown) {
                const images = document.querySelectorAll('.detail-content img');
                const imageList = [];
                images.forEach(img => { imageList.push({ src: img.getAttribute('src'), alt: img.getAttribute('alt') || '' }); });
                images.forEach((img, idx) => {
                    img.style.cursor = 'pointer';
                    img.addEventListener('click', e => { e.stopPropagation(); window.KSMarkdown.openLightbox(imageList, idx); });
                });
            }

            // ===== 如果标签占位符没被替换，隐藏它 =====
            const tagsContainer = document.querySelector('.detail-tags');
            if (tagsContainer && tagsContainer.innerHTML.trim() === '{{post_tags}}') {
                tagsContainer.style.display = 'none';
            }
        })();
    </script>
</body>
</html>

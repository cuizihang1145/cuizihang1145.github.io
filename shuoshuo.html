function handleUrlId() {
    var urlParams = new URLSearchParams(window.location.search);
    var idParam = urlParams.get('id');
    if (!idParam) return;
    var id = parseInt(idParam, 10);
    if (isNaN(id) || id < 0) return;
    var card = document.querySelector('.shuoshuo-card[data-origin-index="' + id + '"]');
    if (!card) return;
    card.scrollIntoView({ block: 'center', behavior: 'smooth' });
    card.classList.add('highlight-gold');
    setTimeout(function() {
        card.classList.remove('highlight-gold');
    }, 3000);
}

});

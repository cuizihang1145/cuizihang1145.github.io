fetch('shuoshuo.json',{cache:'no-cache'}).then(function(response){if(!response.ok)throw new Error('文件不存在');return response.json();}).then(function(data){allShuoshuo=(data||[]).filter(function(item){return item.delete!==true;}).map(function(item,idx){item._originIndex=idx;return item;});renderShuoshuoList();}).catch(function(){document.getElementById('shuoshuoList').innerHTML='<div style="text-align:center;padding:2rem;color:#8A8AB5;"><i class="far fa-frown"></i> 加载失败</div>';});
}

document.addEventListener('click',function(e){var footnoteRef=e.target.closest('[data-footnote-ref]');if(footnoteRef){e.preventDefault();var refId=footnoteRef.getAttribute('data-footnote-ref');var el=document.getElementById('footnote-def-'+refId);if(el){var targetY=el.getBoundingClientRect().top+window.scrollY-80;window.scrollTo({top:targetY,behavior:'smooth'})}return}var footnoteBack=e.target.closest('[data-footnote-back]');if(footnoteBack){e.preventDefault();var backId=footnoteBack.getAttribute('data-footnote-back');var refLink=document.querySelector('[data-footnote-ref="'+backId+'"]');if(refLink){var targetY=refLink.getBoundingClientRect().top+window.scrollY-80;window.scrollTo({top:targetY,behavior:'smooth'})}return}var copyBtn=e.target.closest('.copy-btn');if(copyBtn){var targetId=copyBtn.dataset.copy;if(!targetId)return;var wrapper=document.getElementById('cbw-'+targetId);if(!wrapper)return;var codeLines=wrapper.querySelectorAll('.code-line');var text='';codeLines.forEach(function(line){var clone=line.cloneNode(true);var lineNum=clone.querySelector('.line-number');if(lineNum)lineNum.remove();text+=clone.textContent+'\n'});text=text.replace(/\n$/,'');navigator.clipboard.writeText(text).then(function(){copyBtn.innerHTML='<i class="fas fa-check"></i> 已复制';copyBtn.classList.add('copied');setTimeout(function(){copyBtn.innerHTML='<i class="fas fa-copy"></i> 复制';copyBtn.classList.remove('copied')},2000)}).catch(function(){var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);copyBtn.innerHTML='<i class="fas fa-check"></i> 已复制';copyBtn.classList.add('copied');setTimeout(function(){copyBtn.innerHTML='<i class="fas fa-copy"></i> 复制';copyBtn.classList.remove('copied')},2000)});return}var collapseBtn=e.target.closest('.collapse-btn');if(collapseBtn){var targetId=collapseBtn.dataset.target;if(!targetId)return;var wrapper=document.getElementById(targetId);if(!wrapper)return;var iconEl=collapseBtn.querySelector('i');wrapper.classList.toggle('collapsed');iconEl.className=wrapper.classList.contains('collapsed')?'fas fa-chevron-down':'fas fa-chevron-up';return}});
})();

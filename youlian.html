<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>友链 · ks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/7.0.1/css/all.css" />
    <link rel="stylesheet" href="/assets/waline-custom.css" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-192x192.png" sizes="192x192" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Inter', -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #FAFAFE;
            color: #1A1A2E;
            line-height: 1.6;
            min-height: 100vh;
            transition: background 0.4s ease, color 0.3s ease;
        }
        body.dark {
            background: #14131F;
            color: #E8E6F0;
        }
        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(circle at 30% 30%, #F6F2FF, #FFFFFF);
            transition: background 0.5s ease;
        }
        body.dark .bg-glow {
            background: radial-gradient(circle at 30% 30%, #28253D, #0E0D18);
        }
        .glow-soft {
            position: fixed;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(160, 130, 230, 0.15), rgba(210, 190, 255, 0) 70%);
            border-radius: 50%;
            top: -25vh;
            right: -20vw;
            z-index: -1;
            filter: blur(80px);
            animation: floatGlow 20s infinite alternate ease-in-out;
            transition: background 0.5s ease;
        }
        body.dark .glow-soft {
            background: radial-gradient(circle, rgba(120, 100, 200, 0.20), rgba(60, 40, 120, 0) 70%);
        }
        .glow-soft-2 {
            position: fixed;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(200, 180, 255, 0.10), rgba(255, 240, 255, 0) 70%);
            border-radius: 50%;
            bottom: -15vh;
            left: -10vw;
            z-index: -1;
            filter: blur(70px);
            animation: floatGlow2 22s infinite alternate ease-in-out;
            transition: background 0.5s ease;
        }
        body.dark .glow-soft-2 {
            background: radial-gradient(circle, rgba(90, 70, 160, 0.15), rgba(30, 20, 60, 0) 70%);
        }
        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
            100% { transform: translate(5%, 8%) scale(1.2); opacity: 0.7; }
        }
        @keyframes floatGlow2 {
            0% { transform: translate(0, 0) scale(1); opacity: 0.2; }
            100% { transform: translate(-6%, -5%) scale(1.3); opacity: 0.6; }
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
            padding: 5rem 1.8rem 2rem;
            min-height: 100vh;
            position: relative;
        }

        .top-bar {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 50;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }
        .top-bar .left,
        .top-bar .right {
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .back-btn {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 60px;
            padding: 0.5rem 1.2rem 0.5rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: #4F4F78;
            text-decoration: none;
            transition: 0.25s ease;
            box-shadow: 0 6px 20px rgba(80, 60, 160, 0.10);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }
        body.dark .back-btn {
            background: rgba(30, 28, 50, 0.7);
            border-color: rgba(255, 255, 255, 0.08);
            color: #D0CAF0;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.85);
            transform: translateY(-2px) scale(1.02);
        }
        body.dark .back-btn:hover {
            background: rgba(50, 45, 80, 0.8);
        }
        .back-btn i {
            font-size: 0.9rem;
        }

        .theme-toggle {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 60px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            color: #4F4F78;
            font-size: 1.4rem;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 6px 20px rgba(80, 60, 160, 0.10);
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }
        body.dark .theme-toggle {
            background: rgba(30, 28, 50, 0.7);
            border-color: rgba(255, 255, 255, 0.08);
            color: #D0CAF0;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        .theme-toggle:hover {
            transform: scale(1.05) rotate(8deg);
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 10px 28px rgba(80, 60, 160, 0.18);
        }
        body.dark .theme-toggle:hover {
            background: rgba(50, 45, 80, 0.8);
        }

        @media (max-width: 560px) {
            .container { padding: 5rem 1.2rem 1.5rem; }
            .top-bar { top: 14px; left: 14px; right: 14px; }
            .back-btn { padding: 0.4rem 1rem 0.4rem 0.8rem; font-size: 0.75rem; }
            .back-btn i { font-size: 0.8rem; }
            .theme-toggle { width: 42px; height: 42px; font-size: 1.2rem; }
        }

        .friends-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.2rem;
            margin-top: 0.5rem;
        }

        .friend-card {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 1.5rem;
            padding: 1.6rem 1.4rem;
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: 0.25s ease;
            text-decoration: none;
            color: #1A1A2E;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        body.dark .friend-card {
            background: rgba(35, 32, 60, 0.55);
            border-color: rgba(255, 255, 255, 0.06);
            color: #E8E6F0;
        }
        .friend-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 36px rgba(80, 60, 160, 0.12);
            background: rgba(255, 255, 255, 0.8);
            border-color: #D6CCFF;
        }
        body.dark .friend-card:hover {
            background: rgba(50, 45, 80, 0.65);
            border-color: rgba(160, 140, 220, 0.25);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.25);
        }

        .friend-logo {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(107, 90, 207, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #6B5ACF;
            margin-bottom: 0.6rem;
            flex-shrink: 0;
        }
        body.dark .friend-logo {
            background: rgba(136, 204, 255, 0.10);
            color: #88ccff;
        }
        .friend-logo img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .friend-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #2D2D4A;
            transition: color 0.3s ease;
        }
        body.dark .friend-name {
            color: #D0CAF0;
        }

        .friend-desc {
            font-size: 0.82rem;
            color: #6A6A92;
            margin: 0.3rem 0 0.6rem;
            line-height: 1.5;
            flex: 1;
            transition: color 0.3s ease;
        }
        body.dark .friend-desc {
            color: #A8A4C8;
        }

        .friend-links {
            display: flex;
            gap: 0.6rem;
            margin-top: 0.2rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .friend-links a {
            display: inline-flex;
            align-items: center;
            gap: 0.2rem;
            font-size: 0.7rem;
            font-weight: 500;
            color: #6B5ACF;
            background: rgba(107, 90, 207, 0.10);
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            text-decoration: none;
            transition: 0.2s ease;
            word-break: break-all;
        }
        body.dark .friend-links a {
            color: #88ccff;
            background: rgba(136, 204, 255, 0.10);
        }
        .friend-links a:hover {
            background: rgba(107, 90, 207, 0.20);
            transform: scale(1.03);
        }
        body.dark .friend-links a:hover {
            background: rgba(136, 204, 255, 0.20);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 1rem;
            color: #8A8AB5;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }
        body.dark .empty-state {
            color: #7A7AA0;
        }
        .empty-state i {
            font-size: 2.4rem;
            display: block;
            margin-bottom: 0.8rem;
            color: #B0A8D0;
        }
        body.dark .empty-state i {
            color: #7A6AA8;
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 1rem;
            color: #8A8AB5;
            transition: color 0.3s ease;
        }
        body.dark .loading {
            color: #7A7AA0;
        }
        .loading i {
            font-size: 2rem;
            display: block;
            margin-bottom: 0.8rem;
            color: #B0A8D0;
        }
        body.dark .loading i {
            color: #7A6AA8;
        }

        .exchange-section {
            margin-top: 0.5rem;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        }
        body.dark .exchange-section {
            border-bottom-color: rgba(255, 255, 255, 0.06);
        }
        .exchange-section .title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #2D2D4A;
            margin-bottom: 0.2rem;
            transition: color 0.3s ease;
        }
        body.dark .exchange-section .title {
            color: #D0CAF0;
        }
        .exchange-section .sub {
            color: #6A6A92;
            font-size: 0.85rem;
            margin-bottom: 1.2rem;
            transition: color 0.3s ease;
        }
        body.dark .exchange-section .sub {
            color: #A8A4C8;
        }
        .exchange-section .sub a {
            color: #6B5ACF;
            text-decoration: underline;
        }
        body.dark .exchange-section .sub a {
            color: #88ccff;
        }

        .format-box {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 0.8rem;
            padding: 0.8rem 1rem;
            font-size: 0.75rem;
            color: #4A4A6E;
            line-height: 1.8;
            max-width: 480px;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }
        body.dark .format-box {
            background: rgba(40, 38, 65, 0.25);
            color: #B8B4D8;
            border-color: rgba(255, 255, 255, 0.04);
        }
        .format-box .label {
            color: #6B5ACF;
            font-weight: 500;
        }
        body.dark .format-box .label {
            color: #88ccff;
        }
        .format-box .break-all {
            word-break: break-all;
        }

        #waline-comments {
            max-width: 640px;
            margin: 3rem auto 0;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
        }
        body.dark #waline-comments {
            border-top-color: rgba(255, 255, 255, 0.06);
        }
        #waline-comments * {
            font-family: 'Inter', -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif !important;
        }
        #waline-comments .wl-content a {
            word-break: break-all;
            overflow-wrap: break-word;
            max-width: 100%;
        }

        .footer {
            margin-top: 2.5rem;
            text-align: center;
            font-size: 0.7rem;
            color: #A8A8CE;
            border-top: 1px solid rgba(0, 0, 0, 0.03);
            padding-top: 1.2rem;
            transition: color 0.3s ease, border-color 0.3s ease;
        }
        body.dark .footer {
            color: #6A6A8A;
            border-top-color: rgba(255, 255, 255, 0.04);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(28, 26, 44, 0.92);
            backdrop-filter: blur(16px);
            padding: 0.8rem 2.5rem;
            border-radius: 60px;
            color: #EFEAFF;
            font-size: 0.9rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 1000;
            pointer-events: none;
            white-space: nowrap;
            min-width: 240px;
            text-align: center;
        }
        body.dark .toast {
            background: rgba(20, 18, 30, 0.95);
            border-color: rgba(255, 255, 255, 0.05);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast i {
            margin-right: 0.5rem;
            font-size: 1rem;
        }
        .toast .fa-check-circle {
            color: #4ade80;
        }
        .toast .fa-info-circle {
            color: #60a5fa;
        }
        .toast .fa-exclamation-circle {
            color: #fbbf24;
        }
        @media (max-width:480px) {
            .toast {
                font-size: 0.8rem;
                padding: 0.6rem 1.5rem;
                min-width: 180px;
                white-space: normal;
            }
        }
    </style>
</head>
<body>

<div class="bg-glow"></div>
<div class="glow-soft"></div>
<div class="glow-soft-2"></div>

<div class="top-bar">
    <div class="left">
        <a href="index.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> 返回
        </a>
    </div>
    <div class="right">
        <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
            <i class="fas fa-moon" id="themeIcon"></i>
        </button>
    </div>
</div>

<div class="container">

    <div class="exchange-section">
        <h2 class="title">交换友链</h2>
        <p class="sub">
            如果你想交换友链，请按以下格式发送至 <a href="mailto:340313894@qq.com">340313894@qq.com</a>，或在评论区留言，我看到后会添加。
        </p>

        <div class="format-box">
            <div><span class="label">名称：</span>ks的博客</div>
            <div><span class="label">介绍：</span>保持好奇，保持诚实。</div>
            <div><span class="label">链接：</span><span class="break-all">https://www.cuizi.top/</span></div>
            <div><span class="label">订阅（可选）：</span><span class="break-all">https://www.cuizi.top/rss.xml</span></div>
            <div><span class="label">头像：</span><span class="break-all">https://raw.githubusercontent.com/cuizihang1145/cuizihang1145.github.io/main/logo.png</span></div>
        </div>
    </div>

    <div id="friendsContainer">
        <div class="loading">
            <i class="fas fa-spinner fa-spin"></i>
            加载中...
        </div>
    </div>

    <div id="waline-comments"></div>

    <footer class="footer">
        © ks · 个人博客 · 2026
    </footer>
</div>

<script>
    (function() {
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        let currentTheme = localStorage.getItem('ks-theme') || (prefersDark ? 'dark' : 'light');

        function setTheme(theme) {
            document.body.classList.toggle('dark', theme === 'dark');
            themeIcon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
            localStorage.setItem('ks-theme', theme);
            currentTheme = theme;
        }
        setTheme(currentTheme);

        themeToggle.addEventListener('click', function() {
            setTheme(currentTheme === 'dark' ? 'light' : 'dark');
        });

        function renderFriends(data) {
            const container = document.getElementById('friendsContainer');

            if (!data || data.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-user-plus"></i>
                        还没有友链呢
                    </div>
                `;
                return;
            }

            let html = '<div class="friends-grid">';
            data.forEach(function(friend) {
                const name = friend.name || '未知';
                const desc = friend.desc || '';
                const url = friend.url || '#';
                const feed = friend.feed || '';
                const logo = friend.logo || 'fas fa-user';

                let logoHtml = '';
                if (logo.startsWith('http://') || logo.startsWith('https://')) {
                    logoHtml = '<img src="' + logo + '" alt="' + name + '" />';
                } else {
                    logoHtml = '<i class="' + logo + '"></i>';
                }

                const feedLink = feed ? `<a href="${feed}" target="_blank" rel="noopener"><i class="fas fa-rss"></i> 订阅</a>` : '';

                html += `
                    <a href="${url}" target="_blank" rel="noopener" class="friend-card">
                        <div class="friend-logo">${logoHtml}</div>
                        <div class="friend-name">${name}</div>
                        <div class="friend-desc">${desc}</div>
                        <div class="friend-links">
                            <a href="${url}" target="_blank" rel="noopener"><i class="fas fa-arrow-right"></i> 访问</a>
                            ${feedLink}
                        </div>
                    </a>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function loadFriends() {
            fetch('youlian.json', { cache: 'no-cache' })
                .then(function(response) {
                    if (!response.ok) throw new Error('文件不存在');
                    return response.json();
                })
                .then(function(data) {
                    renderFriends(data);
                })
                .catch(function() {
                    document.getElementById('friendsContainer').innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-user-plus"></i>
                            还没有友链呢
                        </div>
                    `;
                });
        }

        loadFriends();

        // 评论区
        function initWaline() {
            var commentEl = document.getElementById('waline-comments');
            if (!commentEl) return;
            import('https://unpkg.com/@waline/client@v3/dist/waline.js')
                .then(function(module) {
                    var init = module.init;
                    init({
                        el: '#waline-comments',
                        serverURL: 'https://comment.cuizi.top',
                        lang: 'zh-CN',
                        path: '/friends',
                        dark: 'body.dark',
                        imageUploader: false,
                        emoji: [
                            'https://unpkg.com/@waline/emojis@1.4.0/alus',
                            'https://unpkg.com/@waline/emojis@1.4.0/bilibili',
                            'https://unpkg.com/@waline/emojis@1.4.0/bmoji',
                            'https://unpkg.com/@waline/emojis@1.4.0/qq',
                            'https://unpkg.com/@waline/emojis@1.4.0/tieba'
                        ],
                        requiredMeta: ['nick', 'mail'],
                        locale: {
                            placeholder: '邮箱用于接收邮件回复，不会展示给其他人。欢迎评论、申请！',
                            sofa: '还没有人评论喔',
                            submit: '发射!',
                            nick: '昵称*',
                            mail: '邮箱*',
                            link: '网站'
                        }
                    });
                })
                .catch(function(err) {
                    console.error('Waline 加载失败:', err);
                });
        }

        // 延迟初始化评论区
        setTimeout(initWaline, 500);
    })();
</script>

</body>
</html>
